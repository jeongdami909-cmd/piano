<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Magic Piano: Neon Concert</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root { --neon: #00f2ff; --pink: #ff00ea; --bg: #05050a; }
        * { box-sizing: border-box; user-select: none; font-family: 'Pretendard', sans-serif; touch-action: none; }
        
        @keyframes aurora { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        body { 
            margin: 0; color: #fff; height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
            background: linear-gradient(-45deg, #050011, #001133, #1a0022, #000);
            background-size: 400% 400%; animation: aurora 15s ease infinite;
        }

        #lobby { 
            display: flex; flex-direction: column; height: 100%; width: 100%; max-width: 500px; 
            margin: 0 auto; background: rgba(0,0,0,0.7); backdrop-filter: blur(20px); z-index: 20; position: relative;
        }
        
        header { flex: 0 0 auto; padding: 30px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        header h1 { margin: 0; font-size: 32px; font-weight: 900; background: linear-gradient(90deg, var(--neon), var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 10px rgba(0,229,255,0.6)); text-transform: uppercase; letter-spacing: 2px; }
        header p { margin: 8px 0 0; font-size: 13px; color: #aaa; letter-spacing: 1px; }
        
        #song-list { flex: 1 1 auto; overflow-y: auto; padding: 20px; -webkit-overflow-scrolling: touch; }
        .song-item { 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; 
            padding: 20px; margin-bottom: 15px; display: flex; flex-direction: column; cursor: pointer; transition: all 0.2s ease;
        }
        .song-item.active { border-color: var(--pink); background: rgba(255, 0, 234, 0.1); box-shadow: 0 0 20px rgba(255,0,234,0.3); transform: scale(1.02); }
        .song-genre { font-size: 11px; color: var(--pink); font-weight: bold; margin-bottom: 6px; letter-spacing: 2px; }
        .song-title { font-size: 18px; font-weight: bold; color: #fff; text-shadow: 0 0 5px rgba(255,255,255,0.3); }

        .footer { flex: 0 0 auto; padding: 25px; background: rgba(0,0,0,0.9); border-top: 1px solid #222; }
        #start-btn { 
            width: 100%; padding: 20px; background: linear-gradient(45deg, var(--neon), var(--pink)); color: #fff; 
            font-size: 20px; font-weight: 900; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 20px rgba(255,0,234,0.4); text-transform: uppercase; letter-spacing: 1px; transition: 0.2s;
        }
        #start-btn:active { transform: scale(0.95); }

        /* 비주얼 강화된 게임 화면 */
        #game { display: none; width: 100vw; max-width: 500px; height: 100%; margin: 0 auto; position: relative; overflow: hidden; background: #000; }
        
        /* 네온 그리드 배경 */
        .grid-bg {
            position: absolute; width: 200%; height: 200%; bottom: 0; left: -50%;
            background-image: 
                linear-gradient(rgba(0, 229, 255, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 234, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(600px) rotateX(60deg);
            transform-origin: bottom;
            animation: gridMove 2s linear infinite; z-index: 1;
            pointer-events: none;
        }
        @keyframes gridMove { from { transform: perspective(600px) rotateX(60deg) translateY(0); } to { transform: perspective(600px) rotateX(60deg) translateY(40px); } }

        .lane-bg { position: absolute; width: 25%; height: 100%; border-right: 1px dashed rgba(255,255,255,0.1); z-index: 2; }
        .lane-flash { position: absolute; width: 25%; height: 100%; background: linear-gradient(to top, var(--neon), transparent); opacity: 0; pointer-events: none; transition: opacity 0.15s ease-out; z-index: 3; }
        
        /* 건반 타격존 비주얼 추가 */
        #keys-container { position: absolute; bottom: 10%; width: 100%; height: 80px; display: flex; z-index: 5; }
        .hit-key { 
            flex: 1; border: 1px solid rgba(255,255,255,0.2); border-bottom: none; 
            background: linear-gradient(180deg, transparent, rgba(255,255,255,0.05)); 
            border-top: 3px solid #fff; box-shadow: 0 -5px 15px rgba(0,229,255,0.2); transition: 0.1s;
        }
        .hit-key.active { background: linear-gradient(180deg, transparent, rgba(0,229,255,0.4)); border-top: 3px solid var(--neon); box-shadow: 0 -10px 30px var(--neon); transform: translateY(4px); }

        .tile { 
            position: absolute; width: 25%; height: 140px; border-radius: 8px;
            background: linear-gradient(180deg, rgba(255,255,255,0.8) 0%, var(--neon) 100%);
            border: 2px solid #fff; box-shadow: 0 0 20px var(--neon); z-index: 10;
        }
        .tile.pressed { opacity: 0; transform: scale(1.4); filter: blur(4px); transition: 0.2s ease-out; }

        .particle { position: absolute; width: 8px; height: 8px; background: #fff; border-radius: 50%; pointer-events: none; animation: spark 0.5s forwards ease-out; z-index: 25; }
        @keyframes spark { 0% { transform: scale(1) translate(0,0); opacity: 1; box-shadow: 0 0 20px #fff; } 100% { transform: scale(0) translate(var(--tx), var(--ty)); opacity: 0; } }

        #hud { position: absolute; top: 50px; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 30; pointer-events: none; }
        #score { font-size: 70px; font-weight: 900; text-shadow: 0 0 20px var(--pink), 0 0 40px var(--neon); font-style: italic; }
        #lives { font-size: 24px; margin-top: 5px; letter-spacing: 2px; filter: drop-shadow(0 0 5px rgba(255,0,0,0.5)); }
    </style>
</head>
<body>

<div id="lobby">
    <header>
        <h1>Neon Concert</h1>
        <p>비트에 맞춰 건반을 두드리세요</p>
    </header>
    <div id="song-list"></div>
    <div class="footer">
        <button id="start-btn">PLAY NOW</button>
    </div>
</div>

<div id="game">
    <div class="grid-bg"></div>
    <div id="hud">
        <div id="score">0</div>
        <div id="lives">❤️❤️❤️❤️❤️❤️</div> 
    </div>
    
    <div class="lane-bg" style="left:0%"></div>
    <div class="lane-bg" style="left:25%"></div>
    <div class="lane-bg" style="left:50%"></div>
    <div class="lane-bg" style="left:75%; border:none;"></div>
    
    <div id="flash-0" class="lane-flash" style="left:0%"></div>
    <div id="flash-1" class="lane-flash" style="left:25%"></div>
    <div id="flash-2" class="lane-flash" style="left:50%"></div>
    <div id="flash-3" class="lane-flash" style="left:75%"></div>
    
    <div id="keys-container">
        <div id="key-0" class="hit-key"></div>
        <div id="key-1" class="hit-key"></div>
        <div id="key-2" class="hit-key"></div>
        <div id="key-3" class="hit-key"></div>
    </div>
</div>

<script>
    const library = [
        { g: "CLASSIC", t: "라흐마니노프 - 협주곡 2번", s: 8.5, b: ["C2", "G2", "C3", "G2"], m: ["C4", "Eb4", "G4", "C5", "B4", "G4", "Eb4", "C4", "Bb3", "C4", "Eb4", "G4", "Eb5", "D5", "C5"] },
        { g: "POP", t: "TLC - No Scrubs", s: 8, b: ["C3", "G2", "F2", "G2"], m: ["F4", "F4", "F4", "F4", "E4", "Eb4", "Eb4", "Eb4", "F4", "F4", "F4", "F4", "E4", "Eb4"] },
        { g: "R&B / POP", t: "Prince - Purple Rain", s: 7, b: ["Bb2", "F2", "G2", "Eb2"], m: ["Bb4", "C5", "D5", "F5", "F5", "F5", "D5", "C5", "Bb4", "G4", "F4", "Bb4"] },
        { g: "K-POP", t: "뉴진스 - Ditto", s: 9, b: ["C3", "G3", "A2", "E3"], m: ["C5", "E5", "G5", "C6", "G5", "E5", "C5", "A4", "G4", "F4", "E4", "C4"] },
        { g: "K-POP", t: "BTS - Dynamite", s: 9.5, b: ["C#3", "F#3", "G#3", "C#3"], m: ["G4", "G4", "G4", "G4", "E4", "D4", "C4", "E4", "G4", "A4", "G4", "G4"] },
        { g: "CLASSIC", t: "엘리제를 위하여", s: 7.5, b: ["A2", "E3", "A2", "E3"], m: ["E5", "D#5", "E5", "D#5", "E5", "B4", "D5", "C5", "A4", "C4", "E4", "A4", "B4"] },
        { g: "CLASSIC", t: "차이코프스키 - 백조의 호수", s: 8, b: ["B2", "F#3", "G2", "D3"], m: ["B4", "D5", "E5", "G5", "F#5", "E5", "D5", "B4", "G4", "B4", "D5", "E5"] },
        { g: "EDM", t: "Alan Walker - Faded", s: 9, b: ["F#2", "D2", "A2", "E2"], m: ["F#5", "F#5", "F#5", "E5", "D5", "D5", "D5", "C#5", "A4", "A4", "A4", "E5"] },
        { g: "MOVIE", t: "말할 수 없는 비밀 (Secret)", s: 10, b: ["C3", "G3", "A2", "F2"], m: ["E5", "D#5", "E5", "B4", "D5", "C5", "A4", "C4", "E4", "A4", "B4", "E4"] },
        { g: "CLASSIC", t: "쇼팽 - 흑건", s: 11, b: ["Gb2", "Db3", "Gb2", "Db3"], m: ["Gb5", "Eb5", "Db5", "Bb4", "Gb4", "Eb4", "Db4", "Bb3", "Gb3", "Eb3"] }
    ];

    let selected = 0, bgmSynth, melodySynth, reverb, isPlaying = false, score = 0, lives = 6, nIdx = 0, tiles = [], loopId, spawnId, bgmLoop;
    const TARGET = 100;
    const MAX_LIVES = 6; // 최대 목숨 개수

    const listDiv = document.getElementById('song-list');
    library.forEach((s, i) => {
        const d = document.createElement('div');
        d.className = `song-item ${i === 0 ? 'active' : ''}`;
        d.innerHTML = `<span class="song-genre">${s.g}</span><div class="song-title">${s.t}</div>`;
        d.onclick = () => { document.querySelectorAll('.song-item').forEach(c => c.classList.remove('active')); d.classList.add('active'); selected = i; };
        listDiv.appendChild(d);
    });

    document.getElementById('start-btn').addEventListener('click', async () => {
        const btn = document.getElementById('start-btn');
        if (btn.innerText === "LOADING...") return;
        btn.innerText = "LOADING...";
        await Tone.start();
        if (!bgmSynth) {
            reverb = new Tone.Reverb(2).toDestination();
            bgmSynth = new Tone.PolySynth(Tone.Synth, { oscillator: { type: "sine" }, envelope: { attack: 0.5, release: 1.5 } }).connect(reverb);
            bgmSynth.volume.value = -12;
            melodySynth = new Tone.PolySynth(Tone.Synth, { oscillator: { type: "triangle" }, envelope: { attack: 0.01, decay: 0.3, sustain: 0.2, release: 0.8 } }).connect(reverb);
            melodySynth.volume.value = -2;
        }
        startGame();
    });

    function spark(x, y, color) {
        const stage = document.getElementById('game');
        for(let i=0; i<8; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = x + 'px'; p.style.top = y + 'px';
            p.style.background = color;
            p.style.boxShadow = `0 0 15px ${color}`;
            p.style.setProperty('--tx', (Math.random() - 0.5) * 250 + 'px');
            p.style.setProperty('--ty', (Math.random() - 0.5) * 250 + 'px');
            stage.appendChild(p);
            setTimeout(() => p.remove(), 500);
        }
    }

    function startGame() {
        if (loopId) cancelAnimationFrame(loopId);
        if (spawnId) clearInterval(spawnId);
        if (bgmLoop) clearInterval(bgmLoop);

        document.getElementById('lobby').style.display = 'none';
        document.getElementById('game').style.display = 'block';
        isPlaying = true; score = 0; lives = MAX_LIVES; nIdx = 0; tiles = [];
        document.getElementById('score').innerText = '0';
        updateLivesUI();
        
        const data = library[selected];
        let cIdx = 0;
        bgmLoop = setInterval(() => {
            if(!isPlaying) return;
            bgmSynth.triggerAttackRelease(data.b[cIdx % data.b.length], "1n");
            cIdx++;
        }, 1000);

        gameLoop();
        const interval = Math.max(250, 700 - data.s * 40);
        spawnId = setInterval(createTile, interval);
    }

    function updateLivesUI() {
        document.getElementById('lives').innerText = "❤️".repeat(lives) + "🖤".repeat(MAX_LIVES - lives);
    }

    function createTile() {
        if (!isPlaying || score >= TARGET) return;
        const lane = Math.floor(Math.random() * 4);
        const t = document.createElement('div');
        t.className = 'tile';
        t.style.left = (lane * 25) + '%';
        t.style.top = '-140px';
        
        const note = library[selected].m[nIdx % library[selected].m.length];

        const onHit = (e) => {
            e.preventDefault();
            if (t.classList.contains('pressed')) return;

            const stageHeight = document.getElementById('game').clientHeight;
            // 판정 기준을 하단 건반 영역(bottom: 10% 부근)으로 맞춤
            const hitLineY = stageHeight * 0.85; 
            const rect = t.getBoundingClientRect();
            const tileCenter = rect.top + (rect.height / 2);

            // 판정 오차 범위
            if (Math.abs(tileCenter - hitLineY) > 130) return;

            melodySynth.triggerAttackRelease(note, "8n");
            
            // 시각 이펙트: 플래시 + 건반 눌림
            const color = Math.random() > 0.5 ? 'var(--neon)' : 'var(--pink)';
            spark(rect.left + rect.width/2, rect.top + rect.height, color);
            
            const flash = document.getElementById(`flash-${lane}`);
            flash.style.opacity = '0.6';
            flash.style.background = `linear-gradient(to top, ${color}, transparent)`;
            setTimeout(() => flash.style.opacity = '0', 150);

            const keyEl = document.getElementById(`key-${lane}`);
            keyEl.classList.add('active');
            setTimeout(() => keyEl.classList.remove('active'), 100);

            t.classList.add('pressed');
            score++; 
            const scoreEl = document.getElementById('score');
            scoreEl.innerText = score;
            scoreEl.style.transform = "scale(1.2)";
            setTimeout(() => scoreEl.style.transform = "scale(1)", 100);

            if(score >= TARGET) setTimeout(win, 800);
            
            setTimeout(() => {
                const idx = tiles.indexOf(t);
                if (idx > -1) tiles.splice(idx, 1);
                t.remove();
            }, 200);
        };

        t.addEventListener('pointerdown', onHit, { passive: false });
        document.getElementById('game').appendChild(t);
        tiles.push(t);
        nIdx++;
    }

    function gameLoop() {
        if (!isPlaying) return;
        const stage = document.getElementById('game');
        const h = stage.clientHeight;
        const speed = library[selected].s;

        for (let i = tiles.length - 1; i >= 0; i--) {
            const t = tiles[i];
            let top = parseFloat(t.style.top) + speed;
            t.style.top = top + 'px';

            if (top > h) {
                if(!t.classList.contains('pressed')) {
                    lives--;
                    updateLivesUI();
                    stage.style.boxShadow = "inset 0 0 80px rgba(255,0,0,0.6)";
                    setTimeout(() => stage.style.boxShadow = "none", 200);
                    if(lives <= 0) { gameOver(); return; }
                }
                t.remove(); tiles.splice(i, 1);
            }
        }
        loopId = requestAnimationFrame(gameLoop);
    }

    function gameOver() {
        isPlaying = false; clearInterval(spawnId); clearInterval(bgmLoop); cancelAnimationFrame(loopId);
        setTimeout(() => { alert(`GAME OVER\n최종 점수: ${score}`); location.reload(); }, 100);
    }

    function win() {
        isPlaying = false; clearInterval(spawnId); clearInterval(bgmLoop); cancelAnimationFrame(loopId);
        setTimeout(() => { alert(`✨ PERFECT STAGE ✨\n100점 달성을 축하합니다!`); location.reload(); }, 100);
    }
</script>
</body>
</html>
