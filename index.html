<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Magic Piano: MP3 Concert</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root { --neon: #00f2ff; --pink: #ff00ea; --bg: #05050a; }
        * { box-sizing: border-box; user-select: none; font-family: 'Pretendard', sans-serif; touch-action: none; }
        
        body { 
            margin: 0; color: #fff; height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
            background: #000;
        }

        #lobby { 
            display: flex; flex-direction: column; height: 100%; width: 100%; max-width: 500px; 
            margin: 0 auto; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); z-index: 20; position: relative;
        }
        
        header { padding: 30px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        header h1 { margin: 0; font-size: 32px; font-weight: 900; background: linear-gradient(90deg, var(--neon), var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        header p { margin: 8px 0 0; font-size: 13px; color: #aaa; }
        
        #song-list { flex: 1; overflow-y: auto; padding: 20px; }
        .song-item { 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; 
            padding: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s;
        }
        .song-item.active { border-color: var(--pink); background: rgba(255, 0, 234, 0.1); transform: scale(1.02); }
        
        .song-info { display: flex; flex-direction: column; }
        .song-title { font-size: 18px; font-weight: bold; color: #fff; }
        
        .level-badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .level-하 { background: #00e5ff; color: #000; }
        .level-중 { background: #ffea00; color: #000; }
        .level-상 { background: #ff00ea; color: #fff; }

        .footer { padding: 25px; background: rgba(0,0,0,0.9); }
        #start-btn { 
            width: 100%; padding: 20px; background: linear-gradient(45deg, var(--neon), var(--pink)); color: #fff; 
            font-size: 20px; font-weight: 900; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 20px rgba(255,0,234,0.4); 
        }

        #game { display: none; width: 100vw; max-width: 500px; height: 100%; margin: 0 auto; position: relative; overflow: hidden; background: #050011; }
        
        .lane-bg { position: absolute; width: 25%; height: 100%; border-right: 1px dashed rgba(255,255,255,0.1); }
        #keys-container { position: absolute; bottom: 10%; width: 100%; height: 80px; display: flex; z-index: 5; }
        .hit-key { flex: 1; border-top: 3px solid #fff; background: linear-gradient(180deg, transparent, rgba(255,255,255,0.05)); }
        
        .tile { 
            position: absolute; width: 25%; height: 140px; border-radius: 8px;
            background: linear-gradient(180deg, rgba(255,255,255,0.8) 0%, var(--neon) 100%);
            border: 2px solid #fff; box-shadow: 0 0 20px var(--neon); z-index: 10;
        }
        .tile.pressed { opacity: 0; transform: scale(1.4); transition: 0.1s ease-out; }

        #hud { position: absolute; top: 50px; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 30; pointer-events: none; }
        #score { font-size: 60px; font-weight: 900; text-shadow: 0 0 20px var(--pink); }
        #lives { font-size: 24px; margin-top: 5px; }
    </style>
</head>
<body>

<div id="lobby">
    <header>
        <h1>Neon Concert</h1>
        <p>원곡 플레이 & 하/중/상 난이도 선택</p>
    </header>
    <div id="song-list"></div>
    <div class="footer">
        <button id="start-btn">PLAY NOW</button>
    </div>
</div>

<div id="game">
    <div id="hud">
        <div id="score">0</div>
        <div id="lives">❤️❤️❤️❤️❤️❤️</div> 
    </div>
    
    <div class="lane-bg" style="left:0%"></div>
    <div class="lane-bg" style="left:25%"></div>
    <div class="lane-bg" style="left:50%"></div>
    <div class="lane-bg" style="left:75%; border:none;"></div>
    
    <div id="keys-container">
        <div id="key-0" class="hit-key"></div>
        <div id="key-1" class="hit-key"></div>
        <div id="key-2" class="hit-key"></div>
        <div id="key-3" class="hit-key"></div>
    </div>
</div>

<script>
    // 🎧 여기에 네 MP3 파일 이름을 넣으면 돼! (예: "music1.mp3")
    // 난이도(level)에 따라 떨어지는 속도(speed)와 생성주기(spawnRate)가 달라져.
    const library = [
        { t: "너의 의미 (Easy)", level: "하", speed: 6, spawnRate: 800, audioUrl: "https://tonejs.github.io/audio/berklee/gong_1.mp3" }, // 임시 무료 음원 링크
        { t: "밤주줄 (Normal)", level: "중", speed: 9, spawnRate: 500, audioUrl: "https://tonejs.github.io/audio/loop/FW3.mp3" },
        { t: "쇼팽 하이라이트 (Hard)", level: "상", speed: 13, spawnRate: 300, audioUrl: "https://tonejs.github.io/audio/casio/A1.mp3" }
    ];

    let selected = 0, hitSynth, bgmPlayer, isPlaying = false, score = 0, lives = 6, tiles = [], loopId, spawnId;
    const TARGET = 100;
    const MAX_LIVES = 6;

    const listDiv = document.getElementById('song-list');
    library.forEach((s, i) => {
        const d = document.createElement('div');
        d.className = `song-item ${i === 0 ? 'active' : ''}`;
        d.innerHTML = `
            <div class="song-info">
                <span class="song-title">${s.t}</span>
            </div>
            <div class="level-badge level-${s.level}">${s.level}</div>
        `;
        d.onclick = () => { document.querySelectorAll('.song-item').forEach(c => c.classList.remove('active')); d.classList.add('active'); selected = i; };
        listDiv.appendChild(d);
    });

    document.getElementById('start-btn').addEventListener('click', async () => {
        const btn = document.getElementById('start-btn');
        if (btn.innerText.includes("LOADING")) return;
        
        btn.innerText = "🎵 음원 로딩 중...";
        await Tone.start();
        
        // 타격 효과음 (유저가 눌렀을 때 맑은 피아노/벨 소리가 남)
        if (!hitSynth) {
            hitSynth = new Tone.PolySynth(Tone.Synth, { 
                oscillator: { type: "triangle" }, 
                envelope: { attack: 0.01, decay: 0.2, sustain: 0.1, release: 0.5 } 
            }).toDestination();
            hitSynth.volume.value = -2;
        }

        const song = library[selected];

        // 🎵 MP3 배경음악 플레이어 설정
        if (bgmPlayer) { bgmPlayer.dispose(); } // 이전 곡 제거
        bgmPlayer = new Tone.Player({
            url: song.audioUrl,
            loop: true,
            autostart: false,
            onload: () => {
                startGame(song);
            }
        }).toDestination();
        bgmPlayer.volume.value = -5; // BGM 볼륨 (너무 크면 타격음이 안 들림)
    });

    function startGame(song) {
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('game').style.display = 'block';
        isPlaying = true; score = 0; lives = MAX_LIVES; tiles = [];
        document.getElementById('score').innerText = '0';
        updateLivesUI();
        
        // BGM 시작
        bgmPlayer.start();

        gameLoop(song.speed);
        // 난이도에 맞는 타일 생성 주기(spawnRate) 적용
        spawnId = setInterval(() => createTile(song.speed), song.spawnRate);
    }

    function updateLivesUI() {
        document.getElementById('lives').innerText = "❤️".repeat(lives) + "🖤".repeat(MAX_LIVES - lives);
    }

    // 타격할 때 랜덤하게 어울리는 음계 재생 (원곡에 얹혀지는 느낌)
    const hitNotes = ["C5", "E5", "G5", "B5", "C6"];

    function createTile(speed) {
        if (!isPlaying || score >= TARGET) return;
        const lane = Math.floor(Math.random() * 4);
        const t = document.createElement('div');
        t.className = 'tile';
        t.style.left = (lane * 25) + '%';
        t.style.top = '-140px';
        
        const onHit = (e) => {
            e.preventDefault();
            if (t.classList.contains('pressed')) return;

            const stageHeight = document.getElementById('game').clientHeight;
            const hitLineY = stageHeight * 0.85; 
            const rect = t.getBoundingClientRect();
            
            // 판정
            if (Math.abs((rect.top + rect.height / 2) - hitLineY) > 130) return;

            // 타격음 재생
            const randomNote = hitNotes[Math.floor(Math.random() * hitNotes.length)];
            hitSynth.triggerAttackRelease(randomNote, "16n");

            t.classList.add('pressed');
            score++; document.getElementById('score').innerText = score;
            
            if(score >= TARGET) setTimeout(win, 500);
            
            setTimeout(() => {
                const idx = tiles.indexOf(t);
                if (idx > -1) tiles.splice(idx, 1);
                t.remove();
            }, 100);
        };

        t.addEventListener('pointerdown', onHit, { passive: false });
        document.getElementById('game').appendChild(t);
        tiles.push(t);
    }

    function gameLoop(speed) {
        if (!isPlaying) return;
        const stage = document.getElementById('game');
        const h = stage.clientHeight;

        for (let i = tiles.length - 1; i >= 0; i--) {
            const t = tiles[i];
            let top = parseFloat(t.style.top) + speed;
            t.style.top = top + 'px';

            if (top > h) {
                if(!t.classList.contains('pressed')) {
                    lives--;
                    updateLivesUI();
                    if(lives <= 0) { gameOver(); return; }
                }
                t.remove(); tiles.splice(i, 1);
            }
        }
        loopId = requestAnimationFrame(() => gameLoop(speed));
    }

    function gameOver() {
        isPlaying = false; clearInterval(spawnId); bgmPlayer.stop(); cancelAnimationFrame(loopId);
        setTimeout(() => { alert(`GAME OVER\n최종 점수: ${score}`); location.reload(); }, 100);
    }

    function win() {
        isPlaying = false; clearInterval(spawnId); bgmPlayer.stop(); cancelAnimationFrame(loopId);
        setTimeout(() => { alert(`✨ 클리어! ✨\n완벽하게 연주했습니다!`); location.reload(); }, 100);
    }
</script>
</body>
</html>
