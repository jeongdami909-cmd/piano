<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fixed Piano Tiles</title>
    <style>
        :root { --bg: #0b0b0b; --accent: #00d4ff; }
        * { 
            /* 텍스트 선택 및 드래그 방지 */
            -webkit-user-select: none; user-select: none; 
            /* 터치 시 파란색 하이라이트 제거 */
            -webkit-tap-highlight-color: transparent;
            /* 브라우저 기본 터치 동작(확대, 스크롤) 차단 */
            touch-action: none;
        }
        body { 
            margin: 0; background: var(--bg); color: #fff; 
            display: flex; flex-direction: column; align-items: center;
            font-family: 'Pretendard', sans-serif; overflow: hidden; height: 100vh;
        }
        
        #menu-screen { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.95); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
        }
        .song-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; width: 90%; }
        .song-card { 
            background: #1a1a1a; padding: 12px; border-radius: 10px; cursor: pointer; border: 1px solid #333;
            text-align: center; font-size: 14px;
        }
        .song-card.active { border-color: var(--accent); background: rgba(0,212,255,0.2); }

        #game-view { 
            width: 100vw; max-width: 450px; height: 100vh; background: #000; 
            position: relative; overflow: hidden; border-left: 1px solid #222; border-right: 1px solid #222;
        }
        .lane-line { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.1); pointer-events: none; }
        
        .tile { 
            width: 25%; position: absolute; border-radius: 2px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .tile.hit { opacity: 0; transform: scale(1.1); transition: 0.1s; }
        
        #score-display { 
            position: absolute; top: 50px; font-size: 60px; font-weight: 900; 
            width: 100%; text-align: center; z-index: 5; opacity: 0.5; pointer-events: none; 
        }
        button { 
            padding: 15px 50px; font-size: 20px; border-radius: 30px; border: none; 
            background: var(--accent); color: #000; font-weight: bold; margin-top: 20px;
        }
    </style>
</head>
<body>

<div id="menu-screen">
    <h1 style="color:var(--accent)">PIANO MASTER</h1>
    <div class="song-list" id="songs"></div>
    <button onclick="startGame()">연주 시작</button>
</div>

<div id="score-display">0</div>
<div id="game-view">
    <div class="lane-line" style="left: 25%;"></div>
    <div class="lane-line" style="left: 50%;"></div>
    <div class="lane-line" style="left: 75%;"></div>
</div>

<script>
    const songData = [
        { id:0, title: "작은 별", speed: 5, color: "#a8e6cf", notes: [261, 261, 392, 392, 440, 440, 392] },
        { id:1, title: "차이코프스키", speed: 7.5, color: "#9b59b6", notes: [493, 587, 659, 783, 739, 659, 587] },
        { id:2, title: "라흐마니노프", speed: 11, color: "#e74c3c", notes: [261, 329, 392, 523, 493, 392, 329, 261] }
    ];

    let currentSong = songData[0];
    let isPlaying = false;
    let score = 0;
    let audioCtx;
    let noteIdx = 0;
    let tiles = [];
    let spawnHandler;

    const songContainer = document.getElementById('songs');
    songData.forEach(song => {
        const div = document.createElement('div');
        div.className = `song-card ${song.id === 0 ? 'active' : ''}`;
        div.innerHTML = song.title;
        div.onclick = () => {
            document.querySelectorAll('.song-card').forEach(c => c.classList.remove('active'));
            div.classList.add('active');
            currentSong = song;
        };
        songContainer.appendChild(div);
    });

    function playSound() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = currentSong.notes[noteIdx % currentSong.notes.length];
        noteIdx++;
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }

    function createTile() {
        if (!isPlaying) return;
        const lane = Math.floor(Math.random() * 4);
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.style.left = (lane * 25) + '%';
        tile.style.top = '-200px';
        tile.style.height = '180px';
        tile.style.background = currentSong.color;

        // 클릭과 터치 모두 대응하되, 중복 실행 방지
        const handleHit = (e) => {
            e.preventDefault(); // 화면 밀림 방지 핵심!
            if (tile.classList.contains('hit')) return;
            playSound();
            score++;
            document.getElementById('score-display').innerText = score;
            tile.classList.add('hit');
            setTimeout(() => { tile.remove(); }, 100);
        };

        tile.addEventListener('touchstart', handleHit);
        tile.addEventListener('mousedown', handleHit);

        document.getElementById('game-view').appendChild(tile);
        tiles.push(tile);
    }

    function gameLoop() {
        if (!isPlaying) return;
        tiles.forEach((tile, i) => {
            let top = parseFloat(tile.style.top) + currentSong.speed;
            tile.style.top = top + 'px';
            if (top > window.innerHeight) {
                if (!tile.classList.contains('hit')) endGame();
                else { tile.remove(); tiles.splice(i, 1); }
            }
        });
        requestAnimationFrame(gameLoop);
    }

    function startGame() {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        document.getElementById('menu-screen').style.display = 'none';
        isPlaying = true; score = 0; noteIdx = 0;
        document.getElementById('score-display').innerText = '0';
        gameLoop();
        spawnHandler = setInterval(createTile, 1000 / (currentSong.speed / 4));
    }

    function endGame() {
        isPlaying = false;
        clearInterval(spawnHandler);
        alert(`공연 종료! 점수: ${score}`);
        location.reload();
    }
</script>
</body>
</html>
