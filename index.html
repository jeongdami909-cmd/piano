<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Piano Master: Full Song Edition</title>
    <style>
        :root { --neon: #00f2ff; --pink: #ff007b; --bg: #050508; --card: #15151a; }
        * { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; box-sizing: border-box; touch-action: none; }
        
        body { 
            margin: 0; background: var(--bg); color: #fff; font-family: sans-serif;
            height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
        }

        #home { display: flex; flex-direction: column; height: 100%; width: 100%; max-width: 500px; margin: 0 auto; background: var(--bg); }
        header { padding: 30px 20px 5px; text-align: center; flex-shrink: 0; }
        header h1 { font-size: 26px; color: var(--neon); text-shadow: 0 0 10px var(--neon); margin: 0; }

        /* 곡 목록: 끝까지 다 보이도록 패딩 넉넉히 */
        #song-list { 
            flex: 1; overflow-y: auto; padding: 15px 20px 20px; 
            -webkit-overflow-scrolling: touch; 
        }
        .card { 
            background: var(--card); margin-bottom: 12px; padding: 18px; 
            border-radius: 12px; border: 2px solid #222; display: flex; justify-content: space-between; align-items: center;
        }
        .card.selected { border-color: var(--neon); background: rgba(0, 242, 255, 0.1); }

        /* 하단 시작 버튼 영역 */
        .footer { padding: 15px 20px 25px; background: var(--bg); border-top: 1px solid #222; flex-shrink: 0; }
        #start-btn { 
            width: 100%; padding: 18px; background: var(--neon); color: #000; 
            border: none; border-radius: 50px; font-size: 20px; font-weight: bold; 
            box-shadow: 0 8px 20px rgba(0, 242, 255, 0.3);
        }

        /* 게임 화면 */
        #stage { display: none; width: 100vw; max-width: 500px; height: 100%; background: #000; position: relative; margin: 0 auto; }
        .tile { 
            width: 25%; position: absolute; border-radius: 6px; 
            border: 2px solid var(--neon); background: linear-gradient(135deg, #222, #000);
            box-shadow: 0 0 12px rgba(0, 242, 255, 0.2);
        }
        .tile.pressed { background: var(--pink) !important; border-color: #fff; opacity: 0; transform: scale(1.1); transition: 0.1s; }
        
        #hud { position: absolute; top: 40px; width: 100%; display: flex; flex-direction: column; align-items: center; pointer-events: none; z-index: 10; }
        #score { font-size: 40px; font-weight: 900; opacity: 0.5; }
        #lives { font-size: 20px; color: var(--pink); letter-spacing: 4px; }
    </style>
</head>
<body>

<div id="home">
    <header>
        <h1>PIANO MASTER PRO</h1>
        <p style="font-size: 13px; color: #666; margin-top: 5px;">풀 스코어 완주 시스템</p>
    </header>
    <div id="song-list"></div>
    <div class="footer">
        <button id="start-btn" onclick="startGame()">CONCERT START</button>
    </div>
</div>

<div id="stage">
    <div id="hud">
        <div id="score">0</div>
        <div id="lives">❤️❤️❤️</div>
    </div>
</div>

<script>
    // 곡 데이터 (풀 버전 악보)
    const library = [
        { 
            t: "엘리제를 위하여", s: 6.5, 
            n: [659, 622, 659, 622, 659, 493, 587, 523, 440, 261, 330, 440, 493, 330, 415, 493, 523, 659, 622, 659, 622, 659, 493, 587, 523, 440, 261, 330, 523, 493, 440] 
        },
        { 
            t: "라흐마니노프 협주곡 2번", s: 9.5, 
            n: [261, 311, 392, 523, 493, 392, 311, 261, 233, 261, 311, 392, 622, 587, 523, 493, 523, 392, 311, 261, 196, 261, 311, 392, 783, 739, 659, 587, 523, 493, 523]
        },
        { 
            t: "BTS - Dynamite", s: 8, 
            n: [392, 392, 392, 392, 330, 294, 262, 330, 392, 440, 392, 392, 392, 392, 330, 294, 262, 262, 330, 349, 392, 392, 392, 392, 440, 392, 330, 294, 262]
        }
    ];

    let selected = library[0];
    let audioCtx, isPlaying = false, score = 0, lives = 3, nIdx = 0, spawnCount = 0;
    let tiles = [], loopId, spawnId, stageHeight;

    // UI 생성
    const list = document.getElementById('song-list');
    library.forEach((song, i) => {
        const card = document.createElement('div');
        card.className = `card ${i === 0 ? 'selected' : ''}`;
        card.innerHTML = `<div><h3>${song.t}</h3><small>Full Melody</small></div><div style="color:var(--neon)">♬</div>`;
        card.onclick = () => {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            selected = song;
        };
        list.appendChild(card);
    });

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playPiano(f) {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, now);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 1.0);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(); osc.stop(now + 1.0);
    }

    function createTile() {
        if (!isPlaying || spawnCount >= selected.n.length) {
            clearInterval(spawnId);
            return;
        }
        
        const lane = Math.floor(Math.random() * 4);
        const t = document.createElement('div');
        t.className = 'tile';
        t.style.left = (lane * 25) + '%';
        t.style.top = '-200px';
        t.style.height = '160px';
        t.dataset.idx = spawnCount;

        const onHit = (e) => {
            e.preventDefault();
            if (t.classList.contains('pressed')) return;
            playPiano(selected.n[parseInt(t.dataset.idx)]);
            score++;
            document.getElementById('score').innerText = score;
            t.classList.add('pressed');
            
            // 모든 노드를 다 쳤을 때 승리 판정
            if (score === selected.n.length) {
                setTimeout(winGame, 500);
            }
        };

        t.addEventListener('pointerdown', onHit);
        document.getElementById('stage').appendChild(t);
        tiles.push(t);
        spawnCount++;
    }

    function gameLoop() {
        if (!isPlaying) return;
        stageHeight = document.getElementById('stage').clientHeight;

        for (let i = tiles.length - 1; i >= 0; i--) {
            const t = tiles[i];
            let top = parseFloat(t.style.top) + selected.s;
            t.style.top = top + 'px';

            // 놓친 경우 (Miss)
            if (top > stageHeight - 50 && !t.classList.contains('pressed')) {
                lives--;
                updateLives();
                t.remove();
                tiles.splice(i, 1);
                if (lives <= 0) { endGame(); return; }
                continue;
            }

            if (top > stageHeight) {
                t.remove();
                tiles.splice(i, 1);
            }
        }
        loopId = requestAnimationFrame(gameLoop);
    }

    function updateLives() {
        document.getElementById('lives').innerText = "❤️".repeat(lives) + "🖤".repeat(3 - lives);
    }

    function startGame() {
        initAudio();
        document.getElementById('home').style.display = 'none';
        document.getElementById('stage').style.display = 'block';
        isPlaying = true; score = 0; lives = 3; spawnCount = 0; tiles = [];
        updateLives();
        document.getElementById('score').innerText = '0';
        gameLoop();
        spawnId = setInterval(createTile, 600 / (selected.s / 8));
    }

    function winGame() {
        isPlaying = false;
        clearInterval(spawnId);
        cancelAnimationFrame(loopId);
        alert(`✨ 공연 대성공! ✨\n완벽하게 연주했습니다.\n최종 점수: ${score}`);
        location.reload();
    }

    function endGame() {
        isPlaying = false;
        clearInterval(spawnId);
        cancelAnimationFrame(loopId);
        alert(`커튼콜 종료\n다음에 다시 도전하세요.\n최종 점수: ${score}`);
        location.reload();
    }
</script>
</body>
</html>
