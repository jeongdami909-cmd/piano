<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Piano Tiles Pro: Masterpiece</title>
    <style>
        :root { --neon: #00f2ff; --hit: #ff007b; --bg: #0a0a0c; }
        * { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Pretendard', sans-serif; height: 100vh; overflow: hidden; display: flex; justify-content: center; }
        
        /* 홈 화면 */
        #home { position: absolute; inset: 0; background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a0c 100%); z-index: 100; display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
        .scroll-area { width: 90%; max-width: 400px; height: 60vh; overflow-y: auto; padding-right: 10px; }
        .song-card { background: rgba(255,255,255,0.05); margin: 10px 0; padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .song-card.selected { border-color: var(--neon); background: rgba(0, 242, 255, 0.1); box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); }
        .song-info h3 { margin: 0; font-size: 18px; }
        .song-info p { margin: 5px 0 0; font-size: 12px; color: #888; }

        /* 게임 엔진 */
        #game-stage { width: 100vw; max-width: 450px; height: 100vh; background: #000; position: relative; border-left: 1px solid #222; border-right: 1px solid #222; }
        .lane { position: absolute; top: 0; bottom: 0; width: 25%; border-right: 1px solid rgba(255,255,255,0.05); }
        .tile { width: 25%; position: absolute; border-radius: 4px; background: linear-gradient(to bottom, #222, #000); border: 1px solid #333; box-shadow: inset 0 0 10px rgba(255,255,255,0.1); }
        .tile.pressed { background: var(--neon) !important; box-shadow: 0 0 30px var(--neon); opacity: 0; transition: 0.1s; transform: scale(1.1); }
        
        #hud { position: absolute; top: 40px; width: 100%; text-align: center; font-size: 50px; font-weight: 900; opacity: 0.4; pointer-events: none; z-index: 10; }
        #start-bar { position: absolute; bottom: 50px; width: 80%; left: 10%; padding: 15px; background: var(--neon); color: #000; border: none; border-radius: 50px; font-size: 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="home">
    <h1 style="letter-spacing: 5px; color: var(--neon);">PIANO TILES PRO</h1>
    <div class="scroll-area" id="song-list"></div>
    <button id="start-bar" onclick="startGame()">CONCERT START</button>
</div>

<div id="game-stage">
    <div id="hud">0</div>
    <div class="lane" style="left: 0%;"></div>
    <div class="lane" style="left: 25%;"></div>
    <div class="lane" style="left: 50%;"></div>
    <div class="lane" style="left: 75%;"></div>
</div>

<script>
    // 풍성한 곡 데이터 (이지/미디움/하드)
    const library = [
        { title: "비행기", level: "Easy", speed: 5, notes: [330, 294, 262, 294, 330, 330, 330, 294, 294, 294, 330, 392, 392] },
        { title: "옹달샘", level: "Easy", speed: 5, notes: [392, 262, 262, 262, 392, 330, 330, 330, 392, 330, 262, 330, 294] },
        { title: "환희의 송가", level: "Easy", speed: 6, notes: [330, 330, 349, 392, 392, 349, 330, 294, 262, 262, 294, 330, 330, 294, 294] },
        
        { title: "엘리제를 위하여", level: "Mid", speed: 8, notes: [659, 622, 659, 622, 659, 493, 587, 523, 440, 262, 330, 440, 493, 330, 415, 493, 523] },
        { title: "백조의 호수", level: "Mid", speed: 8.5, notes: [493, 587, 659, 783, 739, 659, 587, 493, 392, 493, 587, 659, 783, 739, 659, 587] },
        { title: "캐논 변주곡", level: "Mid", speed: 9, notes: [783, 739, 659, 587, 523, 493, 440, 392, 523, 493, 440, 392, 349, 330, 294, 262] },

        { title: "라흐마니노프 협주곡 2번", level: "Hard", speed: 12, notes: [261, 311, 392, 523, 493, 392, 311, 261, 233, 261, 311, 392, 622, 587, 523, 493, 523] },
        { title: "왕벌의 비행", level: "Hard", speed: 15, notes: [440, 415, 392, 370, 349, 330, 311, 293, 277, 261, 246, 233, 220, 207, 196, 185, 174] },
        { title: "혁명 연습곡", level: "Hard", speed: 13, notes: [440, 220, 261, 329, 440, 523, 659, 880, 783, 659, 523, 440, 329, 261, 220, 110] }
    ];

    let selectedSong = library[0];
    let audioCtx;
    let isPlaying = false;
    let score = 0;
    let noteIdx = 0;
    let tiles = [];
    let spawnTimer;

    // 리스트 렌더링
    const list = document.getElementById('song-list');
    library.forEach((s, i) => {
        const card = document.createElement('div');
        card.className = `song-card ${i === 0 ? 'selected' : ''}`;
        card.innerHTML = `<div class="song-info"><h3>${s.title}</h3><p>${s.level} | Speed ${s.speed}</p></div>`;
        card.onclick = () => {
            document.querySelectorAll('.song-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            selectedSong = s;
        };
        list.appendChild(card);
    });

    // 고급 합성 사운드 (배음 추가)
    function playPiano(freq) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        
        const playTone = (f, vol, decay) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, now);
            gain.gain.setValueAtTime(vol, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + decay);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(); osc.stop(now + decay);
        };

        // 기본음 + 옥타브 배음을 섞어 피아노 느낌 재현
        playTone(freq, 0.4, 0.8);
        playTone(freq * 2, 0.15, 0.5); // 배음 1
        playTone(freq * 4, 0.05, 0.3); // 배음 2
        
        // 웅장한 베이스 반주 자동 생성
        if (noteIdx % 4 === 0) {
            playTone(freq / 2, 0.2, 1.5); // 베이스
        }
    }

    function createTile() {
        if (!isPlaying) return;
        const lane = Math.floor(Math.random() * 4);
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.style.left = (lane * 25) + '%';
        tile.style.top = '-200px';
        tile.style.height = (250 - selectedSong.speed * 10) + 'px';

        const onHit = (e) => {
            e.preventDefault();
            if (tile.classList.contains('pressed')) return;
            playPiano(selectedSong.notes[noteIdx % selectedSong.notes.length]);
            noteIdx++;
            score++;
            document.getElementById('hud').innerText = score;
            tile.classList.add('pressed');
            setTimeout(() => tile.remove(), 100);
        };

        tile.addEventListener('touchstart', onHit);
        tile.addEventListener('mousedown', onHit);
        document.getElementById('game-stage').appendChild(tile);
        tiles.push(tile);
    }

    function gameLoop() {
        if (!isPlaying) return;
        tiles.forEach((t, i) => {
            let top = parseFloat(t.style.top) + selectedSong.speed;
            t.style.top = top + 'px';
            if (top > window.innerHeight - 50 && !t.classList.contains('pressed')) {
                gameOver();
            }
            if (top > window.innerHeight) { t.remove(); tiles.splice(i, 1); }
        });
        requestAnimationFrame(gameLoop);
    }

    function startGame() {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        document.getElementById('home').style.display = 'none';
        isPlaying = true; score = 0; noteIdx = 0;
        document.getElementById('hud').innerText = '0';
        gameLoop();
        spawnTimer = setInterval(createTile, 1000 / (selectedSong.speed / 4.5));
    }

    function gameOver() {
        isPlaying = false;
        clearInterval(spawnTimer);
        alert(`연주 종료!\nScore: ${score}`);
        location.reload();
    }
</script>
</body>
</html>
