<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Piano Master: Long Note Pro</title>
    <style>
        :root { --neon: #00f2ff; --long: #ff00de; --bg: #050508; }
        * { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; box-sizing: border-box; touch-action: none; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; height: 100vh; overflow: hidden; display: flex; justify-content: center; }

        /* 로비 */
        #lobby { position: absolute; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        .song-list { flex: 1; width: 100%; max-width: 450px; overflow-y: auto; margin: 20px 0; }
        .card { background: #111; margin-bottom: 10px; padding: 20px; border-radius: 12px; border: 1.5px solid #222; cursor: pointer; }
        .card.selected { border-color: var(--neon); background: rgba(0, 242, 255, 0.1); }
        
        /* 스테이지 */
        #stage { display: none; width: 100vw; max-width: 480px; height: 100vh; background: #000; position: relative; border-left: 1px solid #222; border-right: 1px solid #222; }
        .lane-line { position: absolute; top: 0; width: 1px; height: 100%; background: rgba(255,255,255,0.05); }
        
        /* 타일 디자인 */
        .tile { width: 25%; position: absolute; border-radius: 4px; border: 1.5px solid var(--neon); background: linear-gradient(to bottom, #222, #000); box-shadow: 0 0 10px rgba(0, 242, 255, 0.2); }
        .tile.long { background: linear-gradient(to bottom, var(--long), #222); border-color: var(--long); opacity: 0.8; }
        .tile.active { background: var(--neon) !important; box-shadow: 0 0 40px var(--neon); }
        
        #hud { position: absolute; top: 50px; width: 100%; text-align: center; font-size: 60px; font-weight: 900; opacity: 0.2; z-index: 5; pointer-events: none; }
        #start-btn { width: 100%; max-width: 450px; padding: 20px; background: var(--neon); color: #000; border: none; border-radius: 50px; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div id="lobby">
    <h1 style="color:var(--neon); letter-spacing: 4px;">PIANO PRO</h1>
    <div class="song-list" id="list"></div>
    <button id="start-btn" onclick="startGame()">CONCERT START</button>
</div>

<div id="stage">
    <div id="hud">0</div>
    <div class="lane-line" style="left: 25%;"></div>
    <div class="lane-line" style="left: 50%;"></div>
    <div class="lane-line" style="left: 75%;"></div>
</div>

<script>
    // 악보 데이터: f(주파수), d(지속시간: 1은 일반, 그 이상은 롱타일)
    const songs = [
        { 
            title: "라흐마니노프 - 협주곡 2번", speed: 6, 
            notes: [{f:261, d:1}, {f:311, d:1}, {f:392, d:4}, {f:523, d:1}, {f:493, d:1}, {f:392, d:6}, {f:311, d:1}, {f:261, d:8}] 
        },
        { 
            title: "차이코프스키 - 백조의 호수", speed: 5, 
            notes: [{f:493, d:1}, {f:587, d:2}, {f:659, d:1}, {f:783, d:4}, {f:739, d:1}, {f:659, d:4}, {f:587, d:1}, {f:493, d:8}] 
        },
        { 
            title: "엘리제를 위하여", speed: 6.5, 
            notes: [{f:659, d:1}, {f:622, d:1}, {f:659, d:1}, {f:622, d:1}, {f:659, d:4}, {f:493, d:1}, {f:587, d:1}, {f:523, d:1}, {f:440, d:8}] 
        }
    ];

    let selected = songs[0];
    let audioCtx, isPlaying = false, score = 0, nIdx = 0, tiles = [];
    let loopReq, spawnTimer;

    // 리스트 UI
    const listDiv = document.getElementById('list');
    songs.forEach((s, i) => {
        const d = document.createElement('div');
        d.className = `card ${i === 0 ? 'selected' : ''}`;
        d.innerHTML = `<strong>${s.title}</strong><br><small>Long Notes Included</small>`;
        d.onclick = () => {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
            d.classList.add('selected');
            selected = s;
        };
        listDiv.appendChild(d);
    });

    // 고퀄리티 사운드 엔진 (Sustain 지원)
    class PianoVoice {
        constructor(freq) {
            this.osc = audioCtx.createOscillator();
            this.gain = audioCtx.createGain();
            this.osc.type = 'triangle';
            this.osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            // 타격음(Attack)
            this.gain.gain.setValueAtTime(0, audioCtx.currentTime);
            this.gain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05);
            
            this.osc.connect(this.gain).connect(audioCtx.destination);
            this.osc.start();
        }
        stop() {
            // 손을 떼거나 타일이 끝날 때 부드럽게 감쇠(Release)
            const now = audioCtx.currentTime;
            this.gain.gain.cancelScheduledValues(now);
            this.gain.gain.setValueAtTime(this.gain.gain.value, now);
            this.gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            setTimeout(() => this.osc.stop(), 300);
        }
    }

    let activeVoice = null;

    function createTile() {
        if (!isPlaying) return;
        const note = selected.notes[nIdx % selected.notes.length];
        const lane = Math.floor(Math.random() * 4);
        const t = document.createElement('div');
        
        t.className = 'tile' + (note.d > 1 ? ' long' : '');
        t.style.left = (lane * 25) + '%';
        t.style.top = '-500px';
        t.style.height = (note.d * 100) + 'px'; // 노트 길이에 따라 건반 길이 조절
        t.dataset.freq = note.f;
        t.dataset.long = note.d > 1;

        const startHit = (e) => {
            e.preventDefault();
            if (t.classList.contains('active')) return;
            activeVoice = new PianoVoice(note.f);
            t.classList.add('active');
            score++;
            document.getElementById('hud').innerText = score;
        };

        const endHit = (e) => {
            if (activeVoice) {
                activeVoice.stop();
                activeVoice = null;
            }
        };

        t.addEventListener('touchstart', startHit);
        t.addEventListener('mousedown', startHit);
        window.addEventListener('touchend', endHit);
        window.addEventListener('mouseup', endHit);

        document.getElementById('stage').appendChild(t);
        tiles.push(t);
        nIdx++;
    }

    function gameLoop() {
        if (!isPlaying) return;
        tiles.forEach((t, i) => {
            let top = parseFloat(t.style.top) + selected.speed;
            t.style.top = top + 'px';
            
            let height = parseFloat(t.style.height);
            // 판정선 통과 체크
            if (top > window.innerHeight - 100 && !t.classList.contains('active')) {
                gameOver();
            }
            // 타일이 완전히 화면을 벗어나면 제거
            if (top > window.innerHeight) {
                if (activeVoice) { activeVoice.stop(); activeVoice = null; }
                t.remove();
                tiles.splice(i, 1);
            }
        });
        loopReq = requestAnimationFrame(gameLoop);
    }

    function startGame() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('stage').style.display = 'block';
        isPlaying = true; score = 0; nIdx = 0;
        gameLoop();
        spawnTimer = setInterval(createTile, 1200);
    }

    function gameOver() {
        isPlaying = false;
        clearInterval(spawnTimer);
        cancelAnimationFrame(loopReq);
        alert("PERFORMANCE ENDED\nScore: " + score);
        location.reload();
    }
</script>
</body>
</html>
