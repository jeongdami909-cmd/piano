<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Piano Master: Real Sound</title>
    <style>
        :root { --main: #00f2ff; --sub: #ff007b; --bg: #050508; --card: #15151a; }
        * { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; box-sizing: border-box; touch-action: none; }
        
        body { 
            margin: 0; background: var(--bg); color: #fff; font-family: 'Pretendard', sans-serif;
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* 1. 스크롤 문제를 해결한 홈 화면 */
        #home { 
            display: flex; flex-direction: column; height: 100%; width: 100%; 
            max-width: 500px; margin: 0 auto; position: relative; z-index: 100; background: var(--bg);
        }
        header { padding: 40px 20px 10px; text-align: center; flex-shrink: 0; }
        header h1 { font-size: 30px; letter-spacing: 5px; color: var(--main); text-shadow: 0 0 15px var(--main); margin: 0; }

        /* 곡 목록: 절대 잘리지 않고 스크롤되는 영역 */
        #song-list-scroll { 
            flex: 1; overflow-y: auto; padding: 10px 20px 120px; /* 아래 버튼 공간 확보 */
            -webkit-overflow-scrolling: touch; /* 아이폰 부드러운 스크롤 */
            touch-action: pan-y;
        }
        
        .song-item { 
            background: var(--card); margin-bottom: 12px; padding: 22px; 
            border-radius: 18px; border: 2px solid #222; transition: 0.2s;
            display: flex; justify-content: space-between; align-items: center;
        }
        .song-item.active { border-color: var(--main); background: rgba(0, 242, 255, 0.1); }
        .genre-badge { font-size: 10px; padding: 3px 8px; border-radius: 5px; background: #333; color: #fff; font-weight: bold; margin-bottom: 5px; display: inline-block; }

        /* 하단 고정 시작 버튼 */
        .bottom-bar { 
            position: absolute; bottom: 0; width: 100%; padding: 20px; 
            background: linear-gradient(to top, var(--bg) 80%, transparent); 
            display: flex; justify-content: center;
        }
        #start-btn { 
            width: 100%; padding: 20px; background: var(--main); color: #000; 
            border: none; border-radius: 50px; font-size: 20px; font-weight: bold; 
            box-shadow: 0 10px 30px rgba(0, 242, 255, 0.4);
        }

        /* 게임 화면 */
        #stage { display: none; width: 100vw; max-width: 500px; height: 100vh; background: #000; position: relative; margin: 0 auto; }
        .tile { width: 25%; position: absolute; border-radius: 5px; border: 2.5px solid var(--main); background: linear-gradient(135deg, #222, #000); box-shadow: 0 0 15px rgba(0, 242, 255, 0.3); }
        .tile.long { border-color: var(--sub); box-shadow: 0 0 15px rgba(255, 0, 123, 0.3); }
        .tile.pressed { background: var(--sub) !important; opacity: 0; transform: scale(1.1); transition: 0.1s; }
        #score { position: absolute; top: 60px; width: 100%; text-align: center; font-size: 60px; font-weight: 900; opacity: 0.2; pointer-events: none; }
    </style>
</head>
<body>

<div id="home">
    <header>
        <h1>PIANO MASTER</h1>
        <p style="font-size: 14px; color: #666; margin-top: 10px;">글로벌 명곡 스페셜 리스트</p>
    </header>
    
    <div id="song-list-scroll">
        </div>
    
    <div class="bottom-bar">
        <button id="start-btn" onclick="startGame()">CONCERT START</button>
    </div>
</div>

<div id="stage">
    <div id="score">0</div>
</div>

<script>
    const library = [
        { genre: "K-POP", title: "BTS - Dynamite", speed: 8, color: "#ccff00", notes: [392, 392, 392, 392, 330, 294, 262, 330, 392, 440] },
        { genre: "K-POP", title: "NewJeans - Ditto", speed: 7, color: "#00f2ff", notes: [523, 659, 783, 1046, 783, 659, 523, 440, 392] },
        { genre: "POP", title: "Coldplay - Viva La Vida", speed: 7.5, color: "#ffcc00", notes: [659, 587, 523, 493, 440, 392, 440, 523, 587] },
        { genre: "POP", title: "Queen - Bohemian Rhapsody", speed: 6, color: "#ff9900", notes: [261, 293, 311, 349, 392, 440, 466, 523] },
        { genre: "CLASSIC", title: "라흐마니노프 - 협주곡 2번", speed: 10, color: "#ff007b", notes: [261, 311, 392, 523, 493, 392, 311, 261, 196, 261] },
        { genre: "CLASSIC", title: "차이코프스키 - 백조의 호수", speed: 8, color: "#ffffff", notes: [493, 587, 659, 783, 739, 659, 587, 493, 392] },
        { genre: "CLASSIC", title: "엘리제를 위하여", speed: 6.5, color: "#a8e6cf", notes: [659, 622, 659, 622, 659, 493, 587, 523, 440] }
    ];

    let selected = library[0];
    let audioCtx, isPlaying = false, score = 0, nIdx = 0, tiles = [];
    let loopId, spawnId;

    // UI 생성 (스크롤 가능)
    const container = document.getElementById('song-list-scroll');
    library.forEach((s, i) => {
        const card = document.createElement('div');
        card.className = `song-item ${i === 0 ? 'active' : ''}`;
        card.innerHTML = `
            <div>
                <span class="genre-badge" style="background:${s.color}; color:#000">${s.genre}</span>
                <h3>${s.title}</h3>
            </div>
            <div style="color:var(--main); font-size: 24px;">▶</div>
        `;
        card.onclick = () => {
            document.querySelectorAll('.song-item').forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            selected = s;
        };
        container.appendChild(card);
    });

    // 고급 피아노 사운드 합성 (배음 적용)
    function playRealPiano(freq) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        
        const createPart = (f, vol, decay) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = f === freq ? 'triangle' : 'sine'; // 기본음은 삼각형, 배음은 사인파
            osc.frequency.setValueAtTime(f, now);
            gain.gain.setValueAtTime(vol, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + decay);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(); osc.stop(now + decay);
        };

        createPart(freq, 0.5, 1.0);     // 기본음
        createPart(freq * 2, 0.15, 0.6); // 1차 배음
        createPart(freq * 4, 0.05, 0.3); // 2차 배음
        if (nIdx % 4 === 0) createPart(freq / 2, 0.2, 1.5); // 베이스 반주
    }

    function createTile() {
        if (!isPlaying) return;
        const lane = Math.floor(Math.random() * 4);
        const t = document.createElement('div');
        t.className = 'tile';
        t.style.left = (lane * 25) + '%';
        t.style.top = '-200px';
        t.style.height = '180px';
        t.style.borderColor = selected.color;

        const hit = (e) => {
            e.preventDefault();
            if (t.classList.contains('pressed')) return;
            playRealPiano(selected.notes[nIdx % selected.notes.length]);
            nIdx++; score++;
            document.getElementById('score').innerText = score;
            t.classList.add('pressed');
            setTimeout(() => t.remove(), 100);
        };

        t.addEventListener('touchstart', hit);
        t.addEventListener('mousedown', hit);
        document.getElementById('stage').appendChild(t);
        tiles.push(t);
    }

    function gameLoop() {
        if (!isPlaying) return;
        tiles.forEach((t, i) => {
            let top = parseFloat(t.style.top) + selected.speed;
            t.style.top = top + 'px';
            if (top > window.innerHeight - 60 && !t.classList.contains('pressed')) endGame();
            if (top > window.innerHeight) { t.remove(); tiles.splice(i, 1); }
        });
        loopId = requestAnimationFrame(gameLoop);
    }

    function startGame() {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        document.getElementById('home').style.display = 'none';
        document.getElementById('stage').style.display = 'block';
        isPlaying = true; score = 0; nIdx = 0; tiles = [];
        gameLoop();
        spawnId = setInterval(createTile, 1000 / (selected.speed / 4.2));
    }

    function endGame() {
        isPlaying = false;
        clearInterval(spawnId);
        cancelAnimationFrame(loopId);
        alert(`CONCERT OVER\nScore: ${score}`);
        location.reload();
    }
</script>
</body>
</html>
