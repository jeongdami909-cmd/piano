<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>✨ 블링블링 뮤직 타일</title>
    <style>
        body { 
            display: flex; flex-direction: column; align-items: center; 
            background: linear-gradient(135deg, #fceabb 0%, #f8b500 50%, #fceabb 100%);
            font-family: 'Apple SD Gothic Neo', sans-serif; height: 100vh; margin: 0; overflow: hidden;
        }
        #score-board { 
            font-size: 40px; font-weight: 900; color: #fff; text-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            margin: 20px 0; z-index: 10;
        }
        #game-container { 
            width: 360px; height: 600px; background: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(10px); position: relative; overflow: hidden; 
            border: 8px solid #fff; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        .lane { width: 25%; height: 100%; float: left; border-right: 1px solid rgba(255,255,255,0.3); box-sizing: border-box; }
        
        /* 블링블링 타일 디자인 */
        .tile { 
            width: 25%; height: 150px; position: absolute; top: -150px; cursor: pointer;
            background: linear-gradient(to bottom, #ff9a9e 0%, #fecfef 100%);
            border-radius: 10px; box-shadow: 0 0 15px #ff9a9e, inset 0 0 10px white;
            transition: transform 0.1s;
        }
        .tile:active { transform: scale(0.95); opacity: 0.8; }

        #game-over { 
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75); color: white; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
        }
        button { 
            padding: 15px 40px; font-size: 20px; border: none; border-radius: 50px;
            background: #ff9a9e; color: white; font-weight: bold; cursor: pointer;
            box-shadow: 0 5px 15px rgba(255,154,158,0.5);
        }
    </style>
</head>
<body>

<div id="score-board">00</div>

<div id="game-container">
    <div class="lane"></div><div class="lane"></div><div class="lane"></div><div class="lane"></div>
    <div id="game-over">
        <h1 style="font-size: 40px;">GAME OVER</h1>
        <p id="final-score" style="font-size: 24px;"></p>
        <button onclick="startGame()">다시 도전! ✨</button>
    </div>
</div>

<script>
    const gameContainer = document.getElementById('game-container');
    const scoreElement = document.getElementById('score-board');
    const gameOverScreen = document.getElementById('game-over');
    
    let score = 0;
    let gameInterval;
    let spawnInterval;
    let tiles = [];
    let speed = 5;
    let isGameOver = false;
    let melodyIndex = 0;

    // 멜로디 설정 (반짝반짝 작은별 주파수)
    const melody = [261.6, 261.6, 392.0, 392.0, 440.0, 440.0, 392.0, 349.2, 349.2, 329.6, 329.6, 293.7, 293.7, 261.6];

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playMusicTone() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        // 부드러운 전자기타/피아노 느낌 혼합
        osc.type = 'triangle'; 
        osc.frequency.value = melody[melodyIndex % melody.length];
        melodyIndex++;

        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.8);
    }

    function createTile() {
        if (isGameOver) return;
        const lane = Math.floor(Math.random() * 4);
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.style.left = (lane * 25) + '%';
        
        // 클릭 시 이벤트
        tile.onmousedown = (e) => {
            e.stopPropagation();
            playMusicTone();
            score++;
            scoreElement.innerText = score < 10 ? '0' + score : score;
            tile.remove();
            tiles = tiles.filter(t => t !== tile);
            if(score % 5 === 0) speed += 0.3; // 5점마다 조금씩 빨라짐
        };

        gameContainer.appendChild(tile);
        tiles.push(tile);
    }

    function update() {
        if (isGameOver) return;
        tiles.forEach(tile => {
            let top = parseFloat(tile.style.top || -150);
            top += speed;
            tile.style.top = top + 'px';
            if (top > 600) endGame();
        });
    }

    function startGame() {
        tiles.forEach(t => t.remove());
        tiles = []; score = 0; speed = 5; melodyIndex = 0;
        isGameOver = false;
        scoreElement.innerText = '00';
        gameOverScreen.style.display = 'none';
        gameInterval = setInterval(update, 20);
        spawnInterval = setInterval(createTile, 700);
    }

    function endGame() {
        isGameOver = true;
        clearInterval(gameInterval);
        clearInterval(spawnInterval);
        document.getElementById('final-score').innerText = "최종 점수: " + score;
        gameOverScreen.style.display = 'flex';
    }

    startGame();
</script>
</body>
</html>
