<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Piano Tiles - V19 Original Classic</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root { --neon: #00f2ff; --pink: #ff00ea; --gold: #ffea00; }
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        /* 오리지널 피아노 타일 감성: 하얀 배경 */
        body { color: #000; height: 100dvh; overflow: hidden; background: #fff; touch-action: none; }
        
        .screen { position: absolute; top: 0; left: 50%; width: 100%; height: 100%; max-width: 500px; transform: translateX(-50%); display: none; flex-direction: column; background: #fff; border-left: 1px solid #ddd; border-right: 1px solid #ddd; }
        
        /* 로비 (다크 모드 유지) */
        #lobby { display: flex; z-index: 100; padding: 25px; background: #050508; color: #fff; }
        h1 { text-align: center; font-size: 28px; font-weight: 900; background: linear-gradient(90deg, var(--neon), var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; padding: 15px 0; }
        
        #song-list { flex: 1; overflow-y: auto; background: rgba(255,255,255,0.03); border-radius: 20px; padding: 10px; margin-bottom: 20px; border: 1px solid #222; }
        .song-item { padding: 18px; border-bottom: 1px solid #222; border-radius: 12px; margin-bottom: 8px; cursor: pointer; background: rgba(255,255,255,0.02); }
        .song-item.active { background: rgba(0,242,255,0.15); border: 1px solid var(--neon); }
        .song-title { font-weight: 800; font-size: 16px; }
        .song-artist { font-size: 11px; color: var(--gold); margin-top: 4px; }

        #start-btn { width: 100%; padding: 22px; border-radius: 50px; border: none; font-size: 20px; font-weight: 900; background: linear-gradient(45deg, var(--neon), var(--pink)); color: #fff; cursor: pointer; }

        /* 게임 화면 (오리지널 화이트 테마) */
        #game { overflow: hidden; z-index: 50; position: relative; touch-action: none; background: #fff; }
        
        /* 4개 레인 선 */
        .lane-line { position: absolute; top: 0; width: 25%; height: 100%; border-right: 1px solid #ccc; pointer-events: none; }
        
        #score { position: absolute; top: 30px; width: 100%; text-align: center; font-size: 60px; font-weight: 900; z-index: 60; color: #ff0055; pointer-events: none; text-shadow: 2px 2px 0px #fff, -2px -2px 0px #fff; }

        /* 스텝 스크롤을 위한 Row 컨테이너 */
        .row { position: absolute; width: 100%; height: 25%; transition: bottom 0.1s ease-out; }
        
        /* 검은 타일 */
        .tile { position: absolute; width: 25%; height: 100%; background: #111; border: 1px solid #000; box-shadow: inset 0 -4px 0 rgba(255,255,255,0.2); transition: background 0.1s; }
        .tile.pressed { background: #bbb !important; }
        .tile.missed { background: #ff0055 !important; animation: blink 0.2s infinite; }
        
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        #result { justify-content: center; align-items: center; text-align: center; z-index: 200; background: rgba(0,0,0,0.9); color: #fff; }
    </style>
</head>
<body>

<div id="lobby" class="screen" style="display: flex;">
    <h1>CLASSIC ARCADE V19</h1>
    <p style="text-align:center; color:#888; font-size:12px; margin-bottom:15px;">자동 연주 제거. 오직 당신의 탭으로 진행됩니다.</p>
    <div id="song-list"></div>
    <button id="start-btn">사운드 로딩 중...</button>
</div>

<div id="game" class="screen">
    <div class="lane-line" style="left:0%"></div>
    <div class="lane-line" style="left:25%"></div>
    <div class="lane-line" style="left:50%"></div>
    <div class="lane-line" style="left:75%; border:none;"></div>
    
    <div id="score">0</div>
    </div>

<div id="result" class="screen">
    <h2 id="res-title" style="font-size:32px;">GAME OVER</h2>
    <div id="rank" style="font-size:100px; font-weight:900; color:var(--gold); margin: 20px 0;">S</div>
    <div id="final-score" style="font-size:24px; color:#ccc; margin-bottom:40px;">Score: 0</div>
    <button onclick="location.reload()" style="padding: 20px 60px; border-radius: 50px; border: none; font-weight: bold; background:#fff; font-size: 20px; cursor: pointer; color:#000;">다시 도전</button>
</div>

<script>
    const songs = [
        { t: "Canon in D", a: "Pachelbel", parts: { A: "F#5,E5,D5,C#5,B4,A4,B4,C#5", B: "D5,C#5,D5,E4,F#4,G4,A4,B4,A4,G4,F#4,E4,D4,E4,F#4", C: "G4,F#4,E4,D4,C#4,B3,A3,G3,F#3,E3,D3,E3,F#3,G3,A3,B3" } },
        { t: "Driver's High", a: "L'Arc-en-Ciel", parts: { A: "E5,E5,D5,B4,A4,G4,A4,B4", B: "B4,B4,D5,E5,D5,B4,A4" } },
        { t: "For Tomorrow", a: "Blur", parts: { A: "E4,E4,F#4,G4,A4,G4,F#4,E4", B: "A4,B4,C#5,D5,C#5,B4,A4" } },
        { t: "겨울바람", a: "Chopin", parts: { A: "E4,E4,F4,E4,A4,G#4,A4,C5,B4,C5,E5", B: "A5,G#5,A5,F5,E5,D#5,E5,C5,B4,A#4,B4,G4,F4,E4,F4,D4" } },
        { t: "Still D.R.E.", a: "Dr. Dre", parts: { A: "E5,E5,E5,E5,E5,E5,E5", B: "B4,B4,B4,B4,B4,B4,B4" } },
        { t: "No Scrubs", a: "TLC", parts: { A: "G#4,G#4,B4,C#5,B4,G#4,F#4", B: "B4,B4,B4,C#5,B4,G#4,G#4" } },
        { t: "Waterfalls", a: "TLC", parts: { A: "Eb4,G4,Bb4,C5,Bb4,G4,F4,Eb4", B: "Eb5,D5,C5,Bb4,G4,F4,Eb4,Eb4" } },
        { t: "Purple Rain", a: "Prince", parts: { A: "Bb4,C5,D5,F5,D5,C5,Bb4", B: "F5,F5,G5,F5,D5,C5,Bb4" } },
        { t: "River Flows in You", a: "Yiruma", parts: { A: "F#4,E4,F#4,C#4,F#4,E4,F#4,C#4", B: "B3,A3,B3,F#3,F#4,E4,F#4,C#4" } },
        { t: "Piano Concerto No.2", a: "Rachmaninoff", parts: { A: "C4,D4,Eb4,F4,G4,Ab4,G4", B: "G4,F4,G4,Ab4,G4,F4,Eb4" } },
        { t: "Swan Lake", a: "Tchaikovsky", parts: { A: "A4,D5,E5,F5,E5,D5,A4", B: "F5,A5,G5,F5,E5,D5,E5" } },
        { t: "Gymnopédie No.1", a: "Erik Satie", parts: { A: "F#4,A4,C#5,B4", B: "F#4,A4,C#5,E5" } }
    ];

    let piano, sheet = [], activeRows = [];
    let isPlaying = false, score = 0, currentStep = 0, selected = 0;
    const gameArea = document.getElementById('game');

    // 🔥 V19: 극강의 건조함. 이펙트 제로! 순정 샘플러로 즉각 반응.
    piano = new Tone.Sampler({
        urls: { "C4": "C4.mp3", "C5": "C5.mp3", "C6": "C6.mp3" },
        baseUrl: "https://tonejs.github.io/audio/salamander/",
        release: 0.8,
        attack: 0.003,
        volume: 2,
        onload: () => {
            document.getElementById('start-btn').innerText = "게임 시작";
        }
    }).toDestination();

    function renderSongs() {
        const listDiv = document.getElementById('song-list');
        listDiv.innerHTML = "";
        songs.forEach((s, idx) => {
            const item = document.createElement('div');
            item.className = `song-item ${idx === selected ? 'active' : ''}`;
            item.innerHTML = `<div class="song-title">${s.t}</div><div class="song-artist">${s.a}</div>`;
            item.onclick = () => { selected = idx; renderSongs(); };
            listDiv.appendChild(item);
        });
    }
    renderSongs();

    document.getElementById('start-btn').addEventListener('click', async () => {
        if (document.getElementById('start-btn').innerText === "사운드 로딩 중...") return;
        await Tone.start();
        document.getElementById('lobby').style.display = 'none';
        gameArea.style.display = 'block';

        // 곡 전개 생성 (약 200타일 분량)
        sheet = [];
        const song = songs[selected];
        const partKeys = Object.keys(song.parts);
        for(let i=0; i<30; i++) {
            const pk = partKeys[Math.floor(Math.random() * partKeys.length)];
            const notes = song.parts[pk].split(',');
            notes.forEach(note => {
                const m = Tone.Frequency(note).toMidi();
                let lane = Math.floor(Math.random() * 4); // 원작의 랜덤 레인 맛
                sheet.push({ lane, note });
            });
        }

        isPlaying = true;
        score = 0;
        currentStep = 0;
        activeRows = [];
        document.getElementById('score').innerText = "0";

        // 화면에 5개의 Row(줄)를 미리 깔아둠
        for(let i=0; i<5; i++) {
            createRow(i);
        }
    });

    // 화면에 타일 한 줄 생성 (offset: 0이 맨 아래, 4가 맨 위)
    function createRow(offset) {
        const sheetIdx = currentStep + offset;
        if(sheetIdx >= sheet.length) return; 

        const data = sheet[sheetIdx];
        const rowEl = document.createElement('div');
        rowEl.className = 'row';
        rowEl.style.bottom = (offset * 25) + '%'; // 화면을 4등분 (5번째는 화면 밖 대기)

        const tileEl = document.createElement('div');
        tileEl.className = 'tile';
        tileEl.style.left = (data.lane * 25) + '%';
        
        rowEl.appendChild(tileEl);
        gameArea.appendChild(rowEl);
        
        activeRows.push({ rowEl, tileEl, lane: data.lane, note: data.note, sheetIdx });
    }

    // 🔥 핵심: 타일이 아닌 게임판 전체 터치 감지 -> 하단(0번 줄) 레인 판정
    gameArea.addEventListener("pointerdown", (e) => {
        if (!isPlaying || activeRows.length === 0) return;

        const rect = gameArea.getBoundingClientRect();
        const touchX = e.clientX - rect.left;
        const clickedLane = Math.floor(touchX / (rect.width / 4));

        const bottomRow = activeRows[0]; // 무조건 맨 아래 줄을 쳐야 함

        if (clickedLane === bottomRow.lane) {
            // ✅ 정답! (검은 타일 터치)
            
            // 1. 소리 재생
            piano.triggerAttackRelease(bottomRow.note, 0.5, Tone.now(), 1.0);
            
            // 2. 타일 회색으로 변경 (눌림 표시)
            bottomRow.tile.classList.add('pressed');
            
            // 3. 점수 증가
            score++;
            document.getElementById('score').innerText = score;
            
            // 4. 보드 한 칸 내리기 (배열 스위프팅)
            const removedRow = activeRows.shift();
            setTimeout(() => removedRow.rowEl.remove(), 100); // 부드러운 삭제
            
            activeRows.forEach((r, idx) => {
                r.rowEl.style.bottom = (idx * 25) + '%'; // CSS Transition으로 스르륵 내려옴
            });
            
            // 5. 맨 위에 새 줄 추가
            currentStep++;
            createRow(4);
            
            // 6. 곡 완료 확인
            if(currentStep >= sheet.length - 4) {
                setTimeout(() => end(true), 500);
            }

        } else {
            // ❌ 오답! (하얀 배경 터치)
            
            // 내가 누른 하얀 공간에 빨간 타일 생성 (직관적 피드백)
            const errTile = document.createElement('div');
            errTile.className = 'tile missed';
            errTile.style.left = (clickedLane * 25) + '%';
            bottomRow.rowEl.appendChild(errTile);
            
            end(false);
        }
    });

    function end(win) {
        isPlaying = false;
        setTimeout(() => {
            gameArea.style.display = 'none';
            document.getElementById('result').style.display = 'flex';
            document.getElementById('res-title').innerText = win ? "SONG CLEARED!" : "GAME OVER";
            document.getElementById('rank').innerText = win ? "SSS" : (score > 100 ? "S" : (score > 50 ? "A" : "F"));
            document.getElementById('final-score').innerText = `Score: ${score}`;
        }, 500); // 0.5초 딜레이 후 결과창 (실패한 타일 깜빡임 보여주기 위함)
    }
</script>
</body>
</html>
