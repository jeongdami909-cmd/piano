<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Piano Tiles - V44 Maestro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root { --pink: #ffb3e6; --purple: #e6ccff; --gold: #ffea00; --red: #ff3366; }
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: linear-gradient(180deg, #ff99f1 0%, #e6b2ff 100%); height: 100dvh; overflow: hidden; touch-action: none; }
        .screen { position: absolute; top: 0; left: 50%; width: 100%; height: 100%; max-width: 500px; transform: translateX(-50%); display: none; flex-direction: column; background: rgba(255,255,255,0.15); backdrop-filter: blur(8px); border-left: 1px solid rgba(255,255,255,0.2); border-right: 1px solid rgba(255,255,255,0.2); }
        #lobby { display: flex; z-index: 100; padding: 20px; background: rgba(0,0,0,0.5); color: #fff; }
        h1 { text-align: center; font-size: 24px; font-weight: 900; text-shadow: 0 0 10px var(--pink); padding: 10px 0; }
        #difficulty-box { display: flex; justify-content: center; gap: 8px; margin-bottom: 15px; }
        .diff-btn { padding: 8px 15px; font-size: 14px; font-weight: bold; border-radius: 20px; border: 1.5px solid #fff; background: rgba(0,0,0,0.3); color: #fff; cursor: pointer; }
        .diff-btn.active { background: var(--pink); border-color: var(--pink); box-shadow: 0 0 8px var(--pink); }
        #song-list { flex: 1; overflow-y: auto; background: rgba(255,255,255,0.05); border-radius: 15px; padding: 10px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .song-item { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); border-radius: 10px; margin-bottom: 5px; background: rgba(0,0,0,0.3); color: #ddd; }
        .song-item.active { background: #fff; color: #ff66cc; font-weight: 800; border: 2px solid var(--pink); }
        #start-btn { width: 100%; padding: 18px; border-radius: 50px; font-size: 18px; font-weight: 900; background: #fff; color: #ff66cc; border: none; }
        #game { z-index: 50; position: relative; overflow: hidden; background: transparent; }
        #hearts-ui { position: absolute; top: 15px; left: 15px; z-index: 70; font-size: 20px; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .lane-line { position: absolute; top: 0; width: 25%; height: 100%; border-right: 1px solid rgba(255,255,255,0.15); pointer-events: none; }
        #score { position: absolute; top: 45px; width: 100%; text-align: center; font-size: 70px; font-weight: 900; z-index: 60; color: #fff; pointer-events: none; text-shadow: 0 4px 10px rgba(255,0,150,0.5); }
        .row { position: absolute; width: 100%; height: 25%; pointer-events: none; }
        .tile { position: absolute; width: 25%; height: 100%; background: #111; border: 1px solid #222; pointer-events: auto; border-radius: 4px; box-shadow: inset 0 -4px 8px rgba(255,255,255,0.1); }
        .tile.pressed { background: rgba(255,255,255,0.8) !important; box-shadow: 0 0 25px #fff; }
        .tile.missed { background: var(--red) !important; box-shadow: 0 0 15px var(--red); opacity: 0.8; }
        #result { justify-content: center; align-items: center; text-align: center; z-index: 200; background: rgba(255,153,241,0.95); color: #fff; }
    </style>
</head>
<body>

<div id="lobby" class="screen" style="display: flex;">
    <h1>MAESTRO PIANO</h1>
    <div id="difficulty-box">
        <button class="diff-btn" data-diff="하">하 (❤️x6)</button>
        <button class="diff-btn active" data-diff="중">중 (❤️x6)</button>
        <button class="diff-btn" data-diff="상">상 (❤️x9)</button>
    </div>
    <div id="song-list"></div>
    <button id="start-btn">웅장한 무대 조율 중...</button>
</div>

<div id="game" class="screen">
    <div id="hearts-ui">❤️❤️❤️❤️❤️❤️</div>
    <div class="lane-line" style="left:0%"></div>
    <div class="lane-line" style="left:25%"></div>
    <div class="lane-line" style="left:50%"></div>
    <div class="lane-line" style="left:75%; border:none;"></div>
    <div id="score">0</div>
</div>

<div id="result" class="screen">
    <h2 id="res-title">PERFORMANCE OVER</h2>
    <div id="rank" style="font-size:100px; font-weight:900; color:var(--gold);">S</div>
    <div id="final-score">Score: 0</div>
    <button onclick="location.reload()" style="padding: 15px 50px; border-radius: 50px; background:#fff; font-size: 18px; font-weight: bold; color:#ff66cc;">Encore</button>
</div>

<script>
    // 🎹 소희님을 위한 진짜 피아노 명곡 15곡 (반복 없이 아주 길게 구성)
    const songs = [
        { t: "La Campanella", a: "Liszt", p: "D#6|D#4,D#6|A#4,D#6|B4,D#6|D#5,D#6|D#4,D#6|A#4,C#6|F#4,B5|D#4,A#5|F4,G#5|D#4,F#5|B3,E5|G#3,D#5|D#3,C#5|E3,B4|G#3,A#4|F#3,G#4|E3,F#4|D#3,E4|C#3,D#4|B2" },
        { t: "Piano Concerto No.2", a: "Rachmaninoff", p: "F2|C3|F3|G#3|C4,G2|C3|G3|A#3|E4,G#2|C3|G#3|C4|F4,A#2|C3|A#3|C#4|G4,C3|G3|C4|E4|G#4,F#2|C#3|F#3|A3|C#4,G#2|D#3|G#3|B3|D#4" },
        { t: "Winter Wind", a: "Chopin", p: "A5|A3,G#5|C4,A5|E4,F5|A4,E5|C5,D#5|E5,E5|A5,C5|C6,B4|E6,A#4|A6,B4|C7,G4|E7,A#4|D7,A4|C7,G#4|B6,A4|A6" },
        { t: "Swan Lake", a: "Tchaikovsky", p: "A4|A2,E5|C3,D5|E3,C5|A3,B4|E3,A4|C3,B4|E3,C5|A2,D5|B2,E5|C3,F5|D3,E5|C3" },
        { t: "Still D.R.E.", a: "Dr. Dre", p: "E5|C4|E4|A4,E5|C4|E4|A4,E5|B3|E4|G#4,E5|B3|E4|G#4,E5|A3|C4|E4,E5|A3|C4|E4" },
        { t: "Nocturne Op.9 No.2", a: "Chopin", p: "G4|Eb3,G5|G3,F5|Bb3,G5|Eb4,Eb5|G3,D5|Bb3,C5|Eb3,Bb4|G3,Ab4|F3,G4|Eb3,F4|D3,Eb4|Eb2" },
        { t: "Für Elise", a: "Beethoven", p: "E5|A2,D#5|E3,E5|A3,D#5|C4,E5|E4,B4|A2,D5|E3,C5|A3,A4|A2,C4|E3,E4|A3,A4|C4" },
        { t: "River Flows in You", a: "Yiruma", p: "F#5|F#3,E5|A3,F#5|C#4,C#5|F#4,D5|D3,E5|A3,F#5|D4,A5|A4,G#5|E4,F#5|C#4,E5|A3,D5|D3" },
        { t: "Purple Rain", a: "Prince", p: "Bb3|Eb3,F4|G3,G4|Bb3,F4|Eb4,Bb3|F3,F4|A3,G4|C4,F4|F3,D4|Bb2,Eb4|Eb3" },
        { t: "No Scrubs", a: "TLC", p: "G#4|C#3,F#4|F#2,E4|B2,F#4|F#2,G#4|C#3,G#4|C#3,G#4|C#3,F#4|F#2,E4|B2" },
        { t: "Honey", a: "L'Arc-en-Ciel", p: "E4|A2,F#4|D3,G#4|E3,A4|A2,B4|D3,A4|E3,G#4|A2,F#4|D3,E4|E3" },
        { t: "Lacrimosa", a: "Lacrimosa", p: "D4|D2,E4|A2,F4|D3,G4|B2,A4|D3,Bb4|G2,A4|F2,G4|E2,F4|D2" },
        { t: "Clair de Lune", a: "Debussy", p: "F5|Db3,Eb5|Ab2,Db5|Db2,Ab4|F2,F4|Db2,Db4|Ab1,Eb4|Eb2,Db4|Db2" },
        { t: "Take On Me", a: "a-ha", p: "F#5|Bm2,F#5|Bm3,D5|E2,B4|E3,B4|A2,E5|A3,E5|D2,E5|D3,G#5|E2,G#5|E3" },
        { t: "Moonlight Sonata", a: "Beethoven", p: "G#3|C#2,C#4|G#2,E4|C#3,G#3|C#2,C#4|G#2,E4|C#3,A3|A1,C#4|E2,F#4|A2" }
    ];

    let piano, sheet = [], activeRows = [];
    let isPlaying = false, score = 0, currentStep = 0, selected = 0, canClick = false;
    let difficulty = '중', lives = 6, speed = 0.65, speedInc = 0.00015;
    const gameArea = document.getElementById('game');
    const heartsUi = document.getElementById('hearts-ui');

    document.querySelectorAll('.diff-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            difficulty = e.target.getAttribute('data-diff');
        });
    });

    const hall = new Tone.Reverb({ decay: 2.5, wet: 0.25 }).toDestination();
    piano = new Tone.Sampler({
        urls: { A0:"A0.mp3", C1:"C1.mp3", C4:"C4.mp3", C8:"C8.mp3" },
        release: 1.5,
        baseUrl: "https://tonejs.github.io/audio/salamander/",
        onload: () => { document.getElementById('start-btn').innerText = "연주 시작하기"; }
    }).connect(hall);

    function updateHearts() { heartsUi.innerText = '❤️'.repeat(Math.max(0, lives)); }

    function loseLife(rowToMiss = null) {
        lives--; updateHearts();
        if (rowToMiss) {
            rowToMiss.tileEl.classList.add('missed');
            setTimeout(() => {
                if(rowToMiss.rowEl.parentNode) {
                    rowToMiss.rowEl.remove();
                    activeRows = activeRows.filter(r => r !== rowToMiss);
                    createRow((activeRows[activeRows.length-1] ? parseFloat(activeRows[activeRows.length-1].rowEl.style.bottom) : 100) + 25);
                }
            }, 300);
        }
        if (lives <= 0) end(false);
    }

    function renderSongs() {
        const listDiv = document.getElementById('song-list'); listDiv.innerHTML = "";
        songs.forEach((s, idx) => {
            const item = document.createElement('div');
            item.className = `song-item ${idx === selected ? 'active' : ''}`;
            item.innerHTML = `<strong>${s.t}</strong><br><small>${s.a}</small>`;
            item.onclick = (e) => { e.stopPropagation(); selected = idx; renderSongs(); };
            listDiv.appendChild(item);
        });
    }
    renderSongs();

    document.getElementById('start-btn').addEventListener('click', async (e) => {
        e.preventDefault(); e.stopPropagation();
        await Tone.start();
        if (difficulty === '하') { speed = 0.5; lives = 6; speedInc = 0.0001; }
        else if (difficulty === '중') { speed = 0.65; lives = 6; speedInc = 0.00015; }
        else if (difficulty === '상') { speed = 0.85; lives = 9; speedInc = 0.0002; }
        updateHearts();
        document.getElementById('lobby').style.display = 'none';
        gameArea.style.display = 'block';
        const song = songs[selected]; sheet = [];
        const notes = song.p.split(',');
        for(let i=0; i<1000; i++) {
            sheet.push({ lane: Math.floor(Math.random()*4), note: notes[i % notes.length].split('|') });
        }
        isPlaying = true; score = 0; currentStep = 0; activeRows = [];
        document.getElementById('score').innerText = "0";
        for(let i=0; i<5; i++) createRow(115 + (i * 25));
        setTimeout(() => { canClick = true; }, 600);
        requestAnimationFrame(gameLoop);
    });

    function createRow(bottomVal) {
        if(currentStep >= sheet.length) return;
        const data = sheet[currentStep];
        const rowEl = document.createElement('div'); rowEl.className = 'row'; rowEl.style.bottom = bottomVal + '%';
        const tileEl = document.createElement('div'); tileEl.className = 'tile'; tileEl.style.left = (data.lane * 25) + '%';
        rowEl.appendChild(tileEl); gameArea.appendChild(rowEl);
        activeRows.push({ rowEl, tileEl, lane: data.lane, note: data.note, locked: false });
        currentStep++;
    }

    function gameLoop() {
        if (!isPlaying) return;
        for (let i = activeRows.length - 1; i >= 0; i--) {
            const row = activeRows[i];
            const currentBottom = parseFloat(row.rowEl.style.bottom);
            const newBottom = currentBottom - speed;
            row.rowEl.style.bottom = newBottom + "%";
            if (newBottom < -15 && !row.locked) { row.locked = true; loseLife(row); }
        }
        speed += speedInc;
        requestAnimationFrame(gameLoop);
    }

    gameArea.addEventListener("pointerdown", (e) => {
        if (!isPlaying || !canClick || activeRows.length === 0) return;
        e.preventDefault();
        let bottomRow = null; let lowestPos = Infinity;
        activeRows.forEach(r => { if (!r.locked) { const b = parseFloat(r.rowEl.style.bottom); if (b < lowestPos) { lowestPos = b; bottomRow = r; } } });
        if (!bottomRow || lowestPos > 48) return;
        const rect = gameArea.getBoundingClientRect();
        const tx = (e.clientX || e.touches[0].clientX) - rect.left;
        let lane = Math.floor(tx / (rect.width / 4));
        lane = Math.max(0, Math.min(3, lane));
        if (lane === bottomRow.lane) {
            bottomRow.locked = true; piano.triggerAttackRelease(bottomRow.note, "2n", undefined, 0.8 + Math.random()*0.2);
            bottomRow.tileEl.classList.add('pressed'); score++; document.getElementById('score').innerText = score;
            setTimeout(() => { bottomRow.rowEl.remove(); activeRows = activeRows.filter(r => r !== bottomRow); }, 60);
            createRow((activeRows[activeRows.length-1] ? parseFloat(activeRows[activeRows.length-1].rowEl.style.bottom) : 100) + 25);
        } else { loseLife(); }
    });

    function end(win) {
        if (!isPlaying) return; isPlaying = false;
        setTimeout(() => {
            gameArea.style.display = 'none'; document.getElementById('result').style.display = 'flex';
            document.getElementById('rank').innerText = score > 1000 ? "SSS" : (score > 300 ? "S" : "A");
            document.getElementById('final-score').innerText = `Final Score: ${score}`;
        }, 300);
    }
</script>
</body>
</html>
