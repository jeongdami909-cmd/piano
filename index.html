
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Grand Piano Tiles: Master Edition</title>
    <style>
        :root { --bg: #000; --accent: #00d4ff; }
        body { 
            margin: 0; background: var(--bg); color: #fff; 
            display: flex; flex-direction: column; align-items: center;
            font-family: 'Pretendard', sans-serif; overflow: hidden; height: 100vh;
        }
        /* 메인 UI */
        #menu-screen { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
            padding: 20px; text-align: center;
        }
        .song-list { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin: 30px 0; width: 90%; max-width: 800px; }
        .song-card { 
            background: #222; padding: 15px; border-radius: 12px; cursor: pointer; border: 2px solid transparent;
            transition: 0.3s;
        }
        .song-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .song-card.active { background: var(--accent); color: #000; font-weight: bold; }
        .diff-tag { font-size: 12px; padding: 3px 8px; border-radius: 20px; display: inline-block; margin-bottom: 5px; }
        
        /* 게임 뷰 */
        #game-view { width: 360px; height: 100vh; background: #050505; position: relative; overflow: hidden; }
        .lane-line { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.05); }
        .tile { 
            width: 25%; position: absolute; border-radius: 4px; cursor: pointer;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.1);
        }
        .tile.hit { filter: brightness(2) !important; opacity: 0; transition: 0.2s; }
        
        #score-display { position: absolute; top: 40px; font-size: 50px; font-weight: 800; width: 100%; text-align: center; z-index: 5; opacity: 0.7; pointer-events: none; }
        #start-btn { padding: 15px 60px; font-size: 24px; border-radius: 50px; border: none; background: #fff; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="menu-screen">
    <h1 style="font-size: 40px; margin-bottom: 10px;">GRAND PIANO</h1>
    <p>곡을 선택하고 연주를 시작하세요</p>
    
    <div class="song-list" id="songs">
        </div>
    
    <button id="start-btn" onclick="startGame()">PLAY</button>
</div>

<div id="score-display">0</div>
<div id="game-view">
    <div class="lane-line" style="left: 25%;"></div>
    <div class="lane-line" style="left: 50%;"></div>
    <div class="lane-line" style="left: 75%;"></div>
</div>

<script>
    const songData = [
        { id:0, title: "작은 별", diff: "Easy", speed: 5, color: "#a8e6cf", notes: [261, 261, 392, 392, 440, 440, 392] },
        { id:1, title: "학교종이 땡땡땡", diff: "Easy", speed: 5, color: "#dcedc1", notes: [392, 392, 440, 440, 392, 392, 329] },
        { id:2, title: "아리랑", diff: "Easy", speed: 5.5, color: "#ffd3b6", notes: [440, 493, 523, 440, 392, 329, 392] },
        
        { id:3, title: "엘리제를 위하여", diff: "Normal", speed: 7, color: "#3498db", notes: [659, 622, 659, 622, 659, 493, 587, 523, 440] },
        { id:4, title: "백조의 호수", diff: "Normal", speed: 7.5, color: "#9b59b6", notes: [493, 587, 659, 783, 739, 659, 587] },
        { id:5, title: "터키 행진곡", diff: "Normal", speed: 8.5, color: "#1abc9c", notes: [493, 440, 415, 440, 523, 587, 523, 493, 440] },
        
        { id:6, title: "라흐마니노프 협주곡", diff: "Hard", speed: 11, color: "#e74c3c", notes: [261, 329, 392, 523, 493, 392, 329, 261, 220, 261] },
        { id:7, title: "왕벌의 비행", diff: "Hard", speed: 14, color: "#f1c40f", notes: [440, 415, 392, 370, 349, 330, 311, 293, 277] },
        { id:8, title: "쇼팽 - 혁명", diff: "Hard", speed: 12, color: "#c0392b", notes: [440, 220, 261, 329, 440, 523, 659, 880] }
    ];

    let currentSong = songData[0];
    let isPlaying = false;
    let score = 0;
    let audioCtx;
    let noteIdx = 0;
    let tiles = [];

    // UI 초기화
    const songContainer = document.getElementById('songs');
    songData.forEach(song => {
        const div = document.createElement('div');
        div.className = `song-card ${song.id === 0 ? 'active' : ''}`;
        div.innerHTML = `<span class="diff-tag" style="background:${song.color}; color:#000">${song.diff}</span><br>${song.title}`;
        div.onclick = () => {
            document.querySelectorAll('.song-card').forEach(c => c.classList.remove('active'));
            div.classList.add('active');
            currentSong = song;
        };
        songContainer.appendChild(div);
    });

    function playSound() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = currentSong.diff === "Hard" ? "sawtooth" : "triangle";
        osc.frequency.value = currentSong.notes[noteIdx % currentSong.notes.length];
        noteIdx++;
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.4);
    }

    function createTile() {
        if (!isPlaying) return;
        const lane = Math.floor(Math.random() * 4);
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.style.left = (lane * 25) + '%';
        tile.style.top = '-180px';
        tile.style.height = (180 - currentSong.speed * 5) + 'px'; // 속도가 빠를수록 타일이 짧아짐
        tile.style.background = currentSong.color;
        tile.onmousedown = () => {
            if (tile.classList.contains('hit')) return;
            playSound();
            score++;
            document.getElementById('score-display').innerText = score;
            tile.classList.add('hit');
            setTimeout(() => tile.remove(), 100);
        };
        document.getElementById('game-view').appendChild(tile);
        tiles.push(tile);
    }

    function gameLoop() {
        if (!isPlaying) return;
        tiles.forEach((tile, i) => {
            let top = parseFloat(tile.style.top) + currentSong.speed;
            tile.style.top = top + 'px';
            if (top > window.innerHeight) {
                if (!tile.classList.contains('hit')) endGame();
                else { tile.remove(); tiles.splice(i, 1); }
            }
        });
        requestAnimationFrame(gameLoop);
    }

    function startGame() {
        document.getElementById('menu-screen').style.display = 'none';
        isPlaying = true; score = 0; noteIdx = 0;
        document.getElementById('score-display').innerText = '0';
        gameLoop();
        spawnHandler = setInterval(createTile, 1000 / (currentSong.speed / 4.5));
    }

    function endGame() {
        isPlaying = false;
        clearInterval(spawnHandler);
        alert(`GAME OVER\n당신의 점수: ${score}`);
        location.reload();
    }
</script>
</body>
</html>
