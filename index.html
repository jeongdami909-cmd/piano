<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Piano Beat: Global Master</title>
    <style>
        :root { --neon: #00f2ff; --pop: #ff007b; --kpop: #ccff00; --bg: #050508; }
        * { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; box-sizing: border-box; touch-action: none; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; height: 100vh; overflow: hidden; display: flex; justify-content: center; }

        /* 로비 화면 */
        #lobby { position: absolute; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; padding: 40px 15px; }
        .genre-box { width: 100%; max-width: 450px; overflow-y: auto; flex: 1; margin: 20px 0; }
        .song-card { background: #111; margin-bottom: 12px; padding: 22px; border-radius: 15px; border: 1.5px solid #222; transition: 0.2s; }
        .song-card.selected { border-color: var(--neon); background: rgba(0, 242, 255, 0.1); transform: scale(1.02); }
        .badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: bold; margin-bottom: 5px; display: inline-block; }

        /* 스테이지 */
        #stage { display: none; width: 100vw; max-width: 500px; height: 100vh; background: #000; position: relative; border-left: 1px solid #222; border-right: 1px solid #222; }
        .lane-line { position: absolute; top: 0; width: 1px; height: 100%; background: rgba(255,255,255,0.05); }
        .tile { width: 25%; position: absolute; border-radius: 6px; border: 2px solid var(--neon); background: linear-gradient(135deg, #222, #000); box-shadow: 0 0 15px rgba(0, 242, 255, 0.3); }
        .tile.pressed { background: var(--pop) !important; border-color: #fff; box-shadow: 0 0 40px var(--pop); opacity: 0; transition: 0.15s; }
        
        #hud { position: absolute; top: 50px; width: 100%; text-align: center; font-size: 60px; font-weight: 900; opacity: 0.2; pointer-events: none; z-index: 10; }
        #start-btn { width: 100%; max-width: 400px; padding: 20px; background: var(--neon); color: #000; border: none; border-radius: 50px; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div id="lobby">
    <h1 style="color:var(--neon); letter-spacing: 5px; margin: 0;">GLOBAL BEAT</h1>
    <p style="color:#555; margin: 5px 0 20px;">장르를 선택하고 연주하세요</p>
    <div class="genre-box" id="song-list"></div>
    <button id="start-btn" onclick="initGame()">STAGE START</button>
</div>

<div id="stage">
    <div id="hud">0</div>
    <div class="lane-line" style="left: 25%;"></div>
    <div class="lane-line" style="left: 50%;"></div>
    <div class="lane-line" style="left: 75%;"></div>
</div>

<script>
    const library = [
        { g: "K-POP", t: "BTS - Dynamite", s: 8, b: 115, c: "#ccff00", notes: [392, 392, 392, 392, 330, 294, 262, 330, 392, 440] },
        { g: "K-POP", t: "NewJeans - Ditto", s: 7, b: 130, c: "#00f2ff", notes: [523, 659, 783, 1046, 783, 659, 523] },
        { g: "POP", t: "Coldplay - Viva La Vida", s: 7.5, b: 138, c: "#ffcc00", notes: [659, 587, 523, 493, 440, 392, 440, 523] },
        { g: "CLASSIC", t: "라흐마니노프 협주곡 2번", s: 10, b: 90, c: "#ff007b", notes: [261, 311, 392, 523, 493, 392, 311, 261] },
        { g: "CLASSIC", t: "차이코프스키 - 백조의 호수", s: 8, b: 100, c: "#ffffff", notes: [493, 587, 659, 783, 739, 659, 587] }
    ];

    let current = library[0];
    let audioCtx, isPlaying = false, score = 0, nIdx = 0, tiles = [];
    let loop, spawn, beatTimer;

    // 사운드 엔진: 삐- 소리 방지용 Envelope
    function playNote(f) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, now);
        
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8); // 0.8초 뒤 확실히 무음 처리
        
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(); osc.stop(now + 0.8); // 강제 종료 타임아웃
    }

    // 배경 반주 (드럼 & 베이스)
    function playBackingBeat() {
        if (!isPlaying) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(60, now); // 킥 드럼 주파수
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(); osc.stop(now + 0.1);
        beatTimer = setTimeout(playBackingBeat, 60000 / current.b);
    }

    // UI 생성
    const list = document.getElementById('song-list');
    library.forEach((s, i) => {
        const d = document.createElement('div');
        d.className = `song-card ${i === 0 ? 'selected' : ''}`;
        d.innerHTML = `<span class="badge" style="background:${s.c}; color:#000">${s.g}</span><h3>${s.t}</h3>`;
        d.onclick = () => {
            document.querySelectorAll('.song-card').forEach(c => c.classList.remove('selected'));
            d.classList.add('selected');
            current = s;
        };
        list.appendChild(d);
    });

    function createTile() {
        if (!isPlaying) return;
        const lane = Math.floor(Math.random() * 4);
        const t = document.createElement('div');
        t.className = 'tile';
        t.style.left = (lane * 25) + '%';
        t.style.top = '-200px';
        t.style.height = '160px';
        t.style.borderColor = current.c;

        const hit = (e) => {
            e.preventDefault();
            if (t.classList.contains('pressed')) return;
            playNote(current.notes[nIdx % current.notes.length]);
            nIdx++; score++;
            document.getElementById('hud').innerText = score;
            t.classList.add('pressed');
            setTimeout(() => t.remove(), 150);
        };
        t.addEventListener('touchstart', hit);
        t.addEventListener('mousedown', hit);
        document.getElementById('stage').appendChild(t);
        tiles.push(t);
    }

    function gameLoop() {
        if (!isPlaying) return;
        tiles.forEach((t, i) => {
            let top = parseFloat(t.style.top) + current.s;
            t.style.top = top + 'px';
            if (top > window.innerHeight - 60 && !t.classList.contains('pressed')) gameOver();
            if (top > window.innerHeight) { t.remove(); tiles.splice(i, 1); }
        });
        loop = requestAnimationFrame(gameLoop);
    }

    function initGame() {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('stage').style.display = 'block';
        isPlaying = true; score = 0; nIdx = 0; tiles = [];
        gameLoop();
        spawn = setInterval(createTile, 1000 / (current.s / 4));
        playBackingBeat();
    }

    function gameOver() {
        isPlaying = false;
        clearInterval(spawn);
        clearTimeout(beatTimer);
        cancelAnimationFrame(loop);
        alert(`공연 종료!\n최종 점수: ${score}`);
        location.reload();
    }
</script>
</body>
</html>
