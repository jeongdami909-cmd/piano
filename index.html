<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Piano Tiles - V37 Perfect</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root { --pink: #ff99f1; --neon: #00f2ff; }
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #000; height: 100dvh; overflow: hidden; touch-action: none; }
        .screen { position: absolute; top: 0; left: 50%; width: 100%; height: 100%; max-width: 500px; transform: translateX(-50%); display: none; flex-direction: column; background: #fff; }
        #lobby { display: flex; z-index: 100; padding: 20px; background: #050508; color: #fff; }
        h1 { text-align: center; font-size: 24px; font-weight: 900; background: linear-gradient(90deg, var(--neon), var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; padding: 15px 0; }
        #song-list { flex: 1; overflow-y: auto; background: rgba(255,255,255,0.05); border-radius: 15px; padding: 10px; margin-bottom: 15px; border: 1px solid #333; }
        .song-item { padding: 14px; border-bottom: 1px solid #222; border-radius: 10px; margin-bottom: 5px; cursor: pointer; background: rgba(255,255,255,0.02); }
        .song-item.active { background: var(--pink); color: #000; font-weight: bold; }
        #start-btn { width: 100%; padding: 20px; border-radius: 50px; border: none; font-size: 18px; font-weight: 900; background: #fff; color: #ff66cc; cursor: pointer; }
        #game { z-index: 50; position: relative; background: #fff; overflow: hidden; }
        .lane-line { position: absolute; top: 0; width: 25%; height: 100%; border-right: 1px solid #eee; pointer-events: none; }
        #score { position: absolute; top: 30px; width: 100%; text-align: center; font-size: 60px; font-weight: 900; z-index: 60; color: #ff0055; pointer-events: none; }
        .row { position: absolute; width: 100%; height: 25%; pointer-events: auto; }
        .tile { position: absolute; width: 25%; height: 100%; background: #111; border: 1px solid #000; pointer-events: auto; }
        .tile.pressed { background: #ddd !important; }
        #result { justify-content: center; align-items: center; text-align: center; z-index: 200; background: rgba(0,0,0,0.95); color: #fff; }
    </style>
</head>
<body>

<div id="lobby" class="screen" style="display: flex;">
    <h1>V37 PERFECT</h1>
    <div id="song-list"></div>
    <button id="start-btn">웅장한 무대 조율 중...</button>
</div>

<div id="game" class="screen">
    <div class="lane-line" style="left:0%"></div>
    <div class="lane-line" style="left:25%"></div>
    <div class="lane-line" style="left:50%"></div>
    <div class="lane-line" style="left:75%; border:none;"></div>
    <div id="score">0</div>
</div>

<div id="result" class="screen">
    <h2 id="res-title">GAME OVER</h2>
    <div id="rank" style="font-size:100px; font-weight:900; color: #ffea00;">F</div>
    <div id="final-score">Score: 0</div>
    <button onclick="location.reload()" style="padding: 15px 50px; border-radius: 50px; background:#fff; font-size: 18px; font-weight: bold; color:#000;">다시 도전</button>
</div>

<script>
    const songs = [
        { t: "La Campanella", a: "Liszt", p: "D#6,D#6,D#6,D#6,D#6,D#6,D#6,D#6" },
        { t: "Piano Concerto No.2", a: "Rachmaninoff", p: "C4,Eb4,G4,C5,G4,Eb4,C4,G3" },
        { t: "Swan Lake", a: "Tchaikovsky", p: "A4,E5,D5,C5,B4,A4,B4,C5" }
    ];

    let piano, sheet = [], activeRows = [];
    let isPlaying = false, score = 0, currentStep = 0, selected = 0, canClick = false;
    let speed = 0.55; 
    const gameArea = document.getElementById('game');

    // 🎧 쇳소리 해결: 리버브와 릴리즈를 대폭 낮춰 소리를 맑게 함
    const hall = new Tone.Reverb({ decay: 1.0, wet: 0.15 }).toDestination();
    piano = new Tone.Sampler({
        urls: { A0:"A0.mp3", C1:"C1.mp3", C4:"C4.mp3", C8:"C8.mp3" },
        release: 1.0, 
        baseUrl: "https://tonejs.github.io/audio/salamander/",
        onload: () => { document.getElementById('start-btn').innerText = "연주 시작하기"; }
    }).connect(hall);

    function renderSongs() {
        const listDiv = document.getElementById('song-list');
        listDiv.innerHTML = "";
        songs.forEach((s, idx) => {
            const item = document.createElement('div');
            item.className = `song-item ${idx === selected ? 'active' : ''}`;
            item.innerHTML = `<strong>${s.t}</strong><br><small>${s.a}</small>`;
            item.onclick = () => { selected = idx; renderSongs(); };
            listDiv.appendChild(item);
        });
    }
    renderSongs();

    document.getElementById('start-btn').addEventListener('click', async () => {
        await Tone.start();
        document.getElementById('lobby').style.display = 'none';
        gameArea.style.display = 'block';

        const song = songs[selected];
        sheet = [];
        const notes = song.p.split(',');
        for(let i=0; i<300; i++) {
            sheet.push({ lane: Math.floor(Math.random()*4), note: notes[i % notes.length] });
        }

        isPlaying = true; score = 0; currentStep = 0; activeRows = []; speed = 0.55;
        document.getElementById('score').innerText = "0";
        // 🛠️ 초기 타일 생성 시 간격 엄격 유지 (뭉침 방지)
        for(let i=0; i<4; i++) createRow(100 + (i * 25));
        
        setTimeout(() => { canClick = true; }, 400);
        requestAnimationFrame(gameLoop);
    });

    function createRow(bottomVal) {
        if(currentStep >= sheet.length) return;
        const data = sheet[currentStep];
        const rowEl = document.createElement('div');
        rowEl.className = 'row';
        rowEl.style.bottom = bottomVal + '%';
        const tileEl = document.createElement('div');
        tileEl.className = 'tile';
        tileEl.style.left = (data.lane * 25) + '%';
        rowEl.appendChild(tileEl);
        gameArea.appendChild(rowEl);
        activeRows.push({ rowEl, tileEl, lane: data.lane, note: data.note, locked: false });
        currentStep++;
    }

    function gameLoop() {
        if (!isPlaying) return;
        for (let i = activeRows.length - 1; i >= 0; i--) {
            const row = activeRows[i];
            const currentBottom = parseFloat(row.rowEl.style.bottom);
            const newBottom = currentBottom - speed;
            row.rowEl.style.bottom = newBottom + "%";
            
            // 🛠️ 실패 판정 정밀화: 바닥을 완전히 통과했을 때만 종료
            if (newBottom < -5 && !row.locked) {
                end(false);
                return;
            }
        }
        speed += 0.0001;
        requestAnimationFrame(gameLoop);
    }

    gameArea.addEventListener("pointerdown", (e) => {
        if (!isPlaying || !canClick || activeRows.length === 0) return;
        e.preventDefault();
        
        // 🛠️ 물리적 위치 기준으로 가장 아래 타일 하나만 타겟팅
        let bottomRow = null;
        let lowestPos = Infinity;
        activeRows.forEach(r => {
            if (!r.locked) {
                const b = parseFloat(r.rowEl.style.bottom);
                if (b < lowestPos) { lowestPos = b; bottomRow = r; }
            }
        });

        if (!bottomRow || lowestPos > 40) return;

        const rect = gameArea.getBoundingClientRect();
        const touchX = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
        let clickedLane = Math.floor(touchX / (rect.width / 4));
        clickedLane = Math.max(0, Math.min(3, clickedLane));

        if (clickedLane === bottomRow.lane) {
            bottomRow.locked = true;
            // 🎹 사운드 중첩을 막기 위해 원음만 깔끔하게 재생
            piano.triggerAttackRelease(bottomRow.note, "8n");
            bottomRow.tileEl.classList.add('pressed');
            score++;
            document.getElementById('score').innerText = score;
            
            setTimeout(() => {
                bottomRow.rowEl.remove();
                activeRows = activeRows.filter(r => r !== bottomRow);
            }, 60);
            
            // 타일 보충 로직: 가장 위 타일 기준으로 정확히 25% 위에 생성
            const topRow = activeRows[activeRows.length - 1];
            const topPos = topRow ? parseFloat(topRow.rowEl.style.bottom) : 100;
            createRow(topPos + 25);
        } else {
            end(false);
        }
    });

    function end(win) {
        if (!isPlaying) return;
        isPlaying = false;
        setTimeout(() => {
            gameArea.style.display = 'none';
            document.getElementById('result').style.display = 'flex';
            document.getElementById('rank').innerText = score > 100 ? "SSS" : (score > 30 ? "S" : "F");
            document.getElementById('final-score').innerText = `Score: ${score}`;
        }, 200);
    }
</script>
</body>
</html>
