<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Piano Tiles - V9 Concert Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root { --neon: #00f2ff; --pink: #ff00ea; --gold: #ffea00; --bg: #050508; }
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { color: #fff; height: 100dvh; overflow: hidden; background: var(--bg); transition: background 0.1s; }
        
        button { touch-action: manipulation; }

        .screen { position: absolute; top: 0; left: 50%; width: 100%; height: 100%; max-width: 500px; transform: translateX(-50%); display: none; flex-direction: column; background: var(--bg); border-left: 1px solid #111; border-right: 1px solid #111; }
        
        #lobby { display: flex; z-index: 100; padding: 20px; }
        h1 { text-align: center; font-size: 26px; font-weight: 900; background: linear-gradient(90deg, var(--neon), var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; padding: 5px 0; }
        .desc { text-align: center; color: #aaa; font-size: 13px; margin-bottom: 15px; }

        .diff-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .diff-btn { flex: 1; padding: 12px; background: #111; border: 1px solid #333; border-radius: 8px; color: #888; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .diff-btn.active { background: var(--pink); color: #fff; border-color: #fff; box-shadow: 0 0 10px var(--pink); }

        #song-list { flex: 1; overflow-y: auto; background: rgba(255,255,255,0.02); border-radius: 15px; padding: 10px; margin-bottom: 10px; }
        .song-item { padding: 14px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; border-radius: 10px; margin-bottom: 5px; cursor: pointer; }
        .song-item.active { background: rgba(0, 242, 255, 0.15); border: 1px solid var(--neon); }
        .song-title { font-size: 15px; font-weight: bold; }
        .song-artist { font-size: 11px; color: var(--gold); margin-top: 3px; }
        
        #start-btn { width: 100%; padding: 18px; border-radius: 50px; border: none; font-size: 18px; font-weight: bold; background: linear-gradient(45deg, var(--neon), var(--pink)); color: #fff; cursor: pointer; box-shadow: 0 5px 20px rgba(255, 0, 234, 0.4); }

        #game { overflow: hidden; z-index: 50; position: relative; touch-action: none; }
        .lane-bg { position: absolute; top: 0; width: 25%; height: 100%; border-right: 1px dashed rgba(255,255,255,0.05); pointer-events: none; }
        #hit-line { position: absolute; bottom: 15%; width: 100%; height: 3px; background: rgba(255,255,255,0.5); z-index: 5; pointer-events: none; }
        
        /* 🔥 하단 가짜 건반 UI 추가 (시각적 타격감 향상) */
        .bottom-key { position: absolute; bottom: 0; width: 25%; height: 15%; background: linear-gradient(to top, rgba(255,255,255,0.1), transparent); border-right: 1px solid rgba(255,255,255,0.05); z-index: 4; }
        
        #score-container { position: absolute; top: 40px; width: 100%; text-align: center; z-index: 60; pointer-events: none; }
        #score { font-size: 45px; font-weight: 900; text-shadow: 0 0 15px var(--neon); }
        #combo { font-size: 22px; color: var(--gold); font-weight: bold; opacity: 0; transition: 0.1s; }
        #combo.show { opacity: 1; transform: scale(1.2); }

        #judgment { position: absolute; top: 45%; width: 100%; text-align: center; font-size: 45px; font-weight: 900; z-index: 70; opacity: 0; pointer-events: none; }

        .tile { position: absolute; width: 24.5%; border-radius: 4px; background: linear-gradient(to bottom, #fff, var(--neon)); z-index: 10; pointer-events: none; box-shadow: 0 0 10px rgba(0, 242, 255, 0.3); }
        .tile.pressed { opacity: 0; transform: scale(1.1); transition: 0.2s; }

        #result { justify-content: center; align-items: center; text-align: center; z-index: 200; background: rgba(0,0,0,0.98); }
    </style>
</head>
<body>

<div id="lobby" class="screen" style="display: flex;">
    <h1>V9 CONCERT ENGINE</h1>
    <p class="desc">오직 당신의 터치로만 완성되는 리얼 연주</p>
    <div class="diff-group">
        <button class="diff-btn" data-diff="easy">EASY</button>
        <button class="diff-btn active" data-diff="normal">NORMAL</button>
        <button class="diff-btn" data-diff="hard">HARD</button>
    </div>
    <div id="song-list"></div>
    <button id="start-btn" class="ready">게임 시작!</button>
</div>

<div id="game" class="screen">
    <div id="score-container">
        <div id="score">0</div>
        <div id="combo">0 COMBO</div>
    </div>
    <div id="judgment"></div>
    <div id="hit-line"></div>
    
    <div class="lane-bg" style="left:0%"></div><div class="lane-bg" style="left:25%"></div><div class="lane-bg" style="left:50%"></div><div class="lane-bg" style="left:75%; border:none;"></div>
    
    <div class="bottom-key" style="left:0%"></div><div class="bottom-key" style="left:25%"></div><div class="bottom-key" style="left:50%"></div><div class="bottom-key" style="left:75%; border:none;"></div>
</div>

<div id="result" class="screen">
    <h2 id="res-title" style="font-size:28px;">STAGE CLEAR</h2>
    <div id="rank" style="font-size:100px; font-weight:900; color:var(--gold); margin: 10px 0;">S</div>
    <div id="final-score" style="font-size:20px; margin-bottom: 30px; color:#aaa;">Score: 0</div>
    <button onclick="location.reload()" style="padding: 15px 40px; border-radius: 30px; border: none; font-weight: bold; background:#fff; cursor: pointer; font-size: 18px; color:#000;">로비로 돌아가기</button>
</div>

<script>
    const songs = [
        { t: "Canon in D", a: "Pachelbel", parts: { A: "F#5+D3_0.5,E5+A2_0.5,D5+B2_0.5,C#5+F#2_0.5,B4+G2_0.5,A4+D3_0.5,B4+G2_0.5,C#5+A2_0.5", B: "D5+D3_0.25,C#5_0.25,D5_0.25,D4_0.25,E4+A2_0.25,F#4_0.25,G4_0.25,A4_0.25,B4+B2_0.25,A4_0.25,G4_0.25,F#4_0.25,E4+F#2_0.25,D4_0.25,E4_0.25,F#4_0.25", C: "G4+G2_0.25,F#4_0.25,E4_0.25,D4_0.25,C#4+D3_0.25,B3_0.25,A3_0.25,G3_0.25,F#3+G2_0.25,E3_0.25,D3_0.25,E3_0.25,F#3+A2_0.25,G3_0.25,A3_0.25,B3_0.25" }, seq: "A,A,B,B,C,C,A,B,C,A" },
        { t: "Take On Me", a: "a-ha", parts: { A: "F#5+B3_0.2,F#5_0.2,D5_0.2,B4_0.2,B4+E3_0.4,E5_0.2,E5_0.2,E5_0.2,G#5+A3_0.2,G#5_0.2,A5_0.2,B5_0.2,A5+D3_0.2,A5_0.2,A5_0.2,E5_0.2,D5_0.2,F#5+B3_0.2,F#5_0.2,F#5_0.2,E5_0.2,E5_0.2,F#5_0.2,E5_0.2", B: "A4+D3_0.4,A4_0.4,E4_0.4,F#4_0.4,G#4+E3_0.8,A4+D3_0.4,A4_0.4,E4_0.4,F#4_0.4,G#4+E3_0.8" }, seq: "A,A,B,B,A,B,A,B" },
        { t: "겨울바람", a: "Chopin", parts: { A: "E4+A2_0.5,E4_0.5,F4_0.5,E4_0.5,A4+A2_1.0,G#4_0.5,A4_0.5,C5+A2_1.0,B4_0.5,C5_0.5,E5+A2_1.5", B: "A5+A2_0.15,G#5_0.15,A5_0.15,F5_0.15,E5+E2_0.15,D#5_0.15,E5_0.15,C5_0.15" }, seq: "A,B,B,A,B,B,A" },
        { t: "For Tomorrow", a: "Blur", parts: { A: "E4+A2_0.4,E4_0.4,F#4_0.4,G4_0.4,A4+D3_0.8,G4_0.4,F#4_0.4,E4+A2_0.8", B: "A4+F#3_0.4,B4_0.4,C#5_0.4,D5+G3_0.8,C#5_0.4,B4_0.4,A4+A3_0.8" }, seq: "A,A,B,B,A,B,A" },
        { t: "Waterfalls", a: "TLC", parts: { A: "Eb4+Eb2_0.5,G4_0.5,Bb4_0.5,C5+F2_1.0,Bb4_0.5,G4_0.5,F4_0.5,Eb4+Eb2_1.0", B: "Eb5+Eb2_0.5,D5_0.5,C5_0.5,Bb4+F2_1.0,G4_0.5,F4_0.5,Eb4_0.5,Eb4+Eb2_1.0" }, seq: "A,B,A,B,A,B" },
        { t: "Purple Rain", a: "Prince", parts: { A: "Bb4+Bb2_0.8,C5_0.4,D5_0.4,F5+Eb3_1.2,D5_0.4,C5_0.4,Bb4+F2_1.6", B: "F5+Bb2_0.6,F5_0.6,G5_0.6,F5+Eb3_0.8,D5_0.4,C5_0.4,Bb4+F2_1.6" }, seq: "A,A,B,B,A,B,A" },
        { t: "Piano Concerto No.2", a: "Rachmaninoff", parts: { A: "C3+C4_1.0,D3+D4_1.0,Eb3+Eb4_1.0,F3+F4_1.0,G3+G4_1.5,Ab3+Ab4_0.5,G3+G4_2.0", B: "G4+Eb3_0.5,F4_0.5,G4_0.5,Ab4+F3_1.0,G4_0.5,F4_0.5,Eb4+Eb3_1.5" }, seq: "A,B,B,A,B,B,A" },
        { t: "Swan Lake", a: "Tchaikovsky", parts: { A: "A4+A2_0.6,D5_0.3,E5_0.3,F5_0.6,E5_0.3,D5_0.3,A4+A3_1.2", B: "F5+D3_0.6,A5_0.3,G5_0.3,F5_0.6,E5_0.3,D5_0.3,E5+A2_1.2" }, seq: "A,B,A,B,A,B" },
        { t: "No Scrubs", a: "TLC", parts: { A: "G#4+G#2_0.4,G#4_0.4,B4_0.4,C#5+F#2_0.8,B4_0.4,G#4_0.4,F#4+E2_0.8", B: "B4+G#2_0.4,B4_0.4,B4_0.4,C#5+F#2_0.4,B4_0.4,G#4_0.4,G#4+E2_1.2" }, seq: "A,A,B,B,A,B,A" },
        { t: "Driver's High", a: "L'Arc-en-Ciel", parts: { A: "E5+E3_0.2,E5_0.2,D5_0.2,B4_0.2,A4+A2_0.4,G4_0.2,A4_0.2,B4+B2_0.8", B: "B4+G3_0.4,B4_0.4,D5_0.4,E5+A3_0.8,D5_0.4,B4_0.4,A4+E3_0.8" }, seq: "A,A,B,B,A,B,A" },
        { t: "Still D.R.E.", a: "Dr. Dre", parts: { A: "A4+C5+E5_0.2,A4+C5+E5_0.2,A4+C5+E5_0.2,A4+C5+E5_0.4,A4+C5+E5_0.2,A4+C5+E5_0.2,A4+C5+E5_0.2", B: "G4+B4+E5_0.2,G4+B4+E5_0.2,G4+B4+E5_0.2,G4+B4+E5_0.4,G4+B4+E5_0.2,G4+B4+E5_0.2,G4+B4+E5_0.2" }, seq: "A,B,A,B,A,B,A,B,A,B" },
        { t: "Gymnopédie No.1", a: "Erik Satie", parts: { A: "F#4+D3_1.2,A4_1.2,C#5+A2_1.2,B4_1.2", B: "F#4+D3_1.2,A4_1.2,C#5+G2_1.2,E5_1.2" }, seq: "A,B,A,B,A,B" }
    ];

    let masterPiano, sheet = [], tiles = [], isPlaying = false, score = 0, combo = 0, sheetIdx = 0, selected = 0;
    let difficulty = "normal", speedMult = 1.0, hitLineY, gameStartTime = 0;
    const gameArea = document.getElementById('game');

    // 리버브 약간 세팅하여 디지털 피아노의 선명함 유지
    const reverb = new Tone.Reverb({ decay: 1.2, wet: 0.15 }).toDestination();
    masterPiano = new Tone.PolySynth(Tone.Synth, { 
        volume: -2, 
        oscillator: { type: "triangle" }, 
        envelope: { attack: 0.01, decay: 0.2, sustain: 0.4, release: 0.6 } 
    }).connect(reverb);

    function renderSongs() {
        const listDiv = document.getElementById('song-list');
        listDiv.innerHTML = ""; 
        songs.forEach((s, idx) => {
            const item = document.createElement('div');
            item.className = `song-item ${idx === selected ? 'active' : ''}`;
            item.innerHTML = `<div><div style="font-weight:bold; font-size:14px;">${s.t}</div><div style="font-size:11px;color:var(--gold);">${s.a}</div></div>`;
            item.onclick = () => { selected = idx; renderSongs(); };
            listDiv.appendChild(item);
        });
    }
    renderSongs();

    document.querySelectorAll('.diff-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            difficulty = e.target.getAttribute('data-diff');
        });
    });

    // 🔥 1. 완벽한 음역대 정규화 (Min/Max 기반) & 자동 연주 제거!
    function parseAndSchedule(songObj) {
        const noteArray = [];
        let time = 1.5; 
        const sequence = songObj.seq.split(',');
        
        const rawItems = [];
        let minMidi = 999, maxMidi = -999;

        // 1차 순회: 모든 노트의 Min/Max 음역대를 먼저 파악
        for (let partKey of sequence) {
            const partStr = songObj.parts[partKey];
            if (!partStr) continue;
            const items = partStr.split(',');
            for (let item of items) {
                const [noteStr, durStr] = item.split('_');
                const dur = parseFloat(durStr);
                const notes = noteStr.split('+'); 
                
                notes.sort((a, b) => Tone.Frequency(b).toMidi() - Tone.Frequency(a).toMidi());
                const highestNote = notes[0]; 
                const midi = Tone.Frequency(highestNote).toMidi();

                if (!isNaN(midi)) {
                    minMidi = Math.min(minMidi, midi);
                    maxMidi = Math.max(maxMidi, midi);
                }
                rawItems.push({ notes, dur, midi });
            }
        }

        if (maxMidi === minMidi) maxMidi = minMidi + 1; // 0으로 나누기 방지

        // 2차 순회: 정규화된 값으로 0~3 레인 분배
        for (let obj of rawItems) {
            let lane = 0;
            if (!isNaN(obj.midi)) {
                lane = Math.floor(((obj.midi - minMidi) / (maxMidi - minMidi)) * 3.99); // 0~3 분배
            }
            
            // 최고음+그 아래음 (최대 2개)만 남김
            const playNotes = obj.notes.slice(0, 2);
            noteArray.push({ t: time, l: lane, n: playNotes, d: obj.dur });
            time += obj.dur;
        }

        return noteArray;
    }

    document.getElementById('start-btn').addEventListener('pointerdown', async (e) => {
        e.preventDefault();
        await Tone.start(); 
        
        speedMult = difficulty === "easy" ? 0.75 : (difficulty === "hard" ? 1.4 : 1.0);
        Tone.Transport.playbackRate = speedMult;
        
        document.getElementById('lobby').style.display = 'none';
        gameArea.style.display = 'block';
        hitLineY = gameArea.offsetHeight * 0.85;

        tiles.forEach(t => t.el.remove());
        tiles = [];
        sheet = parseAndSchedule(songs[selected]);
        isPlaying = true; score = 0; combo = 0; sheetIdx = 0;
        gameStartTime = Tone.now(); 
        
        document.getElementById('score').innerText = "0";
        document.getElementById('combo').classList.remove('show');
        Tone.Transport.stop();
        Tone.Transport.position = 0;
        
        setTimeout(() => {
            Tone.Transport.start();
            requestAnimationFrame(loop);
        }, 150);
    });

    function showJudg(txt, col) {
        const j = document.getElementById('judgment');
        j.innerText = txt; j.style.color = col; j.style.opacity = 1;
        j.style.transform = "scale(1.2)";
        setTimeout(() => { j.style.opacity = 0; j.style.transform = "scale(1)"; }, 250);
    }

    // PERFECT 연출 (화면 번쩍임)
    function flashScreen() {
        document.body.style.background = "#222";
        setTimeout(() => { document.body.style.background = "var(--bg)"; }, 100);
    }

    function updateScore(isHit, diff = 0) {
        if (isHit) {
            combo++;
            let points = 10;
            let jTxt = "GOOD";
            let jCol = "#fff";

            if (diff < 0.08) { 
                points = 30; jTxt = "PERFECT"; jCol = "var(--neon)"; 
                if(combo > 5) flashScreen(); // 콤보 시 이펙트
            }
            else if (diff < 0.16) { points = 20; jTxt = "GREAT"; jCol = "var(--gold)"; }

            score += points + Math.floor(combo / 5); 
            document.getElementById('score').innerText = score;
            document.getElementById('combo').innerText = `${combo} COMBO`;
            document.getElementById('combo').classList.add('show');
            showJudg(jTxt, jCol);
        } else {
            combo = 0;
            document.getElementById('combo').classList.remove('show');
        }
    }

    gameArea.addEventListener("pointerdown", (e) => {
        if (!isPlaying) return;
        if (Tone.now() - gameStartTime < 0.5) return;

        const rect = gameArea.getBoundingClientRect();
        const touchX = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
        const lane = Math.floor(touchX / (rect.width / 4));
        const now = Tone.Transport.seconds;

        let hitSomething = false;
        for (let i = 0; i < tiles.length; i++) {
            const o = tiles[i];
            if (o.hit || o.miss || o.data.l !== lane) continue; 

            const diff = Math.abs(o.data.t - now);
            if (diff < 0.25) { 
                // 🔥 2. 누르는 순간 실제 그 음이 바로 연주됨 (시간 기준은 undefined로 즉시 재생)
                masterPiano.triggerAttackRelease(o.data.n, o.data.d * 0.8, undefined, 0.9);
                
                o.hit = true;
                o.el.classList.add("pressed");
                updateScore(true, diff);
                hitSomething = true;
                break; 
            }
        }

        // 잘못된 곳을 누르거나 빗나갔을 때의 처리 (콤보 초기화 및 근처 타일 게임오버 여부 확인)
        if (!hitSomething) {
            updateScore(false);
            const hasActiveNoteNear = tiles.find(o => !o.hit && !o.miss && Math.abs(o.data.t - now) < 0.25);
            if (hasActiveNoteNear) end(false); // 칠 타일이 있는데 허공을 쳤다면 게임오버
        }
    });

    function loop() {
        if(!isPlaying) return;
        const now = Tone.Transport.seconds; 
        const speed = hitLineY / 1.3;

        while(sheetIdx < sheet.length && sheet[sheetIdx].t < now + 1.3) {
            const data = sheet[sheetIdx++];
            const el = document.createElement('div');
            const h = Math.max(70, data.d * speed * 0.9);
            el.className = `tile ${data.d >= 0.6 ? 'long' : ''}`;
            el.style.left = (data.l * 25) + '%';
            el.style.height = h + 'px';
            el.style.top = "-500px";
            const obj = { el, data, h, hit: false, miss: false };
            gameArea.appendChild(el);
            tiles.push(obj);
        }

        for(let i = tiles.length - 1; i >= 0; i--) {
            const o = tiles[i];
            const bottom = hitLineY - (o.data.t - now) * speed;
            o.el.style.top = (bottom - o.h) + "px";

            // 타일 놓침 판정 (완전히 지나갔을 때)
            if(!o.hit && !o.miss && (o.data.t - now) < -0.25) {
                o.miss = true; 
                end(false); // 타일 놓치면 얄짤없이 즉시 끝 (클래식 룰 복귀)
                return;
            }
            if(bottom - o.h > gameArea.offsetHeight + 100) { 
                o.el.remove(); 
                tiles.splice(i, 1); 
            }
        }
        if(sheetIdx >= sheet.length && tiles.length === 0) end(true);
        else requestAnimationFrame(loop);
    }

    function end(win) {
        if (!isPlaying) return;
        isPlaying = false; 
        Tone.Transport.pause(); 
        masterPiano.releaseAll(); 
        
        gameArea.style.display = 'none';
        document.getElementById('result').style.display = 'flex';
        document.getElementById('res-title').innerText = win ? "PERFORMANCE CLEARED" : "PERFORMANCE OVER";
        document.getElementById('rank').innerText = win ? (score > 1500 ? "SSS" : "S") : "F";
        document.getElementById('final-score').innerText = `Score: ${score}`;
    }
</script>
</body>
</html>
