<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Piano Tiles - V26 Masterpiece</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root { --neon: #00f2ff; --pink: #ff00ea; --gold: #ffea00; }
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { color: #000; height: 100dvh; overflow: hidden; background: #000; touch-action: none; }
        .screen { position: absolute; top: 0; left: 50%; width: 100%; height: 100%; max-width: 500px; transform: translateX(-50%); display: none; flex-direction: column; background: #fff; }
        
        /* 로비 디자인 */
        #lobby { display: flex; z-index: 100; padding: 25px; background: #050508; color: #fff; }
        h1 { text-align: center; font-size: 26px; font-weight: 900; background: linear-gradient(90deg, var(--neon), var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; padding: 15px 0; }
        #song-list { flex: 1; overflow-y: auto; background: rgba(255,255,255,0.05); border-radius: 20px; padding: 12px; margin-bottom: 20px; border: 1px solid #333; }
        .song-item { padding: 16px; border-bottom: 1px solid #222; border-radius: 12px; margin-bottom: 8px; cursor: pointer; background: rgba(255,255,255,0.03); }
        .song-item.active { background: rgba(0,242,255,0.15); border: 1px solid var(--neon); }
        #start-btn { width: 100%; padding: 22px; border-radius: 50px; border: none; font-size: 20px; font-weight: 900; background: linear-gradient(45deg, var(--neon), var(--pink)); color: #fff; cursor: pointer; }

        /* 게임 화면 */
        #game { z-index: 50; position: relative; background: #fff; border-left: 1px solid #eee; border-right: 1px solid #eee; }
        .lane-line { position: absolute; top: 0; width: 25%; height: 100%; border-right: 1px solid #f0f0f0; pointer-events: none; }
        #score { position: absolute; top: 40px; width: 100%; text-align: center; font-size: 70px; font-weight: 900; z-index: 60; color: #ff0055; pointer-events: none; text-shadow: 2px 2px 0#fff, -2px -2px 0#fff; }
        
        .row { position: absolute; width: 100%; height: 25%; transition: bottom 0.12s cubic-bezier(0, 0, 0.2, 1); pointer-events: none; }
        .tile { position: absolute; width: 25%; height: 100%; background: #111; border: 1px solid #000; pointer-events: auto; }
        .tile.pressed { background: #ddd !important; }
        .tile.missed { background: #ff0055 !important; animation: blink 0.2s infinite; }
        
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        #result { justify-content: center; align-items: center; text-align: center; z-index: 200; background: rgba(0,0,0,0.95); color: #fff; }
    </style>
</head>
<body>

<div id="lobby" class="screen" style="display: flex;">
    <h1>V26 CONCERT MASTER</h1>
    <div id="song-list"></div>
    <button id="start-btn">웅장한 무대 조율 중...</button>
</div>

<div id="game" class="screen">
    <div class="lane-line" style="left:0%"></div>
    <div class="lane-line" style="left:25%"></div>
    <div class="lane-line" style="left:50%"></div>
    <div class="lane-line" style="left:75%; border:none;"></div>
    <div id="score">0</div>
</div>

<div id="result" class="screen">
    <h2 id="res-title">BRAVO!</h2>
    <div id="rank" style="font-size:100px; font-weight:900; color:var(--gold);">S</div>
    <div id="final-score">Score: 0</div>
    <button onclick="location.reload()" style="padding: 20px 60px; border-radius: 50px; background:#fff; font-size: 20px; font-weight: bold; color:#000; cursor: pointer;">다시 도전</button>
</div>

<script>
    // 🎹 소희님의 12곡 완벽 복원
    const songs = [
        { t: "Piano Concerto No.2", a: "Rachmaninoff", p: "C4,Eb4,G4,C5,G4,Eb4,C4,G3" },
        { t: "Swan Lake", a: "Tchaikovsky", p: "A4,E5,D5,C5,B4,A4,B4,C5" },
        { t: "Winter Wind", a: "Chopin", p: "E4,E4,F4,E4,A4,G#4,A4,C5,B4,C5,E5" },
        { t: "Purple Rain", a: "Prince", p: "Bb3,F4,G4,F4,Bb3,F4,G4,F4" },
        { t: "Still D.R.E.", a: "Dr. Dre", p: "E5,E5,E5,E5,E5,E5,E5,B4,B4,B4,B4" },
        { t: "No Scrubs", a: "TLC", p: "G#4,F#4,E4,F#4,G#4,G#4,G#4" },
        { t: "Honey", a: "L'Arc-en-Ciel", p: "E4,F#4,G#4,A4,B4,A4,G#4,F#4" },
        { t: "For Tomorrow", a: "Blur", p: "G4,A4,B4,D5,B4,A4,G4,E4" },
        { t: "Canon in D", a: "Pachelbel", p: "F#5,E5,D5,C#5,B4,A4,B4,C#5" },
        { t: "River Flows in You", a: "Yiruma", p: "F#4,E4,F#4,C#4,F#4,E4,F#4,C#4" },
        { t: "Nocturne Op.9 No.2", a: "Chopin", p: "G4,G5,F5,G5,Eb5,D5,C5,Bb4" },
        { t: "Take On Me", a: "a-ha", p: "F#5,F#5,D5,B4,B4,E5,E5,E5,G#5,G#5" }
    ];

    let piano, sheet = [], activeRows = [];
    let isPlaying = false, score = 0, currentStep = 0, selected = 0, canClick = false;
    const gameArea = document.getElementById('game');

    // 🎧 지피티 제안 콘서트홀 사운드 이식
    const reverb = new Tone.Reverb({ decay: 4, wet: 0.35 }).toDestination();
    const compressor = new Tone.Compressor(-12, 3).connect(reverb);
    
    piano = new Tone.Sampler({
        urls: { A0: "A0.mp3", C1: "C1.mp3", C4: "C4.mp3", C8: "C8.mp3" },
        release: 4, 
        baseUrl: "https://tonejs.github.io/audio/salamander/",
        onload: () => { document.getElementById('start-btn').innerText = "콘서트 시작하기"; }
    }).connect(compressor);

    function renderSongs() {
        const listDiv = document.getElementById('song-list');
        listDiv.innerHTML = "";
        songs.forEach((s, idx) => {
            const item = document.createElement('div');
            item.className = `song-item ${idx === selected ? 'active' : ''}`;
            item.innerHTML = `<strong>${s.t}</strong><br><small style="color:#aaa">${s.a}</small>`;
            item.onclick = () => { selected = idx; renderSongs(); };
            listDiv.appendChild(item);
        });
    }
    renderSongs();

    function playNote(note) {
        const vel = 0.75 + Math.random() * 0.25;
        piano.triggerAttackRelease(note, "4n", undefined, vel);
        try {
            const root = Tone.Frequency(note).transpose(-12).toNote();
            const fifth = Tone.Frequency(note).transpose(-7).toNote();
            const octave = Tone.Frequency(note).transpose(-24).toNote();
            piano.triggerAttackRelease([octave], "4n", "+0.03", vel - 0.3);
            piano.triggerAttackRelease([root, fifth], "4n", "+0.06", vel - 0.2);
        } catch(e) {}
    }

    document.getElementById('start-btn').addEventListener('click', async (e) => {
        e.stopPropagation();
        if (document.getElementById('start-btn').innerText.includes("조율")) return;
        await Tone.start();
        document.getElementById('lobby').style.display = 'none';
        gameArea.style.display = 'block';

        const song = songs[selected];
        sheet = [];
        const notes = song.p.split(',');
        for(let i=0; i<100; i++) {
            sheet.push({ lane: Math.floor(Math.random()*4), note: notes[i % notes.length] });
        }

        isPlaying = true; score = 0; currentStep = 0; activeRows = []; canClick = false;
        document.getElementById('score').innerText = "0";
        for(let i=0; i<5; i++) createRow(i);
        setTimeout(() => { canClick = true; }, 200);
    });

    function createRow(offset) {
        const sheetIdx = currentStep + offset;
        if(sheetIdx >= sheet.length) return; 

        const data = sheet[sheetIdx];
        const rowEl = document.createElement('div');
        rowEl.className = 'row';
        rowEl.style.bottom = (offset * 25) + '%'; 

        const tileEl = document.createElement('div');
        tileEl.className = 'tile';
        tileEl.style.left = (data.lane * 25) + '%';
        
        rowEl.appendChild(tileEl);
        gameArea.appendChild(rowEl);
        activeRows.push({ rowEl, tileEl, lane: data.lane, note: data.note, locked: false });
    }

    // 🛠️ V26 무결점 클릭 로직: "누른 요소"를 직접 확인
    gameArea.addEventListener("pointerdown", (e) => {
        if (!isPlaying || !canClick || activeRows.length === 0) return;
        e.preventDefault();

        // 현재 화면에서 가장 낮은 타일 찾기
        activeRows.sort((a, b) => parseFloat(a.rowEl.style.bottom) - parseFloat(b.rowEl.style.bottom));
        const targetRow = activeRows[0];

        // 정확히 타일을 눌렀는지 체크
        const isCorrectTile = (e.target === targetRow.tileEl);

        if (isCorrectTile && !targetRow.locked) {
            // ✅ 정답
            targetRow.locked = true;
            playNote(targetRow.note);
            targetRow.tileEl.classList.add('pressed');
            
            score++;
            document.getElementById('score').innerText = score;
            
            const removed = activeRows.shift();
            setTimeout(() => removed.rowEl.remove(), 80);
            
            // 🎹 모든 타일을 강제로 한 칸씩 아래로 이동 (멈춤 방지)
            activeRows.forEach((r, idx) => {
                r.rowEl.style.bottom = (idx * 25) + '%'; 
            });
            
            currentStep++;
            createRow(4);

            if(currentStep >= sheet.length && activeRows.length === 0) {
                setTimeout(() => end(true), 300);
            }
        } else if (!e.target.classList.contains('pressed')) {
            // ❌ 오답: 빈 공간이나 다른 타일을 누름
            const rect = gameArea.getBoundingClientRect();
            const lane = Math.floor((e.clientX - rect.left) / (rect.width / 4));
            const errTile = document.createElement('div');
            errTile.className = 'tile missed';
            errTile.style.left = (Math.max(0, Math.min(3, lane)) * 25) + '%';
            targetRow.rowEl.appendChild(errTile);
            end(false);
        }
    });

    function end(win) {
        if (!isPlaying) return;
        isPlaying = false;
        setTimeout(() => {
            gameArea.style.display = 'none';
            document.getElementById('result').style.display = 'flex';
            document.getElementById('res-title').innerText = win ? "BRAVO!" : "GAME OVER";
            document.getElementById('rank').innerText = win ? "SSS" : (score > 60 ? "S" : (score > 20 ? "A" : "F"));
            document.getElementById('final-score').innerText = `Score: ${score}`;
        }, 400);
    }
</script>
</body>
</html>
