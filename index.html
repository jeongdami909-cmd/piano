<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Piano Tiles - V38 Rhythm Master</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root { --pink: #ff99f1; --neon: #00f2ff; --gold: #ffea00; }
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #000; height: 100dvh; overflow: hidden; touch-action: none; }
        
        .screen { position: absolute; top: 0; left: 50%; width: 100%; height: 100%; max-width: 500px; transform: translateX(-50%); display: none; flex-direction: column; background: #fff; border-left: 1px solid #ddd; border-right: 1px solid #ddd; }
        
        #lobby { display: flex; z-index: 100; padding: 25px; background: #0a0a0c; color: #fff; }
        h1 { text-align: center; font-size: 26px; font-weight: 900; background: linear-gradient(90deg, var(--neon), var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; padding: 15px 0; }
        #song-list { flex: 1; overflow-y: auto; background: rgba(255,255,255,0.05); border-radius: 20px; padding: 12px; margin-bottom: 20px; border: 1px solid #333; }
        .song-item { padding: 16px; border-bottom: 1px solid #222; border-radius: 12px; margin-bottom: 8px; cursor: pointer; background: rgba(255,255,255,0.03); }
        .song-item.active { background: var(--pink); color: #000; font-weight: bold; }
        #start-btn { width: 100%; padding: 22px; border-radius: 50px; border: none; font-size: 18px; font-weight: 900; background: #fff; color: #ff66cc; cursor: pointer; }

        #game { z-index: 50; position: relative; background: #fff; overflow: hidden; }
        .lane-line { position: absolute; top: 0; width: 25%; height: 100%; border-right: 1px solid #eee; pointer-events: none; }
        #score { position: absolute; top: 40px; width: 100%; text-align: center; font-size: 70px; font-weight: 900; z-index: 60; color: #ff0055; pointer-events: none; text-shadow: 2px 2px 0#fff, -2px -2px 0#fff; }
        
        .row { position: absolute; width: 100%; height: 25%; pointer-events: none; }
        .tile { position: absolute; width: 25%; height: 100%; background: #111; border: 1px solid #000; pointer-events: auto; }
        .tile.pressed { background: #bbb !important; }
        .tile.missed { background: #ff0055 !important; animation: blink 0.2s infinite; }
        
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        #result { justify-content: center; align-items: center; text-align: center; z-index: 200; background: rgba(0,0,0,0.95); color: #fff; }
    </style>
</head>
<body>

<div id="lobby" class="screen" style="display: flex;">
    <h1>V38 RHYTHM MASTER</h1>
    <div id="song-list"></div>
    <button id="start-btn">웅장한 무대 조율 중...</button>
</div>

<div id="game" class="screen">
    <div class="lane-line" style="left:0%"></div>
    <div class="lane-line" style="left:25%"></div>
    <div class="lane-line" style="left:50%"></div>
    <div class="lane-line" style="left:75%; border:none;"></div>
    <div id="score">0</div>
</div>

<div id="result" class="screen">
    <h2 id="res-title">SONG CLEAR!</h2>
    <div id="rank" style="font-size:100px; font-weight:900; color:var(--gold);">S</div>
    <div id="final-score">Score: 0</div>
    <button onclick="location.reload()" style="padding: 20px 60px; border-radius: 50px; background:#fff; font-size: 18px; font-weight: bold; color:#000;">다시 연주</button>
</div>

<script>
    // 🎹 소희님의 12곡 리스트 복원
    const songs = [
        { t: "La Campanella", a: "Liszt", p: "D#6,D#6,D#6,D#6,D#6,D#6,C#6,B5,A#5,G#5,F#5,E5,D#5" },
        { t: "Piano Concerto No.2", a: "Rachmaninoff", p: "C4,Eb4,G4,C5,G4,Eb4,C4,G3" },
        { t: "Winter Wind", a: "Chopin", p: "E4,E4,F4,E4,A4,G#4,A4,C5,B4,C5,E5" },
        { t: "Purple Rain", a: "Prince", p: "Bb3,F4,G4,F4,Bb3,F4,G4,F4" },
        { t: "Still D.R.E.", a: "Dr. Dre", p: "E5,E5,E5,E5,E5,E5,E5,B4,B4,B4,B4" },
        { t: "No Scrubs", a: "TLC", p: "G#4,F#4,E4,F#4,G#4,G#4,G#4" },
        { t: "Honey", a: "L'Arc-en-Ciel", p: "E4,F#4,G#4,A4,B4,A4,G#4,F#4" },
        { t: "For Tomorrow", a: "Blur", p: "G4,A4,B4,D5,B4,A4,G4,E4" },
        { t: "Canon in D", a: "Pachelbel", p: "F#5,E5,D5,C#5,B4,A4,B4,C#5" },
        { t: "River Flows in You", a: "Yiruma", p: "F#4,E4,F#4,C#4,F#4,E4,F#4,C#4" },
        { t: "Nocturne Op.9 No.2", a: "Chopin", p: "G4,G5,F5,G5,Eb5,D5,C5,Bb4" },
        { t: "Take On Me", a: "a-ha", p: "F#5,F#5,D5,B4,B4,E5,E5,E5,G#5,G#5" }
    ];

    let piano, sheet = [], activeRows = [];
    let isPlaying = false, score = 0, currentStep = 0, selected = 0, canClick = false;
    let speed = 0.6; // 초기 속도
    const gameArea = document.getElementById('game');

    // 🎧 쇳소리 방지용 클린 사운드 세팅
    const hall = new Tone.Reverb({ decay: 2.0, wet: 0.2 }).toDestination();
    const compressor = new Tone.Compressor(-15, 2).connect(hall);
    piano = new Tone.Sampler({
        urls: { A0:"A0.mp3", C1:"C1.mp3", C4:"C4.mp3", C8:"C8.mp3" },
        release: 1.5,
        baseUrl: "https://tonejs.github.io/audio/salamander/",
        onload: () => { document.getElementById('start-btn').innerText = "연주 시작하기"; }
    }).connect(compressor);

    function renderSongs() {
        const listDiv = document.getElementById('song-list');
        listDiv.innerHTML = "";
        songs.forEach((s, idx) => {
            const item = document.createElement('div');
            item.className = `song-item ${idx === selected ? 'active' : ''}`;
            item.innerHTML = `<strong>${s.t}</strong><br><small style="color:#aaa">${s.a}</small>`;
            item.onclick = (e) => { e.stopPropagation(); selected = idx; renderSongs(); };
            listDiv.appendChild(item);
        });
    }
    renderSongs();

    function playHuman(note){
        const vel = 0.75 + Math.random()*0.2;
        piano.triggerAttackRelease(note, "8n", undefined, vel);
        if(Math.random() < 0.3){
            const low = Tone.Frequency(note).transpose(-12).toNote();
            piano.triggerAttackRelease(low, "8n", "+0.02", vel-0.25);
        }
    }

    document.getElementById('start-btn').addEventListener('click', async (e) => {
        e.preventDefault(); e.stopPropagation(); 
        await Tone.start();
        document.getElementById('lobby').style.display = 'none';
        gameArea.style.display = 'block';

        const song = songs[selected];
        sheet = [];
        const notes = song.p.split(',');
        for(let i=0; i<300; i++) {
            sheet.push({ lane: Math.floor(Math.random()*4), note: notes[i % notes.length] });
        }

        isPlaying = true; score = 0; currentStep = 0; activeRows = []; speed = 0.6;
        document.getElementById('score').innerText = "0";
        
        // 타일 생성 (뭉침 방지)
        for(let i=0; i<4; i++) createRow(110 + (i * 25));
        
        // 🛡️ 즉사 보호막: 시작 후 0.5초간 터치 무시
        setTimeout(() => { canClick = true; }, 500);
        requestAnimationFrame(gameLoop);
    });

    function createRow(bottomVal) {
        if(currentStep >= sheet.length) return;
        const data = sheet[currentStep];
        const rowEl = document.createElement('div');
        rowEl.className = 'row';
        rowEl.style.bottom = bottomVal + '%';
        const tileEl = document.createElement('div');
        tileEl.className = 'tile';
        tileEl.style.left = (data.lane * 25) + '%';
        rowEl.appendChild(tileEl);
        gameArea.appendChild(rowEl);
        activeRows.push({ rowEl, tileEl, lane: data.lane, note: data.note, locked: false });
        currentStep++;
    }

    function gameLoop() {
        if (!isPlaying) return;
        for (let i = activeRows.length - 1; i >= 0; i--) {
            const row = activeRows[i];
            const currentBottom = parseFloat(row.rowEl.style.bottom);
            const newBottom = currentBottom - speed;
            row.rowEl.style.bottom = newBottom + "%";
            
            // 바닥(0%)을 완전히 지나쳤을 때만 게임오버
            if (newBottom < -10 && !row.locked) {
                end(false);
                return;
            }
        }
        speed += 0.0001; 
        requestAnimationFrame(gameLoop);
    }

    // 🛠️ V38 핵심: 레인 기반 물리 판정 엔진
    gameArea.addEventListener("pointerdown", (e) => {
        if (!isPlaying || !canClick || activeRows.length === 0) return;
        e.preventDefault();
        
        // 물리 위치 기준으로 가장 아래의 타겟 찾기
        let bottomRow = null;
        let lowestPos = Infinity;
        activeRows.forEach(r => {
            if (!r.locked) {
                const b = parseFloat(r.rowEl.style.bottom);
                if (b < lowestPos) { lowestPos = b; bottomRow = r; }
            }
        });

        if (!bottomRow) return;

        // 판정 범위: 바닥 근처 40% 이내만 인정
        if (lowestPos > 40) return;

        // 레인 기반 판정 (좌표 계산)
        const rect = gameArea.getBoundingClientRect();
        const tx = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
        let lane = Math.floor(tx / (rect.width / 4));
        lane = Math.max(0, Math.min(3, lane));

        if (lane === bottomRow.lane) {
            bottomRow.locked = true;
            playHuman(bottomRow.note);
            bottomRow.tileEl.classList.add('pressed');
            score++;
            document.getElementById('score').innerText = score;
            
            setTimeout(() => {
                bottomRow.rowEl.remove();
                activeRows = activeRows.filter(r => r !== bottomRow);
            }, 60);
            
            // 타일 보충
            const topRow = activeRows[activeRows.length - 1];
            createRow((topRow ? parseFloat(topRow.rowEl.style.bottom) : 100) + 25);
            
            if(currentStep >= sheet.length && activeRows.length === 0) {
                setTimeout(() => end(true), 300);
            }
        } else {
            // 오답 판정
            const errTile = document.createElement('div');
            errTile.className = 'tile missed';
            errTile.style.left = (lane * 25) + '%';
            bottomRow.rowEl.appendChild(errTile);
            end(false);
        }
    });

    function end(win) {
        if (!isPlaying) return;
        isPlaying = false;
        setTimeout(() => {
            gameArea.style.display = 'none';
            document.getElementById('result').style.display = 'flex';
            document.getElementById('res-title').innerText = win ? "SONG CLEAR!" : "GAME OVER";
            document.getElementById('rank').innerText = win ? "SSS" : (score > 150 ? "S" : (score > 50 ? "A" : "F"));
            document.getElementById('final-score').innerText = `Score: ${score}`;
        }, 300);
    }
</script>
</body>
</html>
