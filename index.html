<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Magic Piano: Cinematic Concert</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root { --neon: #00f2ff; --pink: #ff00ea; --bg: #05050a; }
        * { box-sizing: border-box; user-select: none; font-family: 'Pretendard', sans-serif; }
        
        @keyframes aurora { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        body { 
            margin: 0; color: #fff; height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
            background: linear-gradient(-45deg, #0a001a, #001133, #05050a, #1a001a);
            background-size: 400% 400%; animation: aurora 15s ease infinite;
        }

        #lobby { 
            display: flex; flex-direction: column; height: 100%; width: 100%; max-width: 500px; 
            margin: 0 auto; background: rgba(0,0,0,0.85); backdrop-filter: blur(20px); z-index: 20; position: relative;
        }
        
        header { flex: 0 0 auto; padding: 30px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        header h1 { margin: 0; font-size: 28px; font-weight: 900; background: linear-gradient(90deg, #00e5ff, #ff00ea); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 10px rgba(0,229,255,0.5)); }
        header p { margin: 8px 0 0; font-size: 13px; color: #888; letter-spacing: 1px; }
        
        #song-list { flex: 1 1 auto; overflow-y: auto; padding: 20px; -webkit-overflow-scrolling: touch; }
        .song-item { 
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; 
            padding: 22px; margin-bottom: 15px; display: flex; flex-direction: column; cursor: pointer; transition: 0.3s;
        }
        .song-item.active { border-color: var(--neon); background: rgba(0, 229, 255, 0.1); box-shadow: 0 0 20px rgba(0,229,255,0.3); transform: scale(1.03); }
        .song-genre { font-size: 11px; color: var(--neon); font-weight: bold; margin-bottom: 6px; letter-spacing: 2px; }
        .song-title { font-size: 17px; font-weight: bold; color: #fff; }

        .footer { flex: 0 0 auto; padding: 25px; background: rgba(0,0,0,0.9); border-top: 1px solid #222; }
        #start-btn { 
            width: 100%; padding: 20px; background: linear-gradient(90deg, #00e5ff, #ff00ea); color: #fff; 
            font-size: 20px; font-weight: 900; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 10px 30px rgba(255,0,234,0.5); 
        }

        #game { touch-action: none; display: none; width: 100vw; max-width: 500px; height: 100%; margin: 0 auto; position: relative; overflow: hidden; background: #000; }
        .lane-bg { position: absolute; width: 25%; height: 100%; border-right: 1px solid rgba(255,255,255,0.05); }
        .lane-flash { position: absolute; width: 25%; height: 100%; background: linear-gradient(to top, var(--neon), transparent); opacity: 0; pointer-events: none; transition: opacity 0.1s; }
        
        #hit-line { position: absolute; bottom: 15%; width: 100%; height: 2px; background: #fff; box-shadow: 0 0 20px var(--neon), 0 0 40px var(--pink); z-index: 5; }
        
        .tile { 
            position: absolute; width: 25%; height: 160px; border-radius: 10px;
            background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(0,229,255,0.6) 100%);
            border: 2px solid #fff; box-shadow: 0 0 15px rgba(0,229,255,0.4); z-index: 10;
        }
        .tile.pressed { opacity: 0; transform: scale(1.3); transition: 0.15s ease-out; }

        .particle { position: absolute; width: 6px; height: 6px; background: #fff; border-radius: 50%; pointer-events: none; animation: spark 0.6s forwards; z-index: 25; }
        @keyframes spark { 0% { transform: scale(1) translate(0,0); opacity: 1; } 100% { transform: scale(0) translate(var(--tx), var(--ty)); opacity: 0; } }

        #hud { position: absolute; top: 40px; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 30; pointer-events: none; }
        #score { font-size: 60px; font-weight: 900; text-shadow: 0 0 20px var(--neon); }
        #lives { font-size: 22px; margin-top: 10px; letter-spacing: 4px; }
    </style>
</head>
<body>

<div id="lobby">
    <header>
        <h1>PIANO CONCERT</h1>
        <p>웅장한 반주와 화려한 빛의 향연</p>
    </header>
    <div id="song-list"></div>
    <div class="footer">
        <button id="start-btn">CONCERT START</button>
    </div>
</div>

<div id="game">
    <div id="hud">
        <div id="score">0</div>
        <div id="lives">❤️❤️❤️</div>
    </div>
    <div class="lane-bg" style="left:0%"></div>
    <div class="lane-bg" style="left:25%"></div>
    <div class="lane-bg" style="left:50%"></div>
    <div class="lane-bg" style="left:75%; border:none;"></div>
    <div id="flash-0" class="lane-flash" style="left:0%"></div>
    <div id="flash-1" class="lane-flash" style="left:25%"></div>
    <div id="flash-2" class="lane-flash" style="left:50%"></div>
    <div id="flash-3" class="lane-flash" style="left:75%"></div>
    <div id="hit-line"></div>
</div>

<script>
    const library = [
        { g: "CLASSIC", t: "라흐마니노프 - 협주곡 2번", s: 8.5, b: ["C2", "G2", "C3", "G2"], m: ["C4", "Eb4", "G4", "C5", "B4", "G4", "Eb4", "C4", "Bb3", "C4", "Eb4", "G4", "Eb5", "D5", "C5"] },
        { g: "POP", t: "TLC - No Scrubs", s: 8, b: ["C3", "G2", "F2", "G2"], m: ["F4", "F4", "F4", "F4", "E4", "Eb4", "Eb4", "Eb4", "F4", "F4", "F4", "F4", "E4", "Eb4"] },
        { g: "R&B / POP", t: "Prince - Purple Rain", s: 7, b: ["Bb2", "F2", "G2", "Eb2"], m: ["Bb4", "C5", "D5", "F5", "F5", "F5", "D5", "C5", "Bb4", "G4", "F4", "Bb4"] },
        { g: "K-POP", t: "뉴진스 - Ditto", s: 9, b: ["C3", "G3", "A2", "E3"], m: ["C5", "E5", "G5", "C6", "G5", "E5", "C5", "A4", "G4", "F4", "E4", "C4"] },
        { g: "K-POP", t: "BTS - Dynamite", s: 9.5, b: ["C#3", "F#3", "G#3", "C#3"], m: ["G4", "G4", "G4", "G4", "E4", "D4", "C4", "E4", "G4", "A4", "G4", "G4"] },
        { g: "CLASSIC", t: "엘리제를 위하여", s: 7.5, b: ["A2", "E3", "A2", "E3"], m: ["E5", "D#5", "E5", "D#5", "E5", "B4", "D5", "C5", "A4", "C4", "E4", "A4", "B4"] },
        { g: "CLASSIC", t: "차이코프스키 - 백조의 호수", s: 8, b: ["B2", "F#3", "G2", "D3"], m: ["B4", "D5", "E5", "G5", "F#5", "E5", "D5", "B4", "G4", "B4", "D5", "E5"] },
        { g: "EDM", t: "Alan Walker - Faded", s: 9, b: ["F#2", "D2", "A2", "E2"], m: ["F#5", "F#5", "F#5", "E5", "D5", "D5", "D5", "C#5", "A4", "A4", "A4", "E5"] },
        { g: "ANIME", t: "하울의 움직이는 성", s: 7.5, b: ["G2", "D3", "Bb2", "D3"], m: ["D4", "G4", "Bb4", "D5", "C5", "Bb4", "A4", "Bb4", "G4", "A4", "F#4", "G4"] },
        { g: "MOVIE", t: "말할 수 없는 비밀 (Secret)", s: 10, b: ["C3", "G3", "A2", "F2"], m: ["E5", "D#5", "E5", "B4", "D5", "C5", "A4", "C4", "E4", "A4", "B4", "E4"] },
        { g: "POP", t: "Coldplay - Viva La Vida", s: 8.5, b: ["C#3", "D3", "A3", "E3"], m: ["E5", "D5", "C5", "B4", "A4", "G4", "A4", "C5", "D5", "E5", "D5", "C5"] },
        { g: "CLASSIC", t: "쇼팽 - 흑건", s: 11, b: ["Gb2", "Db3", "Gb2", "Db3"], m: ["Gb5", "Eb5", "Db5", "Bb4", "Gb4", "Eb4", "Db4", "Bb3", "Gb3", "Eb3"] }
    ];

    let selected = 0, audioCtx, bgmSynth, melodySynth, reverb, isPlaying = false, score = 0, lives = 3, nIdx = 0, tiles = [], loopId, spawnId, bgmLoop;
    const TARGET = 100;

    const listDiv = document.getElementById('song-list');
    library.forEach((s, i) => {
        const d = document.createElement('div');
        d.className = `song-item ${i === 0 ? 'active' : ''}`;
        d.innerHTML = `<span class="song-genre">${s.g}</span><div class="song-title">${s.t}</div>`;
        d.onclick = () => { document.querySelectorAll('.song-item').forEach(c => c.classList.remove('active')); d.classList.add('active'); selected = i; };
        listDiv.appendChild(d);
    });

    document.getElementById('start-btn').addEventListener('pointerdown', async () => {
        const btn = document.getElementById('start-btn');
        if (btn.innerText === "로딩 중...") return;
        btn.innerText = "로딩 중...";
        await Tone.start();
        if (!bgmSynth) {
            reverb = new Tone.Reverb(3).toDestination();
            bgmSynth = new Tone.PolySynth(Tone.Synth, { oscillator: { type: "sine" }, envelope: { attack: 0.8, release: 2 } }).connect(reverb);
            bgmSynth.volume.value = -12;
            melodySynth = new Tone.PolySynth(Tone.Synth, { oscillator: { type: "triangle" }, envelope: { attack: 0.01, decay: 0.4, sustain: 0.1, release: 0.8 } }).connect(reverb);
            melodySynth.volume.value = 4;
        }
        startGame();
    });

    function spark(x, y, color) {
        const stage = document.getElementById('game');
        for(let i=0; i<12; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = x + 'px'; p.style.top = y + 'px';
            p.style.background = color;
            p.style.boxShadow = `0 0 10px ${color}`;
            p.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
            p.style.setProperty('--ty', (Math.random() - 0.5) * 200 + 'px');
            stage.appendChild(p);
            setTimeout(() => p.remove(), 600);
        }
    }

    function startGame() {
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('game').style.display = 'block';
        isPlaying = true; score = 0; lives = 3; nIdx = 0; tiles = [];
        document.getElementById('score').innerText = '0';
        document.getElementById('lives').innerText = "❤️❤️❤️";
        
        const data = library[selected];
        let cIdx = 0;
        bgmLoop = setInterval(() => {
            if(!isPlaying) return;
            bgmSynth.triggerAttackRelease(data.b[cIdx % data.b.length], "1n");
            cIdx++;
        }, 1000);

        gameLoop();
        spawnId = setInterval(createTile, 600 / (data.s / 8));
    }

    function createTile() {
        if (!isPlaying || score >= TARGET) return;
        const lane = Math.floor(Math.random() * 4);
        const t = document.createElement('div');
        t.className = 'tile';
        t.style.left = (lane * 25) + '%';
        t.style.top = '-160px';
        
        const note = library[selected].m[nIdx % library[selected].m.length];

        const onHit = (e) => {
            e.preventDefault();
            if (t.classList.contains('pressed')) return;
            melodySynth.triggerAttackRelease(note, "8n");
            
            // 시각 효과
            const rect = t.getBoundingClientRect();
            spark(rect.left + rect.width/2, rect.top + rect.height/2, Math.random() > 0.5 ? '#00e5ff' : '#ff00ea');
            const flash = document.getElementById(`flash-${lane}`);
            flash.style.opacity = '0.5';
            setTimeout(() => flash.style.opacity = '0', 100);

            t.classList.add('pressed');
            score++; document.getElementById('score').innerText = score;
            if(score >= TARGET) setTimeout(win, 800);
            setTimeout(() => t.remove(), 150);
        };

        t.addEventListener('pointerdown', onHit);
        document.getElementById('game').appendChild(t);
        tiles.push(t);
        nIdx++;
    }

    function gameLoop() {
        if (!isPlaying) return;
        const stage = document.getElementById('game');
        const h = stage.clientHeight;
        const speed = library[selected].s;

        for (let i = tiles.length - 1; i >= 0; i--) {
            const t = tiles[i];
            let top = parseFloat(t.style.top) + speed;
            t.style.top = top + 'px';

            if (top > h) {
                if(!t.classList.contains('pressed')) {
                    lives--;
                    document.getElementById('lives').innerText = "❤️".repeat(lives) + "🖤".repeat(3 - lives);
                    stage.style.boxShadow = "inset 0 0 50px rgba(255,0,0,0.5)";
                    setTimeout(() => stage.style.boxShadow = "none", 200);
                    if(lives <= 0) { gameOver(); return; }
                }
                t.remove(); tiles.splice(i, 1);
            }
        }
        loopId = requestAnimationFrame(gameLoop);
    }

    function gameOver() {
        isPlaying = false; clearInterval(spawnId); clearInterval(bgmLoop); cancelAnimationFrame(loopId);
        alert(`공연 종료\n최종 점수: ${score}`);
        location.reload();
    }

    function win() {
        isPlaying = false; clearInterval(spawnId); clearInterval(bgmLoop); cancelAnimationFrame(loopId);
        alert(`✨ 완벽한 연주였습니다! ✨\n100점 달성 성공!`);
        location.reload();
    }
</script>
</body>
</html>
