<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Magic Piano: Crystal Concert</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root { --neon: #00f2ff; --pink: #ff00ea; --bg: #05050a; }
        * { box-sizing: border-box; user-select: none; font-family: 'Pretendard', sans-serif; touch-action: none; }
        
        body { margin: 0; color: #fff; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; background: #000; }

        #lobby { display: flex; flex-direction: column; height: 100%; width: 100%; max-width: 500px; margin: 0 auto; background: rgba(0,0,0,0.9); backdrop-filter: blur(20px); z-index: 20; position: relative; }
        
        header { padding: 30px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        header h1 { margin: 0; font-size: 32px; font-weight: 900; background: linear-gradient(90deg, var(--neon), var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        header p { margin: 8px 0 0; font-size: 13px; color: #aaa; }
        
        .content { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        
        .upload-section { text-align: center; padding: 30px 20px; background: rgba(255,255,255,0.05); border-radius: 15px; border: 1px dashed var(--neon); }
        .upload-btn { display: inline-block; padding: 15px 25px; background: linear-gradient(45deg, rgba(0,242,255,0.3), rgba(255,0,234,0.3)); border: 1px solid #fff; color: #fff; border-radius: 10px; font-weight: bold; cursor: pointer; }
        #file-name { margin-top: 15px; font-size: 14px; color: var(--neon); }

        .diff-grid { display: flex; gap: 10px; margin-top: 10px; }
        .diff-btn { flex: 1; padding: 15px 0; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; color: #fff; cursor: pointer; }
        .diff-btn.active { background: var(--pink); border-color: #fff; font-weight: bold; }

        .footer { padding: 25px; background: #000; }
        #start-btn { width: 100%; padding: 20px; background: #333; color: #888; font-size: 20px; font-weight: 900; border: none; border-radius: 50px; cursor: pointer; pointer-events: none; transition: 0.5s; }
        #start-btn.ready { background: linear-gradient(45deg, var(--neon), var(--pink)); color: #fff; pointer-events: auto; box-shadow: 0 0 20px var(--pink); }

        #game { display: none; width: 100vw; max-width: 500px; height: 100%; margin: 0 auto; position: relative; overflow: hidden; background: radial-gradient(circle at center, #1a0033 0%, #050011 100%); }
        .lane-bg { position: absolute; width: 25%; height: 100%; border-right: 1px solid rgba(255,255,255,0.05); }
        #keys-container { position: absolute; bottom: 12%; width: 100%; height: 2px; background: rgba(255,255,255,0.3); z-index: 5; }
        
        .tile { 
            position: absolute; width: 23%; margin-left: 1%; height: 160px; border-radius: 5px; 
            background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(0,242,255,0.7) 100%);
            box-shadow: 0 0 15px rgba(0,242,255,0.5); z-index: 10;
        }
        .tile.pressed { transform: scale(1.2); opacity: 0; transition: 0.2s; background: #fff; box-shadow: 0 0 40px #fff; }

        #hud { position: absolute; top: 60px; width: 100%; text-align: center; z-index: 30; pointer-events: none; }
        #score { font-size: 70px; font-weight: 900; color: #fff; text-shadow: 0 0 20px var(--pink); }
    </style>
</head>
<body>

<div id="lobby">
    <header>
        <h1>Crystal Piano</h1>
        <p>아름다운 피아노 선율을 직접 연주하세요</p>
    </header>
    
    <div class="content">
        <div class="upload-section">
            <label class="upload-btn" for="audio-upload">🎹 반주(MP3) 선택하기</label>
            <input type="file" id="audio-upload" accept="audio/*" style="display:none;">
            <p id="file-name">음악 파일을 선택해주세요.</p>
        </div>

        <div>
            <p style="font-size:14px; color:#aaa; margin-bottom:10px;">난이도(속도)</p>
            <div class="diff-grid">
                <button class="diff-btn active" data-speed="5" data-spawn="900">Easy</button>
                <button class="diff-btn" data-speed="8" data-spawn="600">Normal</button>
                <button class="diff-btn" data-speed="13" data-spawn="350">Hard</button>
            </div>
        </div>
    </div>

    <div class="footer">
        <button id="start-btn">PIANO LOADING...</button>
    </div>
</div>

<div id="game">
    <div id="hud"><div id="score">0</div></div>
    <div class="lane-bg" style="left:0%"></div><div class="lane-bg" style="left:25%"></div><div class="lane-bg" style="left:50%"></div><div class="lane-bg" style="left:75%; border:none;"></div>
    <div id="keys-container"></div>
</div>

<script>
    let pianoSampler, bgmPlayer, isPlaying = false, score = 0, lives = 6, tiles = [], loopId, spawnId;
    let currentSpeed = 5, currentSpawnRate = 900;

    // 1. 고음질 피아노 샘플러 로드 (실제 피아노 소리)
    pianoSampler = new Tone.Sampler({
        urls: {
            A0: "A0.mp3", C1: "C1.mp3", "D#1": "Ds1.mp3", "F#1": "Fs1.mp3",
            A1: "A1.mp3", C2: "C2.mp3", "D#2": "Ds2.mp3", "F#2": "Fs2.mp3",
            A2: "A2.mp3", C3: "C3.mp3", "D#3": "Ds3.mp3", "F#3": "Fs3.mp3",
            A3: "A3.mp3", C4: "C4.mp3", "D#4": "Ds4.mp3", "F#4": "Fs4.mp3",
            A4: "A4.mp3", C5: "C5.mp3", "D#5": "Ds5.mp3", "F#5": "Fs5.mp3",
            A5: "A5.mp3", C6: "C6.mp3", "D#6": "Ds6.mp3", "F#6": "Fs6.mp3",
            A6: "A6.mp3", C7: "C7.mp3", "D#7": "Ds7.mp3", "F#7": "Fs7.mp3",
            A7: "A7.mp3", C8: "C8.mp3"
        },
        release: 1,
        baseUrl: "https://tonejs.github.io/audio/salamander/",
        onload: () => {
            const startBtn = document.getElementById('start-btn');
            if(startBtn.innerText === "PIANO LOADING...") {
                startBtn.innerText = "곡을 선택해주세요";
            }
        }
    }).toDestination();

    // 난이도 선택
    document.querySelectorAll('.diff-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            currentSpeed = parseInt(e.target.getAttribute('data-speed'));
            currentSpawnRate = parseInt(e.target.getAttribute('data-spawn'));
        });
    });

    // 파일 업로드
    document.getElementById('audio-upload').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        document.getElementById('file-name').innerText = file.name;
        const url = URL.createObjectURL(file);
        
        if(bgmPlayer) bgmPlayer.dispose();
        bgmPlayer = new Tone.Player({
            url: url,
            onload: () => {
                const startBtn = document.getElementById('start-btn');
                startBtn.innerText = "PLAY START";
                startBtn.classList.add('ready');
            }
        }).toDestination();
    });

    document.getElementById('start-btn').addEventListener('click', async () => {
        await Tone.start();
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('game').style.display = 'block';
        isPlaying = true;
        bgmPlayer.start();
        gameLoop();
        spawnId = setInterval(createTile, currentSpawnRate);
    });

    // 연주할 피아노 음계 (펜타토닉 스케일 - 어떤 곡에도 비교적 잘 어울림)
    const notes = ["C4", "D4", "E4", "G4", "A4", "C5", "D5", "E5", "G5", "A5"];

    function createTile() {
        if (!isPlaying) return;
        const lane = Math.floor(Math.random() * 4);
        const t = document.createElement('div');
        t.className = 'tile';
        t.style.left = (lane * 25) + '%';
        t.style.top = '-160px';
        
        const onHit = (e) => {
            e.preventDefault();
            if (t.classList.contains('pressed')) return;
            
            const rect = t.getBoundingClientRect();
            const hitLine = window.innerHeight * 0.88;
            if (rect.bottom < hitLine - 150) return; // 너무 위에서 누르면 무시

            // 피아노 소리 연주!
            const randomNote = notes[Math.floor(Math.random() * notes.length)];
            pianoSampler.triggerAttackRelease(randomNote, "4n");

            t.classList.add('pressed');
            score++;
            document.getElementById('score').innerText = score;
            
            setTimeout(() => {
                t.remove();
                tiles = tiles.filter(item => item !== t);
            }, 200);
        };

        t.addEventListener('pointerdown', onHit);
        document.getElementById('game').appendChild(t);
        tiles.push(t);
    }

    function gameLoop() {
        if (!isPlaying) return;
        const h = window.innerHeight;
        for (let i = tiles.length - 1; i >= 0; i--) {
            const t = tiles[i];
            let top = parseFloat(t.style.top) + currentSpeed;
            t.style.top = top + 'px';
            if (top > h) {
                t.remove();
                tiles.splice(i, 1);
            }
        }
        loopId = requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
