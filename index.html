<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Piano Master: Full Archive</title>
    <style>
        :root { --neon: #00f2ff; --pink: #ff007b; --bg: #050508; --card: #121216; }
        * { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; box-sizing: border-box; touch-action: none; }
        
        body { 
            margin: 0; background: var(--bg); color: #fff; font-family: 'Pretendard', sans-serif;
            height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* 1. 홈 화면 및 스크롤 영역 */
        #home { display: flex; flex-direction: column; height: 100%; width: 100%; max-width: 500px; margin: 0 auto; position: relative; }
        header { padding: 30px 20px 10px; text-align: center; flex-shrink: 0; }
        header h1 { font-size: 26px; letter-spacing: 5px; color: var(--neon); text-shadow: 0 0 10px var(--neon); margin: 0; }

        #list-container { 
            flex: 1; overflow-y: auto; padding: 10px 20px 120px; 
            -webkit-overflow-scrolling: touch; 
        }
        .song-item { 
            background: var(--card); margin-bottom: 12px; padding: 22px; 
            border-radius: 15px; border: 2px solid #222; display: flex; justify-content: space-between; align-items: center;
        }
        .song-item.selected { border-color: var(--neon); background: rgba(0, 242, 255, 0.1); }
        .song-item h3 { margin: 0; font-size: 17px; }
        .tag { font-size: 10px; padding: 2px 6px; background: #333; border-radius: 4px; margin-bottom: 5px; display: inline-block; color: var(--neon); }

        .footer { position: absolute; bottom: 0; width: 100%; padding: 20px; background: linear-gradient(to top, var(--bg) 80%, transparent); }
        #start-btn { 
            width: 100%; padding: 20px; background: var(--neon); color: #000; 
            border: none; border-radius: 50px; font-size: 20px; font-weight: bold; cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 242, 255, 0.4);
        }

        /* 2. 게임 스테이지 */
        #stage { display: none; width: 100vw; max-width: 500px; height: 100%; background: #000; position: relative; margin: 0 auto; }
        .tile { 
            width: 25%; position: absolute; border-radius: 6px; border: 2.5px solid var(--neon);
            background: linear-gradient(135deg, #222, #000); box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
        }
        .tile.pressed { background: var(--pink) !important; opacity: 0; transform: scale(1.1); transition: 0.15s; }
        
        #hud { position: absolute; top: 40px; width: 100%; display: flex; flex-direction: column; align-items: center; pointer-events: none; z-index: 10; }
        #score { font-size: 45px; font-weight: 900; opacity: 0.3; }
        #hearts { font-size: 20px; color: var(--pink); letter-spacing: 3px; }
    </style>
</head>
<body>

<div id="home">
    <header>
        <h1>PIANO ARCHIVE</h1>
        <p style="font-size: 13px; color: #555; margin-top: 5px;">풀 멜로디 완주에 도전하세요</p>
    </header>
    <div id="list-container"></div>
    <div class="footer">
        <button id="start-btn" onclick="startGame()">CONCERT START</button>
    </div>
</div>

<div id="stage">
    <div id="hud">
        <div id="score">0</div>
        <div id="hearts">❤️❤️❤️</div>
    </div>
</div>

<script>
    // 대량의 악보 데이터 (주파수 배열)
    const playlist = [
        { t: "엘리제를 위하여 (Full)", s: 6.5, n: [659,622,659,622,659,493,587,523,440,261,330,440,493,330,415,493,523, 659,622,659,622,659,493,587,523,440,261,330,523,493,440, 392,440,493,523,587,659,349,392,440,493,523,587,659,698,783] },
        { t: "라흐마니노프 협주곡 2번", s: 10, n: [261,311,392,523,493,392,311,261,233,261,311,392,622,587,523,493,523,392,311,261,196,261,311,392,783,739,659,587,523,493,523,392,311,261,233,261,311,392,523,493,392,311,261] },
        { t: "쇼팽 - 즉흥 환상곡", s: 13, n: [698,659,698,783,698,659,698,880,783,698,659,698,783,698,659,698,1046,987,880,783,698,659,698,783,698,659,698,880,783,698,659,698] },
        { t: "NewJeans - Ditto (풀)", s: 7.5, n: [523,659,783,1046,783,659,523,440,392,349,392,440,392,349,329,261,261,293,329,349,392,440,392,349,329,293,261,523,659,783,1046] },
        { t: "BTS - Dynamite (풀)", s: 8.5, n: [392,392,392,392,330,294,262,330,392,440,392,392,392,392,330,294,262,262,330,349,392,392,392,392,440,392,330,294,262,392,392,392,392,330,294,262,330,392,440] },
        { t: "Coldplay - Viva La Vida", s: 7, n: [659,587,523,493,440,392,440,523,587,659,587,523,493,440,392,440,523,587,659,587,523,493,440,392,329,293,261,293,329,349,392,440] }
    ];

    let current = playlist[0];
    let audioCtx, isPlaying = false, score = 0, lives = 3, nIdx = 0, spawnIdx = 0;
    let tiles = [], loopId, spawnId, h;

    // UI 생성
    const list = document.getElementById('list-container');
    playlist.forEach((song, i) => {
        const card = document.createElement('div');
        card.className = `song-item ${i === 0 ? 'selected' : ''}`;
        card.innerHTML = `<div><span class="tag">MASTERPIECE</span><h3>${song.t}</h3></div><div style="color:var(--neon)">♬</div>`;
        card.onclick = () => {
            document.querySelectorAll('.song-item').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            current = song;
        };
        list.appendChild(card);
    });

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    // 맑은 피아노 사운드
    function playPiano(f) {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, now);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 1.2);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(); osc.stop(now + 1.2);
    }

    function createTile() {
        if (!isPlaying || spawnIdx >= current.n.length) {
            clearInterval(spawnId);
            return;
        }
        const lane = Math.floor(Math.random() * 4);
        const t = document.createElement('div');
        t.className = 'tile';
        t.style.left = (lane * 25) + '%';
        t.style.top = '-200px';
        t.style.height = '160px';
        t.dataset.noteIdx = spawnIdx;

        const onHit = (e) => {
            e.preventDefault();
            if (t.classList.contains('pressed')) return;
            playPiano(current.n[parseInt(t.dataset.noteIdx)]);
            score++;
            document.getElementById('score').innerText = score;
            t.classList.add('pressed');
            if (score === current.n.length) setTimeout(win, 800);
        };
        t.addEventListener('pointerdown', onHit);
        document.getElementById('stage').appendChild(t);
        tiles.push(t);
        spawnIdx++;
    }

    function gameLoop() {
        if (!isPlaying) return;
        h = document.getElementById('stage').clientHeight;

        for (let i = tiles.length - 1; i >= 0; i--) {
            const t = tiles[i];
            let top = parseFloat(t.style.top) + current.s;
            t.style.top = top + 'px';

            if (top > h - 50 && !t.classList.contains('pressed')) {
                lives--;
                updateHearts();
                t.remove();
                tiles.splice(i, 1);
                if (lives <= 0) { fail(); return; }
                continue;
            }
            if (top > h) { t.remove(); tiles.splice(i, 1); }
        }
        loopId = requestAnimationFrame(gameLoop);
    }

    function updateHearts() {
        document.getElementById('hearts').innerText = "❤️".repeat(lives) + "🖤".repeat(3 - lives);
    }

    function startGame() {
        initAudio();
        document.getElementById('home').style.display = 'none';
        document.getElementById('stage').style.display = 'block';
        isPlaying = true; score = 0; lives = 3; spawnIdx = 0; tiles = [];
        updateHearts();
        document.getElementById('score').innerText = '0';
        gameLoop();
        spawnId = setInterval(createTile, 600 / (current.s / 8));
    }

    function win() {
        isPlaying = false;
        clearInterval(spawnId);
        cancelAnimationFrame(loopId);
        alert(`✨ 완주 대성공! ✨\n콘서트가 성공적으로 마무리되었습니다.\n최종 점수: ${score}`);
        location.reload();
    }

    function fail() {
        isPlaying = false;
        clearInterval(spawnId);
        cancelAnimationFrame(loopId);
        alert(`공연 중단\n조금 더 연습이 필요할 것 같아요!\n최종 점수: ${score}`);
        location.reload();
    }
</script>
</body>
</html>
