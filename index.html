<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Piano Tiles 12 Songs</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root { --neon: #00f2ff; --pink: #ff00ea; --gold: #ffea00; --bg: #050508; }
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        /* GPT 피드백: 모바일 터치 락업 방지 */
        body { color: #fff; height: 100dvh; overflow: hidden; background: var(--bg); touch-action: manipulation; }

        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; max-width: 500px; left: 50%; transform: translateX(-50%); display: none; flex-direction: column; background: var(--bg); }
        
        /* 로비 화면 */
        #lobby { display: flex; z-index: 100; padding: 20px; }
        h1 { text-align: center; font-size: 32px; font-weight: 900; background: linear-gradient(90deg, var(--neon), var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; padding: 10px 0; }
        p.desc { text-align: center; color: #888; font-size: 13px; margin-bottom: 15px; }
        
        /* 12곡 리스트 */
        #song-list { flex: 1; overflow-y: auto; background: rgba(255,255,255,0.02); border-radius: 10px; padding: 10px; }
        .song-item { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
        .song-item.active { background: rgba(0, 242, 255, 0.15); border-left: 4px solid var(--neon); }
        .song-title { font-size: 16px; font-weight: bold; }
        .song-artist { font-size: 12px; color: #aaa; margin-top: 4px; }
        
        /* 난이도 & 시작 버튼 */
        .bottom-panel { padding-top: 15px; }
        .diff-grid { display: flex; gap: 10px; margin-bottom: 15px; }
        .diff-btn { flex: 1; padding: 12px 0; background: #111; border: 1px solid #333; border-radius: 8px; color: #aaa; font-weight: bold; cursor: pointer; }
        .diff-btn.active { background: var(--pink); color: #fff; border-color: #fff; }
        
        #start-btn { width: 100%; padding: 18px; border-radius: 50px; border: none; font-size: 18px; font-weight: bold; background: #333; color: #777; transition: 0.3s; pointer-events: none; }
        #start-btn.ready { background: linear-gradient(45deg, var(--neon), var(--pink)); color: #fff; pointer-events: auto; box-shadow: 0 5px 20px rgba(255, 0, 234, 0.4); }

        /* 게임 화면 */
        #game { overflow: hidden; z-index: 50; }
        .lane-bg { position: absolute; top: 0; width: 25%; height: 100%; border-right: 1px dashed rgba(255,255,255,0.1); }
        
        /* UI */
        #game-ui { position: absolute; top: 0; width: 100%; padding: 20px; z-index: 60; display: flex; justify-content: space-between; pointer-events: none; }
        #score { font-size: 36px; font-weight: 900; text-shadow: 0 0 10px var(--neon); }
        #combo { font-size: 18px; color: var(--gold); font-weight: bold; }
        .hp-bar-bg { width: 120px; height: 10px; background: #333; border-radius: 5px; overflow: hidden; margin-top: 10px; }
        #hp-bar { width: 100%; height: 100%; background: #00ff00; transition: width 0.2s; }
        #playing-title { position: absolute; top: 60px; width: 100%; text-align: center; color: #fff; opacity: 0.5; font-size: 14px; }

        /* 판정 이펙트 */
        #judgment { position: absolute; top: 40%; width: 100%; text-align: center; font-size: 40px; font-weight: 900; z-index: 70; opacity: 0; transition: 0.1s; pointer-events: none; }
        #hit-line { position: absolute; bottom: 15%; width: 100%; height: 3px; background: rgba(255,255,255,0.8); z-index: 5; box-shadow: 0 0 15px #fff; }

        /* 건반 (일반 & 롱노트) */
        .tile { position: absolute; width: 24%; margin-left: 0.5%; border-radius: 5px; background: linear-gradient(to bottom, #fff, var(--neon)); z-index: 10; cursor: pointer; }
        .tile.long { background: linear-gradient(to bottom, #fff, var(--gold)); box-shadow: 0 0 15px var(--gold); }
        .tile.pressed { opacity: 0.4; filter: brightness(2); transform: scale(0.95); transition: 0.1s; }
        .tile.missed { background: #ff0055; opacity: 0.5; }

        /* 결과 화면 */
        #result { justify-content: center; align-items: center; text-align: center; z-index: 200; background: rgba(0,0,0,0.9); }
        #rank { font-size: 80px; font-weight: 900; text-shadow: 0 0 30px var(--gold); margin: 20px 0; }
        .res-text { font-size: 20px; margin: 10px 0; }
        #restart-btn { margin-top: 30px; padding: 15px 40px; border-radius: 30px; font-size: 18px; font-weight: bold; background: #fff; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div id="lobby" class="screen" style="display: flex;">
    <h1>PIANO TILES 12</h1>
    <p class="desc">원하는 곡을 선택하세요 (플레이 타임: 1분 30초)</p>
    
    <div id="song-list"></div>

    <div class="bottom-panel">
        <div class="diff-grid">
            <button class="diff-btn active" data-speed="1.8">Easy</button>
            <button class="diff-btn" data-speed="1.2">Normal</button>
            <button class="diff-btn" data-speed="0.8">Hard</button>
        </div>
        <button id="start-btn">피아노 로딩중...</button>
    </div>
</div>

<div id="game" class="screen">
    <div id="game-ui">
        <div>
            <div id="score">0</div>
            <div id="combo"></div>
        </div>
        <div class="hp-bar-bg"><div id="hp-bar"></div></div>
    </div>
    <div id="playing-title"></div>
    <div id="judgment"></div>
    <div id="hit-line"></div>
    <div class="lane-bg" style="left:0%"></div><div class="lane-bg" style="left:25%"></div><div class="lane-bg" style="left:50%"></div><div class="lane-bg" style="left:75%; border:none;"></div>
</div>

<div id="result" class="screen">
    <h2 style="color: var(--neon);">STAGE CLEAR!</h2>
    <div id="rank">S</div>
    <div class="res-text" id="final-score">Score: 0</div>
    <div class="res-text" id="max-combo">Max Combo: 0</div>
    <button id="restart-btn" onclick="location.reload()">로비로 돌아가기</button>
</div>

<script>
    // 🎵 12곡의 실제 메인 멜로디 (음표:길이 비율)
    const songs = [
        { t: "겨울바람", a: "쇼팽", m: "A5:0.2, G#5:0.2, A5:0.2, F5:0.2, E5:0.2, D#5:0.2, E5:0.2, C5:0.2, B4:0.2, A#4:0.2, B4:0.2, G4:0.2, F4:0.2, E4:0.2, F4:0.2, D4:0.2" },
        { t: "Take On Me", a: "a-ha", m: "B4:0.2, B4:0.2, E5:0.3, C#5:0.3, C#5:0.2, G#4:0.6, G#4:0.2, C#5:0.3, C#5:0.2, C#5:0.6, E5:0.2, E5:0.2, E5:0.2, B4:0.6" },
        { t: "Seasons of Love", a: "Rent OST", m: "F4:0.4, A4:0.4, C5:0.4, D5:0.4, C5:0.8, Bb4:0.4, A4:0.4, G4:0.4, F4:0.8" },
        { t: "Rush", a: "리쌍", m: "E4:0.3, G4:0.3, B4:0.3, A4:0.6, G4:0.3, F#4:0.3, E4:0.8" },
        { t: "캐논 변주곡", a: "파헬벨", m: "F#5:0.4, E5:0.4, D5:0.4, C#5:0.4, B4:0.4, A4:0.4, B4:0.4, C#5:0.4" },
        { t: "말할 수 없는 비밀", a: "주걸륜", m: "C5:0.2, G4:0.2, E4:0.2, G4:0.2, C5:0.2, G4:0.2, E4:0.2, G4:0.2, D5:0.2, G4:0.2, F4:0.2, G4:0.2, D5:0.2, G4:0.2, F4:0.2, G4:0.2" },
        { t: "할아버지의 11개월", a: "Kuricorder", m: "G4:0.2, D5:0.2, B4:0.2, G4:0.2, A4:0.2, E5:0.2, C5:0.2, A4:0.2, B4:0.2, G5:0.2, D5:0.2, B4:0.2, C5:0.2, A5:0.2, F#5:0.2, D5:0.2" },
        { t: "Summer", a: "히사이시 조", m: "D4:0.3, E4:0.3, F#4:0.3, A4:0.3, D5:0.8, C#5:0.4, B4:0.4, A4:0.8" },
        { t: "베토벤 바이러스", a: "베토벤", m: "G4:0.3, C5:0.3, D5:0.3, Eb5:0.3, D5:0.3, C5:0.3, B4:0.3, C5:0.3, G4:0.8" },
        { t: "인생의 회전목마", a: "하울의 움직이는 성", m: "D4:0.3, G4:0.3, Bb4:0.3, D5:0.8, C5:0.3, Bb4:0.3, A4:0.3, Bb4:0.3, G4:0.8" },
        { t: "River Flows in You", a: "이루마", m: "A4:0.3, C#5:0.3, E5:0.3, A5:0.6, G#5:0.3, A5:0.3, E5:0.3, A4:0.3, D5:0.8" },
        { t: "Dying Young", a: "Kenny G", m: "G4:0.4, Bb4:0.4, Eb5:0.4, F5:0.4, G5:0.8, F5:0.4, Eb5:0.4, D5:0.4, Eb5:0.8" }
    ];

    let piano, sheetMusic = [], tiles = [];
    let isPlaying = false, score = 0, combo = 0, maxCombo = 0, hp = 100;
    let loopId, sheetIdx = 0, selectedSong = 0;
    let lookaheadTime = 1.8; // 난이도에 따른 낙하 속도
    let hitLineY;

    // 🌟 로딩 속도 1초 컷 최적화 (음원 파일 딱 4개만 불러와서 전체 건반 자동 생성)
    piano = new Tone.Sampler({
        urls: { "C4": "C4.mp3", "D#4": "Ds4.mp3", "F#4": "Fs4.mp3", "A4": "A4.mp3" },
        baseUrl: "https://tonejs.github.io/audio/salamander/",
        release: 1,
        onload: () => {
            const btn = document.getElementById('start-btn');
            btn.innerText = "게임 시작";
            btn.classList.add('ready');
        }
    }).toDestination();
    piano.volume.value = 5;

    // UI 리스트 생성
    const listDiv = document.getElementById('song-list');
    songs.forEach((s, i) => {
        const item = document.createElement('div');
        item.className = `song-item ${i === 0 ? 'active' : ''}`;
        item.innerHTML = `<div><div class="song-title">${s.t}</div><div class="song-artist">${s.a}</div></div>`;
        item.onclick = () => {
            document.querySelectorAll('.song-item').forEach(el => el.classList.remove('active'));
            item.classList.add('active');
            selectedSong = i;
        };
        listDiv.appendChild(item);
    });

    // 난이도 버튼
    document.querySelectorAll('.diff-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            lookaheadTime = parseFloat(e.target.getAttribute('data-speed')); // 숫자가 작을수록 빨리 떨어짐
        });
    });

    // 🎵 1분 30초 분량의 풀 악보 생성기 (패턴을 90초 동안 반복 전개)
    function build90SecondSheet(songData) {
        const motif = songData.m.split(',').map(s => {
            const parts = s.trim().split(':');
            return { note: parts[0], dur: parseFloat(parts[1]) };
        });

        const fullSheet = [];
        let time = 1.0; 
        let lane = 0;

        // 90초(1분 30초) 동안 건반 생성
        while (time < 90) {
            for (let i = 0; i < motif.length; i++) {
                if (time >= 90) break;
                
                // 후반부로 갈수록(45초 이후) 속도가 10% 빨라지며 긴장감 상승!
                let speedMult = time > 45 ? 0.9 : 1.0; 
                let noteDur = motif[i].dur * speedMult;

                // 다음 건반이 같은 줄에 겹치지 않게 분산
                lane = (lane + Math.floor(Math.random() * 3) + 1) % 4;

                fullSheet.push({ time: time, lane: lane, note: motif[i].note, duration: noteDur });
                time += noteDur; 
            }
        }
        return fullSheet;
    }

    // 시작 버튼 (GPT 피드백: pointerdown 이벤트로 모바일 사운드 활성화)
    document.getElementById('start-btn').addEventListener('pointerdown', async () => {
        if(!document.getElementById('start-btn').classList.contains('ready')) return;
        await Tone.start();
        
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('game').style.display = 'block';
        document.getElementById('playing-title').innerText = `${songs[selectedSong].t} - ${songs[selectedSong].a}`;
        
        hitLineY = window.innerHeight * 0.85; // 판정선
        
        // 상태 초기화
        sheetMusic = build90SecondSheet(songs[selectedSong]);
        sheetIdx = 0; score = 0; combo = 0; maxCombo = 0; hp = 100;
        tiles.forEach(t => t.el.remove()); tiles = [];
        isPlaying = true;
        
        updateUI();
        Tone.Transport.stop(); Tone.Transport.position = 0; Tone.Transport.start();
        requestAnimationFrame(gameLoop);
    });

    function showJudgment(text, color) {
        const el = document.getElementById('judgment');
        el.innerText = text; el.style.color = color; el.style.opacity = 1;
        el.style.transform = "scale(1.2)";
        setTimeout(() => { el.style.opacity = 0; el.style.transform = "scale(1)"; }, 300);
    }

    function updateUI() {
        document.getElementById('score').innerText = score;
        document.getElementById('combo').innerText = combo > 2 ? `${combo} COMBO` : "";
        const hpBar = document.getElementById('hp-bar');
        hpBar.style.width = `${hp}%`;
        hpBar.style.background = hp > 60 ? "#00ff00" : (hp > 30 ? "#ffea00" : "#ff0055");
    }

    function spawnTile(data) {
        const el = document.createElement('div');
        const isLong = data.duration > 0.4; // 0.4초보다 길면 롱노트 처리
        
        el.className = `tile ${isLong ? 'long' : ''}`;
        el.style.left = (data.lane * 25) + '%';
        
        // 🌟 완벽한 싱크 거리 계산식
        const speedPxPerSec = hitLineY / lookaheadTime;
        const visualHeight = Math.max(100, data.duration * speedPxPerSec);
        el.style.height = visualHeight + 'px';
        
        const tileObj = { el: el, data: data, hit: false, missed: false, height: visualHeight };

        el.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (tileObj.hit || tileObj.missed) return;
            
            const rect = el.getBoundingClientRect();
            // 타일 맨 아래쪽 라인 기준 판정
            const distance = Math.abs(rect.bottom - hitLineY);

            if (distance < 150) { 
                piano.triggerAttackRelease(data.note, isLong ? "1n" : "4n");
                tileObj.hit = true;
                el.classList.add('pressed');
                
                combo++; if(combo > maxCombo) maxCombo = combo;

                if (distance < 50) {
                    score += isLong ? 30 : 20; // 롱노트는 점수 더 많이
                    hp = Math.min(100, hp + 2); 
                    showJudgment("PERFECT", "var(--neon)");
                } else {
                    score += 10;
                    showJudgment("GOOD", "#fff");
                }
                updateUI();
            }
        });

        document.getElementById('game').appendChild(el);
        tiles.push(tileObj);
    }

    function gameLoop() {
        if (!isPlaying) return;

        const currentTime = Tone.Transport.seconds;
        const speedPxPerSec = hitLineY / lookaheadTime;

        // 시간에 맞춰 타일 꺼내기
        while (sheetIdx < sheetMusic.length && sheetMusic[sheetIdx].time < currentTime + lookaheadTime) {
            spawnTile(sheetMusic[sheetIdx]);
            sheetIdx++;
        }

        // 타일 하강 및 놓침 판정
        for (let i = tiles.length - 1; i >= 0; i--) {
            const tile = tiles[i];
            const timeDiff = tile.data.time - currentTime;
            
            // 싱크 절대 안 밀리는 타일 하강 공식
            const bottomY = hitLineY - (timeDiff * speedPxPerSec);
            tile.el.style.top = (bottomY - tile.height) + 'px';

            // 놓침 (판정선을 완전히 지나감)
            if (timeDiff < -0.2 && !tile.hit && !tile.missed) {
                tile.missed = true;
                tile.el.classList.add('missed');
                combo = 0; hp -= 15;
                showJudgment("MISS", "#ff0055");
                updateUI();
                
                if (hp <= 0) {
                    gameOver(false); return;
                }
            }

            // 화면 밖 삭제
            if (bottomY - tile.height > window.innerHeight + 100) {
                tile.el.remove();
                tiles.splice(i, 1);
            }
        }

        if (sheetIdx >= sheetMusic.length && tiles.length === 0) {
            gameOver(true); return;
        }

        loopId = requestAnimationFrame(gameLoop);
    }

    function gameOver(isClear) {
        isPlaying = false;
        Tone.Transport.stop(); cancelAnimationFrame(loopId);
        document.getElementById('game').style.display = 'none';
        document.getElementById('result').style.display = 'flex';
        
        document.getElementById('final-score').innerText = `Score: ${score}`;
        document.getElementById('max-combo').innerText = `Max Combo: ${maxCombo}`;
        
        const rankEl = document.getElementById('rank');
        if(!isClear) {
            rankEl.innerText = "FAIL"; rankEl.style.color = "#ff0055";
        } else {
            let rank = "C";
            if(score > sheetMusic.length * 16) rank = "SSS";
            else if(score > sheetMusic.length * 12) rank = "S";
            else if(score > sheetMusic.length * 8) rank = "A";
            rankEl.innerText = rank;
            rankEl.style.color = (rank === "SSS" || rank === "S") ? "var(--gold)" : "var(--neon)";
        }
    }
</script>
</body>
</html>
