<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Piano Tiles - V45 Canvas Master</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root { --pink: #ffb3e6; --neon: #00f2ff; }
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #000; height: 100dvh; overflow: hidden; touch-action: none; display: flex; justify-content: center; align-items: center; }
        
        /* 캔버스 기반으로 렉과 타일 뭉침 해결 */
        canvas { background: linear-gradient(180deg, #ffb3e6 0%, #e6ccff 100%); width: 100%; height: 100%; max-width: 500px; border-left: 1px solid rgba(255,255,255,0.3); border-right: 1px solid rgba(255,255,255,0.3); }

        .ui-layer { position: absolute; top: 0; left: 50%; width: 100%; height: 100%; max-width: 500px; transform: translateX(-50%); pointer-events: none; z-index: 10; display: flex; flex-direction: column; }
        #lobby { pointer-events: auto; background: rgba(0,0,0,0.7); display: flex; flex-direction: column; padding: 20px; color: #fff; height: 100%; }
        h1 { text-align: center; font-size: 24px; font-weight: 900; text-shadow: 0 0 10px var(--pink); padding: 20px 0; }
        #song-list { flex: 1; overflow-y: auto; background: rgba(255,255,255,0.1); border-radius: 20px; padding: 10px; margin-bottom: 20px; }
        .song-item { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); border-radius: 10px; margin-bottom: 5px; background: rgba(0,0,0,0.3); }
        .song-item.active { background: #fff; color: #ff66cc; font-weight: bold; }
        #start-btn { width: 100%; padding: 20px; border-radius: 50px; border: none; font-size: 20px; font-weight: 900; background: #fff; color: #ff66cc; cursor: pointer; pointer-events: auto; }
        
        #game-ui { display: none; padding: 20px; height: 100%; }
        #score { text-align: center; font-size: 60px; font-weight: 900; color: #fff; text-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #hearts { font-size: 24px; color: #fff; position: absolute; top: 20px; left: 20px; }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div class="ui-layer">
    <div id="lobby">
        <h1>CANVAS MAESTRO</h1>
        <div id="song-list"></div>
        <button id="start-btn">명곡 데이터 불러오는 중...</button>
    </div>
    <div id="game-ui">
        <div id="hearts">❤️❤️❤️❤️❤️❤️</div>
        <div id="score">0</div>
    </div>
</div>

<script>
    // 🎹 소희님을 위한 12곡 이상의 롱 플레이 악보 데이터
    const songs = [
        { t: "La Campanella", a: "Liszt", p: "D#6|D#4,D#6|A#4,D#6|B4,D#6|D#5,D#6|D#4,D#6|A#4,C#6|F#4,B5|D#4,A#5|F4,G#5|D#4,F#5|B3,E5|G#3,D#5|D#3" },
        { t: "Piano Concerto No.2", a: "Rachmaninoff", p: "F2|C3|F3|G#3|C4,F2|C3|F3|G#3|C4,G2|C3|G3|A#3|E4,G#2|C3|G#3|C4|F4,A#2|C3|A#3|C#4|G4" },
        { t: "River Flows in You", a: "Yiruma", p: "F#5|F#3,E5|A3,F#5|C#4,C#5|F#4,F#5|D3,E5|A3,F#5|D4,C#5|A4" },
        { t: "Moonlight Sonata", a: "Beethoven", p: "G#3|C#2,C#4|G#2,E4|C#3,G#3|C#2,C#4|G#2,E4|C#3" },
        { t: "Winter Wind", a: "Chopin", p: "A5|A3,G#5|C4,A5|E4,F5|A4,E5|C5,D#5|E5,E5|A5,C5|C6" },
        { t: "Still D.R.E.", a: "Dr. Dre", p: "E5|C4|E4|A4,E5|C4|E4|A4,E5|B3|E4|G#4,E5|B3|E4|G#4" },
        { t: "No Scrubs", a: "TLC", p: "G#4|C#3,F#4|F#2,E4|B2,F#4|F#2,G#4|C#3,G#4|C#3" },
        { t: "Honey", a: "L'Arc-en-Ciel", p: "E4|A2,F#4|D3,G#4|E3,A4|A2,B4|D3,A4|E3" },
        { t: "Lacrimosa", a: "Lacrimosa", p: "D4|D2,E4|A2,F4|D3,G4|B2,A4|D3,Bb4|G2,A4|F2" },
        { t: "Für Elise", a: "Beethoven", p: "E5|A2,D#5|E3,E5|A3,D#5|C4,E5|E4,B4|A2,D5|E3,C5|A3,A4|A2" },
        { t: "Take On Me", a: "a-ha", p: "F#5|Bm2,F#5|Bm3,D5|E2,B4|E3,B4|A2,E5|A3,E5|D2" },
        { t: "Purple Rain", a: "Prince", p: "Bb3|Eb3,F4|G3,G4|Bb3,F4|Eb4,Bb3|F3,F4|A3,G4|C4" }
    ];

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let piano, lives = 6, score = 0, speed = 4, isPlaying = false, selected = 0;
    let tiles = [];

    // 화면 크기에 맞춰 캔버스 해상도 조절
    function resize() {
        canvas.width = Math.min(window.innerWidth, 500);
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 🎧 소희님이 좋아하는 맑은 피아노 사운드 (V41 엔진 계승)
    const hall = new Tone.Reverb({ decay: 2.0, wet: 0.2 }).toDestination();
    piano = new Tone.Sampler({
        urls: { A0:"A0.mp3", C1:"C1.mp3", C4:"C4.mp3", C8:"C8.mp3" },
        release: 1.2,
        baseUrl: "https://tonejs.github.io/audio/salamander/",
        onload: () => { document.getElementById('start-btn').innerText = "콘서트 연주 시작"; }
    }).connect(hall);

    function renderSongList() {
        const list = document.getElementById('song-list');
        list.innerHTML = "";
        songs.forEach((s, i) => {
            const div = document.createElement('div');
            div.className = `song-item ${i === selected ? 'active' : ''}`;
            div.innerHTML = `<strong>${s.t}</strong><br><small>${s.a}</small>`;
            div.onclick = () => { selected = i; renderSongList(); };
            list.appendChild(div);
        });
    }
    renderSongList();

    document.getElementById('start-btn').onclick = async () => {
        await Tone.start();
        isPlaying = true;
        tiles = []; score = 0; lives = 6; speed = 4;
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('game-ui').style.display = 'block';
        
        // 초기 타일 5개 생성
        for(let i=0; i<5; i++) spawnTile(canvas.height - (i + 1) * (canvas.height/4));
        animate();
    };

    function spawnTile(yPos) {
        const songNotes = songs[selected].p.split(',');
        const noteIndex = Math.floor(Math.random() * songNotes.length);
        tiles.push({
            lane: Math.floor(Math.random() * 4),
            y: yPos || -canvas.height/4,
            h: canvas.height/4,
            note: songNotes[noteIndex].split('|'),
            hit: false
        });
    }

    function animate() {
        if(!isPlaying) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 레인 가이드 선 그리기
        ctx.strokeStyle = "rgba(255,255,255,0.2)";
        for(let i=1; i<4; i++) {
            ctx.beginPath();
            ctx.moveTo(i * canvas.width/4, 0);
            ctx.lineTo(i * canvas.width/4, canvas.height);
            ctx.stroke();
        }

        // 타일 이동 및 그리기
        for(let i = tiles.length - 1; i >= 0; i--) {
            const t = tiles[i];
            t.y += speed;

            ctx.fillStyle = t.hit ? "#ddd" : "#1a1a1a";
            ctx.fillRect(t.lane * canvas.width/4, t.y, canvas.width/4, t.h);
            ctx.strokeStyle = "#000";
            ctx.strokeRect(t.lane * canvas.width/4, t.y, canvas.width/4, t.h);

            // 바닥에 닿았을 때 실패 판정
            if(t.y > canvas.height && !t.hit) {
                tiles.splice(i, 1);
                lives--;
                document.getElementById('hearts').innerText = '❤️'.repeat(Math.max(0, lives));
                spawnTile(tiles[tiles.length-1].y - canvas.height/4);
                if(lives <= 0) isPlaying = false;
            } else if(t.y > canvas.height && t.hit) {
                tiles.splice(i, 1);
                spawnTile(tiles[tiles.length-1].y - canvas.height/4);
            }
        }

        speed += 0.0005;
        if(lives > 0) requestAnimationFrame(animate);
        else location.reload();
    }

    canvas.addEventListener('pointerdown', (e) => {
        if(!isPlaying) return;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const lane = Math.floor(x / (canvas.width / 4));

        // 가장 아래에 있는 타겟 타일 찾기
        let target = null;
        let lowestY = -Infinity;
        tiles.forEach(t => {
            if(!t.hit && t.y > lowestY) {
                lowestY = t.y;
                target = t;
            }
        });

        if(target && target.lane === lane && target.y + target.h > canvas.height * 0.5) {
            target.hit = true;
            score++;
            document.getElementById('score').innerText = score;
            piano.triggerAttackRelease(target.note, "2n");
        } else {
            lives--;
            document.getElementById('hearts').innerText = '❤️'.repeat(Math.max(0, lives));
            if(lives <= 0) isPlaying = false;
        }
    });
</script>
</body>
</html>
