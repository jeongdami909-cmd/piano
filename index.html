<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Piano Master: Concert Hall</title>
    <style>
        :root { --bg: #050505; --accent: #ff00de; --gold: #ffd700; }
        * { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
        body { 
            margin: 0; background: var(--bg); color: #fff; font-family: 'Pretendard', sans-serif;
            display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden;
        }
        
        /* 메뉴 UI */
        #menu { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .song-item { 
            width: 85%; max-width: 400px; padding: 20px; margin: 10px; background: #1a1a1a; 
            border-radius: 15px; border: 1px solid #333; cursor: pointer; transition: 0.2s;
        }
        .song-item:active { transform: scale(0.98); background: #252525; }
        .song-item.selected { border-color: var(--gold); box-shadow: 0 0 15px rgba(255,215,0,0.3); }
        .diff { font-size: 12px; font-weight: bold; margin-bottom: 5px; color: var(--gold); }
        .title { font-size: 18px; font-weight: bold; }

        /* 게임 화면 */
        #game-view { width: 100vw; max-width: 450px; height: 100vh; background: #000; position: relative; overflow: hidden; }
        .lane-line { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.05); }
        .tile { width: 25%; position: absolute; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); }
        .tile.hit { opacity: 0; transform: scale(1.1); transition: 0.1s; }
        
        #score { position: absolute; top: 60px; font-size: 70px; font-weight: 900; width: 100%; text-align: center; opacity: 0.3; pointer-events: none; z-index: 5; }
        #play-btn { margin-top: 30px; padding: 15px 80px; font-size: 22px; border-radius: 50px; border: none; background: var(--gold); color: #000; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="menu">
    <h1 style="color:var(--gold); font-size: 32px; letter-spacing: 2px;">CONCERT HALL</h1>
    <div id="song-list"></div>
    <button id="play-btn" onclick="startGame()">CONCERT START</button>
</div>

<div id="score">0</div>
<div id="game-view">
    <div class="lane-line" style="left: 25%;"></div>
    <div class="lane-line" style="left: 50%;"></div>
    <div class="lane-line" style="left: 75%;"></div>
</div>

<script>
    // 곡 데이터: 긴 멜로디와 반주 코드 데이터
    const songs = [
        { 
            id: 0, title: "쇼팽 - 야상곡 (Op.9 No.2)", diff: "EASY", speed: 4.5, color: "#a8e6cf",
            melody: [311, 466, 622, 587, 523, 466, 415, 392, 466, 311, 466, 622, 698, 783, 698, 622, 587, 523, 466],
            chords: [155, 233, 311] // Eb Major 베이스 반주
        },
        { 
            id: 1, title: "차이코프스키 - 백조의 호수", diff: "NORMAL", speed: 7, color: "#3498db",
            melody: [493, 587, 659, 783, 739, 659, 587, 493, 392, 493, 587, 659, 783, 739, 659, 587, 880, 783, 739, 659],
            chords: [196, 246, 293] // B Minor 베이스 반주
        },
        { 
            id: 2, title: "라흐마니노프 - 협주곡 2번", diff: "HARD", speed: 11, color: "#e74c3c",
            melody: [261, 311, 392, 523, 493, 392, 311, 261, 233, 261, 311, 392, 622, 587, 523, 493, 523, 392, 311, 261, 196, 261],
            chords: [130, 155, 196] // C Minor 웅장한 베이스 반주
        }
    ];

    let currentSong = songs[0];
    let isPlaying = false;
    let score = 0;
    let audioCtx;
    let melodyIdx = 0;
    let tiles = [];
    let gameLoopId;
    let spawnTimer;

    // 메뉴 생성
    const listDiv = document.getElementById('song-list');
    songs.forEach(s => {
        const item = document.createElement('div');
        item.className = `song-item ${s.id === 0 ? 'selected' : ''}`;
        item.innerHTML = `<div class="diff">${s.diff}</div><div class="title">${s.title}</div>`;
        item.onclick = () => {
            document.querySelectorAll('.song-item').forEach(el => el.classList.remove('selected'));
            item.classList.add('selected');
            currentSong = s;
        };
        listDiv.appendChild(item);
    });

    // 사운드 엔진 (반주 + 멜로디)
    function playMelody() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'triangle'; // 부드러운 피아노 느낌
        osc.frequency.value = currentSong.melody[melodyIdx % currentSong.melody.length];
        melodyIdx++;
        
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
        
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.6);
    }

    function playAccompaniment() {
        if (!isPlaying) return;
        // 일정한 간격으로 낮은 베이스 반주를 깔아줌
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = currentSong.chords[Math.floor(Math.random() * 3)];
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 1.5);
        
        setTimeout(playAccompaniment, 1000); // 1초마다 반주 반복
    }

    function createTile() {
        if (!isPlaying) return;
        const lane = Math.floor(Math.random() * 4);
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.style.left = (lane * 25) + '%';
        tile.style.top = '-200px';
        tile.style.height = '180px';
        tile.style.background = `linear-gradient(to bottom, ${currentSong.color}, #000)`;
        tile.style.boxShadow = `0 0 15px ${currentSong.color}55`;

        const hit = (e) => {
            e.preventDefault();
            if (tile.classList.contains('hit')) return;
            playMelody();
            score++;
            document.getElementById('score').innerText = score;
            tile.classList.add('hit');
            setTimeout(() => tile.remove(), 100);
        };

        tile.addEventListener('touchstart', hit);
        tile.addEventListener('mousedown', hit);
        document.getElementById('game-view').appendChild(tile);
        tiles.push(tile);
    }

    function gameLoop() {
        if (!isPlaying) return;
        tiles.forEach((t, i) => {
            let top = parseFloat(t.style.top) + currentSong.speed;
            t.style.top = top + 'px';
            if (top > window.innerHeight) {
                if (!t.classList.contains('hit')) gameOver();
                else { t.remove(); tiles.splice(i, 1); }
            }
        });
        gameLoopId = requestAnimationFrame(gameLoop);
    }

    function startGame() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        document.getElementById('menu').style.display = 'none';
        isPlaying = true; score = 0; melodyIdx = 0;
        document.getElementById('score').innerText = '0';
        
        gameLoop();
        spawnTimer = setInterval(createTile, 1000 / (currentSong.speed / 4));
        playAccompaniment(); // 반주 시작
    }

    function gameOver() {
        isPlaying = false;
        clearInterval(spawnTimer);
        cancelAnimationFrame(gameLoopId);
        alert(`연주 종료!\n최종 점수: ${score}`);
        location.reload();
    }
</script>
</body>
</html>
