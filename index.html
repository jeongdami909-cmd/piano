<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Magic Piano: Bug Fix Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root { --main: #00e5ff; --hit: #ff00ea; --lane: rgba(255,255,255,0.1); }
        /* 🔥 버그 수정 1: 전체 터치 잠금 해제 (스크롤 가능해짐) */
        * { box-sizing: border-box; user-select: none; font-family: 'Pretendard', sans-serif; }
        
        @keyframes bgScroll { 0% { background-position: 0% 0%; } 100% { background-position: 0% 100%; } }
        body { 
            margin: 0; color: #fff; height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
            background: linear-gradient(180deg, #0a001a 0%, #001133 50%, #000000 100%);
            background-size: 100% 200%; animation: bgScroll 15s linear infinite;
        }

        #lobby { 
            display: flex; flex-direction: column; height: 100%; width: 100%; max-width: 500px; 
            margin: 0 auto; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 20; position: relative;
        }
        
        header { flex: 0 0 auto; padding: 25px 20px 15px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        header h1 { margin: 0; font-size: 26px; font-weight: 900; background: linear-gradient(90deg, #00e5ff, #ff00ea); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        header p { margin: 8px 0 0; font-size: 13px; color: #aaa; }
        
        /* 곡 목록 영역 */
        #song-list { flex: 1 1 auto; overflow-y: auto; padding: 15px; -webkit-overflow-scrolling: touch; }
        .song-item { 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; 
            padding: 18px; margin-bottom: 12px; display: flex; flex-direction: column; cursor: pointer; transition: 0.2s;
        }
        .song-item.active { border-color: var(--main); background: rgba(0, 229, 255, 0.15); box-shadow: 0 0 15px rgba(0,229,255,0.2); transform: scale(1.02); }
        .song-genre { font-size: 11px; color: var(--main); font-weight: bold; margin-bottom: 5px; }
        .song-title { font-size: 16px; font-weight: bold; color: #fff; }

        .footer { flex: 0 0 auto; padding: 20px; background: rgba(0,0,0,0.9); border-top: 1px solid #333; }
        #start-btn { 
            width: 100%; padding: 18px; background: linear-gradient(90deg, #00e5ff, #ff00ea); color: #fff; 
            font-size: 20px; font-weight: 900; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 20px rgba(255,0,234,0.4); 
        }

        /* 🔥 버그 수정 2: 게임 화면 안에서만 터치 스크롤 방지 */
        #game { touch-action: none; display: none; width: 100vw; max-width: 500px; height: 100%; margin: 0 auto; position: relative; overflow: hidden; transition: background-color 0.1s; }
        .lane-bg { position: absolute; width: 25%; height: 100%; border-right: 1px solid var(--lane); background: linear-gradient(180deg, transparent, rgba(0,229,255,0.05)); }
        #hit-line { position: absolute; bottom: 15%; width: 100%; height: 4px; background: #fff; box-shadow: 0 0 15px var(--main), 0 0 30px var(--hit); z-index: 5; }
        
        .tile { 
            position: absolute; width: 25%; height: 150px; border-radius: 8px;
            background: linear-gradient(180deg, rgba(0,229,255,0.8) 0%, rgba(255,0,234,0.8) 100%);
            border: 2px solid rgba(255,255,255,0.5); border-bottom: 6px solid #fff;
            box-shadow: 0 0 20px rgba(255,0,234,0.5); z-index: 10;
        }
        .tile.hit { opacity: 0; transform: scale(1.2); transition: 0.1s ease-out; }

        .particle { position: absolute; width: 10px; height: 10px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px var(--hit); pointer-events: none; animation: explode 0.5s forwards; z-index: 20; }
        @keyframes explode { 0% { transform: scale(1) translate(0,0); opacity: 1; } 100% { transform: scale(0) translate(var(--tx), var(--ty)); opacity: 0; } }

        #hud { position: absolute; top: 30px; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 30; pointer-events: none; }
        #score { font-size: 50px; font-weight: 900; text-shadow: 0 0 10px #000, 0 0 20px var(--main); }
        #lives { font-size: 24px; color: var(--hit); letter-spacing: 5px; margin-top: 5px; text-shadow: 0 0 10px rgba(255,0,234,0.5); }
    </style>
</head>
<body>

<div id="lobby">
    <header>
        <h1>MAGIC TILES V6</h1>
        <p>버그 완벽 수정본! 끝까지 스크롤하세요.</p>
    </header>
    <div id="song-list"></div>
    <div class="footer">
        <button id="start-btn">PLAY NOW</button>
    </div>
</div>

<div id="game">
    <div id="hud">
        <div id="score">0</div>
        <div id="lives">❤️❤️❤️</div>
    </div>
    <div class="lane-bg" style="left:0%"></div>
    <div class="lane-bg" style="left:25%"></div>
    <div class="lane-bg" style="left:50%"></div>
    <div class="lane-bg" style="left:75%; border:none;"></div>
    <div id="hit-line"></div>
</div>

<script>
    const library = [
        { g: "EDM / POP", t: "Alan Walker - Faded", s: 8, b: ["F#3", "D3", "A3", "E3"], m: ["F#5", "F#5", "F#5", "E5", "D5", "D5", "D5", "C#5", "A4", "A4", "A4", "E5", "E5", "C#5", "C#5", "C#5"] },
        { g: "NEW AGE", t: "이루마 - River Flows in You", s: 7, b: ["F#3", "D3", "A3", "E3"], m: ["A4", "G#4", "A4", "G#4", "A4", "E4", "A4", "D4", "A4", "G#4", "A4", "G#4", "A4", "E4", "A4", "D4"] },
        { g: "K-POP", t: "아이브 - Love Dive", s: 8.5, b: ["C#3", "A2", "E3", "B2"], m: ["C#5", "D#5", "E5", "D#5", "C#5", "D#5", "E5", "G#5", "D#5", "C#5", "D#5", "E5", "D#5", "C#5", "D#5"] },
        { g: "K-POP", t: "BTS - Dynamite", s: 9, b: ["C#3", "F#3", "G#3", "C#3"], m: ["G4", "G4", "G4", "G4", "E4", "D4", "C4", "E4", "G4", "A4", "G4", "G4", "G4", "G4"] },
        { g: "CLASSIC", t: "베토벤 - 바이러스 (비창)", s: 9.5, b: ["C3", "G2", "F2", "G2"], m: ["C5", "D5", "Eb5", "F5", "G5", "C6", "B5", "C6", "G5", "Ab5", "F5", "G5", "Eb5", "F5", "D5"] },
        { g: "CLASSIC", t: "라흐마니노프 - 피아노 협주곡 2번", s: 7.5, b: ["C2", "G2", "C3", "G2"], m: ["C4", "Eb4", "G4", "C5", "B4", "G4", "Eb4", "C4", "Bb3", "C4", "Eb4", "G4", "Eb5", "D5", "C5"] },
        { g: "CLASSIC", t: "모차르트 - 터키 행진곡", s: 8.5, b: ["A2", "E3", "A2", "E3"], m: ["B4", "A4", "G#4", "A4", "C5", "D5", "C5", "B4", "C5", "E5", "F5", "E5", "D#5", "E5", "B5"] },
        { g: "ANIME", t: "하울의 움직이는 성", s: 7.5, b: ["G2", "D3", "Bb2", "D3"], m: ["D4", "G4", "Bb4", "D5", "C5", "Bb4", "A4", "Bb4", "G4", "A4", "F#4", "G4", "D4"] },
        // 🔥 버그 수정 4: "Am3" 오타를 "A3"로 수정하여 엔진 크래시 방지!
        { g: "MOVIE", t: "말할 수 없는 비밀 (Secret)", s: 10, b: ["C3", "G3", "A3", "F3"], m: ["E5", "D#5", "E5", "B4", "D5", "C5", "A4", "C4", "E4", "A4", "B4", "E4", "G#4", "B4", "C5"] },
        { g: "POP", t: "Coldplay - Viva La Vida", s: 8, b: ["C#3", "D3", "A3", "E3"], m: ["E5", "D5", "C5", "B4", "A4", "G4", "A4", "C5", "D5", "E5", "D5", "C5", "B4"] },
        { g: "HIP-HOP", t: "Dr. Dre - Still D.R.E.", s: 8, b: ["C3", "C3", "B2", "B2"], m: ["E6", "E6", "E6", "E6", "E6", "E6", "E6", "E6", "B5", "B5", "B5", "B5", "B5", "B5", "B5"] },
        { g: "CLASSIC", t: "쇼팽 - 흑건", s: 11, b: ["Gb2", "Db3", "Gb2", "Db3"], m: ["Gb5", "Eb5", "Db5", "Bb4", "Gb4", "Eb4", "Db4", "Bb3", "Gb3", "Eb3", "Db3", "Bb2", "Gb2"] }
    ];

    let selected = 0;
    let bgmSynth, melodySynth, reverb;
    let isPlaying = false, score = 0, lives = 3, nIdx = 0;
    let tiles = [], loopId, spawnId, bgmLoop;
    const TARGET_SCORE = 100;

    const listDiv = document.getElementById('song-list');
    library.forEach((s, i) => {
        const d = document.createElement('div');
        d.className = `song-item ${i === 0 ? 'active' : ''}`;
        d.innerHTML = `<span class="song-genre">${s.g}</span><div class="song-title">${s.t}</div>`;
        d.onclick = () => { document.querySelectorAll('.song-item').forEach(c => c.classList.remove('active')); d.classList.add('active'); selected = i; };
        listDiv.appendChild(d);
    });

    // 시작 버튼에 안전하게 이벤트 리스너 연결
    document.getElementById('start-btn').addEventListener('pointerdown', async () => {
        const btn = document.getElementById('start-btn');
        if (btn.innerText === "로딩 중...") return;
        btn.innerText = "로딩 중...";
        
        await Tone.start();
        if (!bgmSynth) {
            reverb = new Tone.Reverb(2.5).toDestination();
            bgmSynth = new Tone.PolySynth(Tone.Synth, { oscillator: { type: "sine" }, envelope: { attack: 0.5, decay: 1, sustain: 0.8, release: 2 } }).connect(reverb);
            bgmSynth.volume.value = -8;
            melodySynth = new Tone.PolySynth(Tone.Synth, { oscillator: { type: "triangle" }, envelope: { attack: 0.02, decay: 0.5, sustain: 0.2, release: 1 } }).connect(reverb);
            melodySynth.volume.value = 2;
        }
        startGame();
    });

    function createParticles(x, y) {
        const stage = document.getElementById('game');
        for(let i=0; i<8; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = x + 'px'; p.style.top = y + 'px';
            p.style.setProperty('--tx', (Math.random() - 0.5) * 150 + 'px');
            p.style.setProperty('--ty', (Math.random() - 0.5) * 150 + 'px');
            stage.appendChild(p);
            setTimeout(() => p.remove(), 500);
        }
    }

    function updateLives() {
        document.getElementById('lives').innerText = "❤️".repeat(lives) + "🖤".repeat(3 - lives);
    }

    function startGame() {
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('game').style.display = 'block';
        isPlaying = true; score = 0; lives = 3; nIdx = 0; tiles = [];
        document.getElementById('score').innerText = '0';
        updateLives();
        
        const songData = library[selected];
        let chordIdx = 0;
        bgmLoop = setInterval(() => {
            const chordRoot = songData.b[chordIdx % songData.b.length];
            bgmSynth.triggerAttackRelease(chordRoot, "2n");
            chordIdx++;
        }, 800);

        gameLoop();
        spawnId = setInterval(createTile, 600 / (songData.s / 8));
    }

    function createTile() {
        if (!isPlaying) return;
        
        // 🔥 버그 수정 5: 점수가 달성되면 게임 승리 처리
        if (score >= TARGET_SCORE) {
            winGame();
            return;
        }
        
        const songData = library[selected];
        const lane = Math.floor(Math.random() * 4);
        const t = document.createElement('div');
        t.className = 'tile';
        t.style.left = (lane * 25) + '%';
        t.style.top = '-150px';
        
        const noteToPlay = songData.m[nIdx % songData.m.length];

        const hitEvent = (e) => {
            e.preventDefault();
            if (t.classList.contains('hit')) return;
            
            melodySynth.triggerAttackRelease(noteToPlay, "8n");
            const rect = t.getBoundingClientRect();
            createParticles(rect.left + rect.width/2, rect.top + rect.height/2);

            t.classList.add('hit');
            score++; document.getElementById('score').innerText = score;
            setTimeout(() => t.remove(), 100);
        };

        t.addEventListener('pointerdown', hitEvent);
        document.getElementById('game').appendChild(t);
        tiles.push(t);
        nIdx++;
    }

    function gameLoop() {
        if (!isPlaying) return;
        const stage = document.getElementById('game');
        const h = stage.clientHeight;
        const speed = library[selected].s;

        for (let i = tiles.length - 1; i >= 0; i--) {
            const t = tiles[i];
            let top = parseFloat(t.style.top) + speed;
            t.style.top = top + 'px';

            if (top > h) {
                if(!t.classList.contains('hit')) {
                    lives--;
                    updateLives();
                    stage.style.backgroundColor = "rgba(255,0,0,0.4)";
                    setTimeout(() => stage.style.backgroundColor = "transparent", 150);

                    if(lives <= 0) {
                        t.remove(); tiles.splice(i, 1);
                        gameOver();
                        return;
                    }
                }
                t.remove(); tiles.splice(i, 1);
            }
        }
        loopId = requestAnimationFrame(gameLoop);
    }

    function gameOver() {
        isPlaying = false;
        clearInterval(spawnId);
        clearInterval(bgmLoop);
        cancelAnimationFrame(loopId);
        alert(`GAME OVER\n앗! 3번 틀렸습니다.\n최종 점수: ${score}`);
        location.reload();
    }

    function winGame() {
        isPlaying = false;
        clearInterval(spawnId);
        clearInterval(bgmLoop);
        cancelAnimationFrame(loopId);
        alert(`✨ STAGE CLEAR! ✨\n100점 달성! 완벽하게 연주했습니다.\n최종 점수: ${score}`);
        location.reload();
    }
</script>
</body>
</html>
