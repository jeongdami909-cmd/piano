<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Piano Master: Neon Beat</title>
    <style>
        :root { --neon: #00f2ff; --pink: #ff007b; --bg: #050505; }
        * { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; box-sizing: border-box; touch-action: none; }
        
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; height: 100vh; overflow: hidden; display: flex; justify-content: center; }
        
        /* 홈 화면 */
        #home { 
            position: absolute; inset: 0; background: #000; z-index: 100; 
            display: flex; flex-direction: column; align-items: center; padding: 40px 20px;
        }
        .song-container { 
            flex: 1; width: 100%; overflow-y: scroll; margin: 20px 0;
            border-top: 1px solid #333; border-bottom: 1px solid #333;
        }
        .song-btn { 
            width: 100%; padding: 20px; margin: 10px 0; background: #111; 
            border: 1px solid #222; border-radius: 10px; color: #fff; text-align: left;
        }
        .song-btn.selected { border-color: var(--neon); background: rgba(0, 242, 255, 0.1); }

        /* 게임 스테이지 */
        #game-stage { 
            display: none; width: 100vw; max-width: 480px; height: 100vh; 
            background: #000; position: relative; border-left: 1px solid #222; border-right: 1px solid #222;
        }
        .lane { 
            position: absolute; top: 0; width: 25%; height: 100%; 
            border-right: 1px solid rgba(255, 255, 255, 0.05); 
        }
        /* 타일 디자인: 안 보이지 않게 네온 테두리 추가 */
        .tile { 
            width: 25%; position: absolute; border-radius: 5px;
            background: linear-gradient(135deg, #1a1a1a 0%, #000 100%);
            border: 1.5px solid var(--neon); box-shadow: 0 0 10px rgba(0, 242, 255, 0.3);
        }
        .tile.hit { 
            background: var(--pink) !important; border-color: #fff;
            box-shadow: 0 0 40px var(--pink); opacity: 0; transform: scale(1.2); transition: 0.15s;
        }

        #score-board { position: absolute; top: 50px; width: 100%; text-align: center; font-size: 60px; font-weight: 900; opacity: 0.4; z-index: 10; }
        #start-bar { width: 100%; padding: 20px; background: var(--neon); color: #000; border: none; border-radius: 50px; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div id="home">
    <h1 style="color:var(--neon); letter-spacing: 5px;">PIANO BEAT</h1>
    <div class="song-container" id="song-list"></div>
    <button id="start-bar" onclick="startGame()">CONCERT START</button>
</div>

<div id="game-stage">
    <div id="score-board">0</div>
    <div class="lane" style="left:0%"></div>
    <div class="lane" style="left:25%"></div>
    <div class="lane" style="left:50%"></div>
    <div class="lane" style="left:75%"></div>
</div>

<script>
    const songs = [
        { title: "라흐마니노프 (Hard)", speed: 12, notes: [261, 311, 392, 523, 493, 392, 311, 261], beat: 120 },
        { title: "차이코프스키 (Normal)", speed: 8, notes: [493, 587, 659, 783, 739, 659], beat: 100 },
        { title: "엘리제를 위하여 (Normal)", speed: 7, notes: [659, 622, 659, 622, 659, 493, 587], beat: 90 },
        { title: "왕벌의 비행 (Expert)", speed: 15, notes: [440, 415, 392, 370, 349, 330], beat: 140 }
    ];

    let selected = songs[0];
    let audioCtx, isPlaying = false, score = 0, noteIdx = 0, tiles = [];
    let gameLoopReq, spawnInterval;

    // 곡 목록 만들기
    const list = document.getElementById('song-list');
    songs.forEach((s, i) => {
        const b = document.createElement('button');
        b.className = `song-btn ${i === 0 ? 'selected' : ''}`;
        b.innerHTML = `<strong>${s.title}</strong><br><small>Speed: ${s.speed}</small>`;
        b.onclick = () => {
            document.querySelectorAll('.song-btn').forEach(btn => btn.classList.remove('selected'));
            b.classList.add('selected');
            selected = s;
        };
        list.appendChild(b);
    });

    function createAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    // 신나는 배경 비트 재생 (드럼 느낌)
    function playBackgroundBeat() {
        if (!isPlaying) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(60, now); // 낮은 킥 드럼 소리
        osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(); osc.stop(now + 0.1);
        
        setTimeout(playBackgroundBeat, 60000 / selected.beat); // 곡의 BPM에 맞춰 비트 재생
    }

    function playPiano(f) {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, now);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(); osc.stop(now + 0.5);
    }

    function createTile() {
        if (!isPlaying) return;
        const lane = Math.floor(Math.random() * 4);
        const t = document.createElement('div');
        t.className = 'tile';
        t.style.left = (lane * 25) + '%';
        t.style.top = '-150px';
        t.style.height = '140px';

        const hit = (e) => {
            e.preventDefault();
            if (t.classList.contains('hit')) return;
            playPiano(selected.notes[noteIdx % selected.notes.length]);
            noteIdx++; score++;
            document.getElementById('score-board').innerText = score;
            t.classList.add('hit');
            setTimeout(() => t.remove(), 150);
        };

        t.addEventListener('touchstart', hit);
        t.addEventListener('mousedown', hit);
        document.getElementById('game-stage').appendChild(t);
        tiles.push(t);
    }

    function gameLoop() {
        if (!isPlaying) return;
        tiles.forEach((t, i) => {
            let top = parseFloat(t.style.top) + selected.speed;
            t.style.top = top + 'px';
            if (top > window.innerHeight - 60 && !t.classList.contains('hit')) gameOver();
            if (top > window.innerHeight) { t.remove(); tiles.splice(i, 1); }
        });
        gameLoopReq = requestAnimationFrame(gameLoop);
    }

    function startGame() {
        createAudio();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        document.getElementById('home').style.display = 'none';
        document.getElementById('game-stage').style.display = 'block';
        isPlaying = true; score = 0; noteIdx = 0; tiles = [];
        
        gameLoop();
        spawnInterval = setInterval(createTile, 1000 / (selected.speed / 4));
        playBackgroundBeat(); // 배경 비트 시작
    }

    function gameOver() {
        isPlaying = false;
        clearInterval(spawnInterval);
        cancelAnimationFrame(gameLoopReq);
        alert("PERFORMANCE OVER\nScore: " + score);
        location.reload();
    }
</script>
</body>
</html>
