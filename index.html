<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Piano Tiles - V40 Masterpiece</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root { --pink: #ffb3e6; --purple: #e6ccff; --gold: #ffea00; }
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: linear-gradient(180deg, #ffb3e6 0%, #e6ccff 100%); height: 100dvh; overflow: hidden; touch-action: none; }
        .screen { position: absolute; top: 0; left: 50%; width: 100%; height: 100%; max-width: 500px; transform: translateX(-50%); display: none; flex-direction: column; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
        #lobby { display: flex; z-index: 100; padding: 25px; background: rgba(0,0,0,0.4); color: #fff; }
        h1 { text-align: center; font-size: 24px; font-weight: 900; text-shadow: 0 0 10px var(--pink); padding: 15px 0; }
        #song-list { flex: 1; overflow-y: auto; background: rgba(255,255,255,0.1); border-radius: 20px; padding: 12px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.2); }
        .song-item { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); border-radius: 12px; margin-bottom: 6px; background: rgba(0,0,0,0.2); }
        .song-item.active { background: #fff; color: #ff66cc; font-weight: 800; border: 2px solid var(--pink); }
        #start-btn { width: 100%; padding: 20px; border-radius: 50px; border: none; font-size: 18px; font-weight: 900; background: #fff; color: #ff66cc; cursor: pointer; }
        #game { z-index: 50; position: relative; overflow: hidden; background: transparent; }
        .lane-line { position: absolute; top: 0; width: 25%; height: 100%; border-right: 1px solid rgba(255,255,255,0.1); pointer-events: none; }
        #score { position: absolute; top: 40px; width: 100%; text-align: center; font-size: 75px; font-weight: 900; z-index: 60; color: #fff; pointer-events: none; text-shadow: 0 5px 15px rgba(255,0,150,0.4); }
        .row { position: absolute; width: 100%; height: 25%; pointer-events: none; }
        .tile { position: absolute; width: 25%; height: 100%; background: #1a1a1a; border: 1px solid #000; pointer-events: none; border-radius: 4px; box-shadow: inset 0 -4px 8px rgba(255,255,255,0.1); }
        .tile.pressed { background: rgba(255,255,255,0.7) !important; box-shadow: 0 0 20px #fff; }
        .tile.missed { background: #ff4d4d !important; animation: blink 0.2s infinite; }
        #result { justify-content: center; align-items: center; text-align: center; z-index: 200; background: rgba(255,153,241,0.95); color: #fff; }
    </style>
</head>
<body>

<div id="lobby" class="screen" style="display: flex;">
    <h1>GRAND MASTER PIANO</h1>
    <div id="song-list"></div>
    <button id="start-btn">명곡 조율 중...</button>
</div>

<div id="game" class="screen">
    <div class="lane-line" style="left:0%"></div>
    <div class="lane-line" style="left:25%"></div>
    <div class="lane-line" style="left:50%"></div>
    <div class="lane-line" style="left:75%; border:none;"></div>
    <div id="score">0</div>
</div>

<div id="result" class="screen">
    <h2 id="res-title">SONG CLEAR!</h2>
    <div id="rank" style="font-size:100px; font-weight:900; color:var(--gold);">SSS</div>
    <div id="final-score">Score: 0</div>
    <button onclick="location.reload()" style="padding: 15px 50px; border-radius: 50px; background:#fff; font-size: 18px; font-weight: bold; color:#ff66cc;">다시 연주</button>
</div>

<script>
    // 🎹 소희님을 위한 진짜 피아노 명곡 12곡 리스트
    const songs = [
        { t: "La Campanella", a: "Liszt", p: "D#6,D#6,D#6,D#6,D#6,D#6,C#6,B5,A#5,G#5,F#5,E5,D#5" },
        { t: "Winter Wind", a: "Chopin", p: "E4,E4,F4,E4,A4,G#4,A4,C5,B4,C5,E5" },
        { t: "Nocturne Op.9 No.2", a: "Chopin", p: "G4,G5,F5,G5,Eb5,D5,C5,Bb4,G4,C5" },
        { t: "Für Elise", a: "Beethoven", p: "E5,D#5,E5,D#5,E5,B4,D5,C5,A4" },
        { t: "Moonlight Sonata", a: "Beethoven", p: "G#3,C#4,E4,G#3,C#4,E4,G#3,C#4,E4" },
        { t: "Turkish March", a: "Mozart", p: "B4,A4,G#4,A4,C5,D5,C5,B4,C5,E5,F5,E5,D#5,E5" },
        { t: "Clair de Lune", a: "Debussy", p: "F5,Eb5,Db5,Ab4,F4,Db4" },
        { t: "Canon in D", a: "Pachelbel", p: "F#5,E5,D5,C#5,B4,A4,B4,C#5,D5" },
        { t: "River Flows in You", a: "Yiruma", p: "F#4,E4,F#4,C#4,F#4,E4,F#4,C#4" },
        { t: "Summer (Kikujiro)", a: "Joe Hisaishi", p: "D4,G4,A4,B4,A4,G4,D4,E4" },
        { t: "Piano Concerto No.2", a: "Rachmaninoff", p: "C4,Eb4,G4,C5,G4,Eb4,C4,G3" },
        { t: "Gymnopédie No.1", a: "Satie", p: "F#4,A4,G4,F#4,E4,D4,E4,F#4,D4" }
    ];

    let piano, sheet = [], activeRows = [];
    let isPlaying = false, score = 0, currentStep = 0, selected = 0, canClick = false;
    let speed = 0.6;
    const gameArea = document.getElementById('game');

    // 🎧 쇳소리 박멸: 릴리즈를 짧게 가져가서 음이 지저분하게 겹치는 현상 해결
    piano = new Tone.Sampler({
        urls: { A0:"A0.mp3", C1:"C1.mp3", C4:"C4.mp3", C8:"C8.mp3" },
        release: 0.8,
        baseUrl: "https://tonejs.github.io/audio/salamander/",
        onload: () => { document.getElementById('start-btn').innerText = "콘서트 시작하기"; }
    }).toDestination();

    function renderSongs() {
        const listDiv = document.getElementById('song-list'); listDiv.innerHTML = "";
        songs.forEach((s, idx) => {
            const item = document.createElement('div');
            item.className = `song-item ${idx === selected ? 'active' : ''}`;
            item.innerHTML = `<strong>${s.t}</strong><br><small>${s.a}</small>`;
            item.onclick = (e) => { e.stopPropagation(); selected = idx; renderSongs(); };
            listDiv.appendChild(item);
        });
    }
    renderSongs();

    document.getElementById('start-btn').addEventListener('click', async (e) => {
        e.preventDefault(); e.stopPropagation(); // 🛡️ 시작 버튼 클릭 전파 방지
        await Tone.start();
        document.getElementById('lobby').style.display = 'none';
        gameArea.style.display = 'block';

        const song = songs[selected]; sheet = [];
        const notes = song.p.split(',');
        for(let i=0; i<300; i++) {
            sheet.push({ lane: Math.floor(Math.random()*4), note: notes[i % notes.length] });
        }

        isPlaying = true; score = 0; currentStep = 0; activeRows = []; speed = 0.6;
        document.getElementById('score').innerText = "0";
        for(let i=0; i<5; i++) createRow(115 + (i * 25));
        
        // 🛡️ 즉사 방지 보호막 (0.6초간 모든 터치 무시)
        setTimeout(() => { canClick = true; }, 600);
        requestAnimationFrame(gameLoop);
    });

    function createRow(bottomVal) {
        if(currentStep >= sheet.length) return;
        const data = sheet[currentStep];
        const rowEl = document.createElement('div'); rowEl.className = 'row'; rowEl.style.bottom = bottomVal + '%';
        const tileEl = document.createElement('div'); tileEl.className = 'tile'; tileEl.style.left = (data.lane * 25) + '%';
        rowEl.appendChild(tileEl); gameArea.appendChild(rowEl);
        activeRows.push({ rowEl, tileEl, lane: data.lane, note: data.note, locked: false });
        currentStep++;
    }

    function gameLoop() {
        if (!isPlaying) return;
        for (let i = activeRows.length - 1; i >= 0; i--) {
            const row = activeRows[i];
            const currentBottom = parseFloat(row.rowEl.style.bottom);
            const newBottom = currentBottom - speed;
            row.rowEl.style.bottom = newBottom + "%";
            if (newBottom < -15 && !row.locked) { end(false); return; } // 바닥 통과 시 종료
        }
        speed += 0.0001; requestAnimationFrame(gameLoop);
    }

    gameArea.addEventListener("pointerdown", (e) => {
        if (!isPlaying || !canClick || activeRows.length === 0) return;
        e.preventDefault();
        
        // 실제 물리 위치 기반 최하단 타일 정밀 탐색
        let bottomRow = null; let lowestPos = Infinity;
        activeRows.forEach(r => { if (!r.locked) { const b = parseFloat(r.rowEl.style.bottom); if (b < lowestPos) { lowestPos = b; bottomRow = r; } } });

        if (!bottomRow || lowestPos > 48) return; // 너무 위쪽 클릭 무시

        const rect = gameArea.getBoundingClientRect();
        const tx = (e.clientX || e.touches[0].clientX) - rect.left;
        let lane = Math.floor(tx / (rect.width / 4));
        lane = Math.max(0, Math.min(3, lane));

        if (lane === bottomRow.lane) {
            bottomRow.locked = true;
            piano.triggerAttackRelease(bottomRow.note, "8n");
            bottomRow.tileEl.classList.add('pressed');
            score++; document.getElementById('score').innerText = score;
            setTimeout(() => {
                bottomRow.rowEl.remove();
                activeRows = activeRows.filter(r => r !== bottomRow);
            }, 60);
            const topRow = activeRows[activeRows.length - 1];
            createRow((topRow ? parseFloat(topRow.rowEl.style.bottom) : 100) + 25);
        } else { end(false); }
    });

    function end(win) {
        if (!isPlaying) return; isPlaying = false;
        setTimeout(() => {
            gameArea.style.display = 'none'; document.getElementById('result').style.display = 'flex';
            document.getElementById('final-score').innerText = `Final Score: ${score}`;
        }, 300);
    }
</script>
</body>
</html>
