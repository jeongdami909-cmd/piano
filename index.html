<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Concert - My Music</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root { --neon: #00f2ff; --pink: #ff00ea; --bg: #05050a; }
        * { box-sizing: border-box; user-select: none; font-family: 'Pretendard', sans-serif; touch-action: none; }
        
        body { margin: 0; color: #fff; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; background: #000; }

        #lobby { display: flex; flex-direction: column; height: 100%; width: 100%; max-width: 500px; margin: 0 auto; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); z-index: 20; position: relative; }
        
        header { padding: 30px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        header h1 { margin: 0; font-size: 32px; font-weight: 900; background: linear-gradient(90deg, var(--neon), var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        header p { margin: 8px 0 0; font-size: 13px; color: #aaa; }
        
        .content { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        
        /* 파일 업로드 버튼 스타일 */
        .upload-section { text-align: center; padding: 20px; background: rgba(255,255,255,0.05); border-radius: 12px; border: 1px dashed rgba(255,255,255,0.3); }
        .upload-btn { display: inline-block; padding: 12px 24px; background: rgba(0, 242, 255, 0.2); border: 2px solid var(--neon); color: var(--neon); border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .upload-btn:active { background: var(--neon); color: #000; }
        #file-name { margin-top: 15px; font-size: 14px; color: #ccc; word-break: break-all; }

        /* 난이도 선택 스타일 */
        .diff-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; color: #fff; }
        .diff-grid { display: flex; gap: 10px; }
        .diff-btn { flex: 1; padding: 15px 0; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .diff-btn.active.하 { background: #00e5ff; color: #000; border-color: #00e5ff; }
        .diff-btn.active.중 { background: #ffea00; color: #000; border-color: #ffea00; }
        .diff-btn.active.상 { background: #ff00ea; color: #fff; border-color: #ff00ea; }

        .footer { padding: 25px; background: rgba(0,0,0,0.9); }
        #start-btn { width: 100%; padding: 20px; background: linear-gradient(45deg, var(--neon), var(--pink)); color: #fff; font-size: 20px; font-weight: 900; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 20px rgba(255,0,234,0.4); opacity: 0.5; pointer-events: none; transition: 0.3s; }
        #start-btn.ready { opacity: 1; pointer-events: auto; }

        #game { display: none; width: 100vw; max-width: 500px; height: 100%; margin: 0 auto; position: relative; overflow: hidden; background: #050011; }
        .lane-bg { position: absolute; width: 25%; height: 100%; border-right: 1px dashed rgba(255,255,255,0.1); }
        #keys-container { position: absolute; bottom: 10%; width: 100%; height: 80px; display: flex; z-index: 5; }
        .hit-key { flex: 1; border-top: 3px solid #fff; background: linear-gradient(180deg, transparent, rgba(255,255,255,0.05)); }
        
        .tile { position: absolute; width: 25%; height: 140px; border-radius: 8px; background: linear-gradient(180deg, rgba(255,255,255,0.8) 0%, var(--neon) 100%); border: 2px solid #fff; box-shadow: 0 0 20px var(--neon); z-index: 10; }
        .tile.pressed { opacity: 0; transform: scale(1.4); transition: 0.1s ease-out; }

        #hud { position: absolute; top: 50px; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 30; pointer-events: none; }
        #score { font-size: 60px; font-weight: 900; text-shadow: 0 0 20px var(--pink); }
        #lives { font-size: 24px; margin-top: 5px; }
    </style>
</head>
<body>

<div id="lobby">
    <header>
        <h1>Neon Concert</h1>
        <p>내 폰에 있는 노래로 즐기는 리듬게임</p>
    </header>
    
    <div class="content">
        <div class="upload-section">
            <label class="upload-btn" for="audio-upload">🎵 기기에서 MP3 선택</label>
            <input type="file" id="audio-upload" accept="audio/*" style="display:none;">
            <p id="file-name">선택된 곡이 없습니다.</p>
        </div>

        <div>
            <div class="diff-title">난이도 선택</div>
            <div class="diff-grid" id="diff-container">
                <button class="diff-btn active 하" data-speed="5" data-spawn="800">Easy</button>
                <button class="diff-btn 중" data-speed="8" data-spawn="500">Normal</button>
                <button class="diff-btn 상" data-speed="12" data-spawn="300">Hard</button>
            </div>
        </div>
    </div>

    <div class="footer">
        <button id="start-btn">곡을 먼저 선택해주세요</button>
    </div>
</div>

<div id="game">
    <div id="hud">
        <div id="score">0</div>
        <div id="lives">❤️❤️❤️❤️❤️❤️</div> 
    </div>
    <div class="lane-bg" style="left:0%"></div><div class="lane-bg" style="left:25%"></div><div class="lane-bg" style="left:50%"></div><div class="lane-bg" style="left:75%; border:none;"></div>
    <div id="keys-container">
        <div id="key-0" class="hit-key"></div><div id="key-1" class="hit-key"></div><div id="key-2" class="hit-key"></div><div id="key-3" class="hit-key"></div>
    </div>
</div>

<script>
    let hitSynth, bgmPlayer, isPlaying = false, score = 0, lives = 6, tiles = [], loopId, spawnId, winTimeoutId;
    const MAX_LIVES = 6;
    let currentSpeed = 5;
    let currentSpawnRate = 800;

    // 난이도 버튼 클릭 이벤트
    document.querySelectorAll('.diff-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            currentSpeed = parseInt(e.target.getAttribute('data-speed'));
            currentSpawnRate = parseInt(e.target.getAttribute('data-spawn'));
        });
    });

    // 파일 선택 이벤트
    document.getElementById('audio-upload').addEventListener('change', async (event) => {
        const file = event.target.files[0];
        if (!file) return;

        document.getElementById('file-name').innerText = `선택됨: ${file.name}\n(로딩 중...)`;
        const startBtn = document.getElementById('start-btn');
        startBtn.classList.remove('ready');
        startBtn.innerText = "음원 처리 중...";

        // 브라우저에서 파일을 임시 URL로 변환 (서버 업로드 안 함!)
        const objectUrl = URL.createObjectURL(file);

        if (bgmPlayer) bgmPlayer.dispose();

        bgmPlayer = new Tone.Player({
            url: objectUrl,
            loop: false,
            autostart: false,
            onload: () => {
                document.getElementById('file-name').innerText = `✅ 준비 완료: ${file.name}`;
                startBtn.innerText = "PLAY NOW";
                startBtn.classList.add('ready');
            },
            onerror: () => {
                document.getElementById('file-name').innerText = "❌ 음원을 불러오지 못했습니다. 다른 파일을 선택해주세요.";
                startBtn.innerText = "곡을 다시 선택해주세요";
            }
        }).toDestination();
        bgmPlayer.volume.value = -3;
    });

    document.getElementById('start-btn').addEventListener('click', async () => {
        if (!bgmPlayer || !bgmPlayer.loaded) return;
        
        await Tone.start(); // 모바일 브라우저 오디오 권한 허용
        
        if (!hitSynth) {
            hitSynth = new Tone.PolySynth(Tone.Synth, { 
                oscillator: { type: "triangle" }, 
                envelope: { attack: 0.01, decay: 0.2, sustain: 0.1, release: 0.5 } 
            }).toDestination();
            hitSynth.volume.value = -2;
        }

        startGame();
    });

    function startGame() {
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('game').style.display = 'block';
        isPlaying = true; score = 0; lives = MAX_LIVES; tiles = [];
        document.getElementById('score').innerText = '0';
        updateLivesUI();
        
        bgmPlayer.start();

        const songDurationMs = bgmPlayer.buffer.duration * 1000;
        winTimeoutId = setTimeout(() => { if (isPlaying) win(); }, songDurationMs);

        gameLoop();
        spawnId = setInterval(createTile, currentSpawnRate);
    }

    function updateLivesUI() {
        document.getElementById('lives').innerText = "❤️".repeat(lives) + "🖤".repeat(MAX_LIVES - lives);
    }

    const hitNotes = ["C5", "E5", "G5", "B5", "C6"];

    function createTile() {
        if (!isPlaying) return;
        const lane = Math.floor(Math.random() * 4);
        const t = document.createElement('div');
        t.className = 'tile';
        t.style.left = (lane * 25) + '%';
        t.style.top = '-140px';
        
        const onHit = (e) => {
            e.preventDefault();
            if (t.classList.contains('pressed')) return;

            const stageHeight = document.getElementById('game').clientHeight;
            const hitLineY = stageHeight * 0.85; 
            const rect = t.getBoundingClientRect();
            
            if (Math.abs((rect.top + rect.height / 2) - hitLineY) > 130) return;

            const randomNote = hitNotes[Math.floor(Math.random() * hitNotes.length)];
            hitSynth.triggerAttackRelease(randomNote, "16n");

            t.classList.add('pressed');
            score++; document.getElementById('score').innerText = score;
            
            setTimeout(() => {
                const idx = tiles.indexOf(t);
                if (idx > -1) tiles.splice(idx, 1);
                t.remove();
            }, 100);
        };

        t.addEventListener('pointerdown', onHit, { passive: false });
        document.getElementById('game').appendChild(t);
        tiles.push(t);
    }

    function gameLoop() {
        if (!isPlaying) return;
        const stage = document.getElementById('game');
        const h = stage.clientHeight;

        for (let i = tiles.length - 1; i >= 0; i--) {
            const t = tiles[i];
            let top = parseFloat(t.style.top) + currentSpeed;
            t.style.top = top + 'px';

            if (top > h) {
                if(!t.classList.contains('pressed')) {
                    lives--;
                    updateLivesUI();
                    if(lives <= 0) { gameOver(); return; }
                }
                t.remove(); tiles.splice(i, 1);
            }
        }
        loopId = requestAnimationFrame(gameLoop);
    }

    function gameOver() {
        isPlaying = false; clearInterval(spawnId); bgmPlayer.stop(); cancelAnimationFrame(loopId); clearTimeout(winTimeoutId);
        setTimeout(() => { alert(`GAME OVER\n최종 점수: ${score}`); location.reload(); }, 100);
    }

    function win() {
        isPlaying = false; clearInterval(spawnId); bgmPlayer.stop(); cancelAnimationFrame(loopId);
        setTimeout(() => { alert(`✨ 곡 완주 성공! ✨\n멋진 연주였어! 최종 점수: ${score}`); location.reload(); }, 100);
    }
</script>
</body>
</html>
