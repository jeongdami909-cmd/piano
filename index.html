<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Piano Master: Real Sound & Rhythm</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root { --main: #00f2ff; --bg: #111; --lane: rgba(255,255,255,0.05); }
        * { box-sizing: border-box; user-select: none; touch-action: none; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
        
        #lobby { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; z-index: 10; background: var(--bg); }
        h1 { color: var(--main); letter-spacing: 2px; text-align: center; }
        .song-btn { width: 100%; max-width: 400px; padding: 20px; margin: 10px 0; background: #222; color: #fff; border: 2px solid #333; border-radius: 10px; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .song-btn.active { border-color: var(--main); background: rgba(0,242,255,0.1); }
        #start-btn { width: 100%; max-width: 400px; padding: 20px; margin-top: 20px; background: var(--main); color: #000; font-weight: bold; border: none; border-radius: 30px; font-size: 20px; }
        
        #game { display: none; flex: 1; position: relative; max-width: 500px; margin: 0 auto; width: 100%; border-left: 1px solid #333; border-right: 1px solid #333; background: #000; overflow: hidden; }
        .lane-divider { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--lane); }
        
        /* 판정선 (히트 라인) */
        #hit-line { position: absolute; bottom: 15%; width: 100%; height: 5px; background: rgba(255, 0, 123, 0.5); box-shadow: 0 0 10px #ff007b; z-index: 5; }
        
        .tile { position: absolute; width: 25%; height: 120px; background: linear-gradient(to bottom, #333, #000); border: 2px solid var(--main); border-radius: 8px; border-bottom: 6px solid #00a8b3; }
        .tile.hit { background: #ff007b !important; border-color: #fff; transform: scale(1.1); opacity: 0; transition: 0.1s; }
        
        #score-display { position: absolute; top: 20px; width: 100%; text-align: center; font-size: 40px; font-weight: bold; opacity: 0.5; z-index: 10; pointer-events: none; }
        #loading { display: none; color: #ff007b; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div id="lobby">
    <h1>REAL PIANO ENGINE</h1>
    <p style="color:#888; text-align:center; font-size: 14px; margin-bottom: 30px;">
        실제 그랜드 피아노 샘플을 불러옵니다.<br>(정확한 박자와 음정 매핑)
    </p>
    
    <button class="song-btn active" onclick="selectSong(0)">엘리제를 위하여 (도입부 정확한 박자)</button>
    <button class="song-btn" onclick="selectSong(1)">라흐마니노프 협주곡 2번 (1악장 테마)</button>
    <button class="song-btn" onclick="selectSong(2)">Coldplay - Viva La Vida (후렴부)</button>
    
    <div id="loading">피아노 소리를 불러오는 중입니다...</div>
    <button id="start-btn" onclick="initGame()">연주 시작</button>
</div>

<div id="game">
    <div id="score-display">0</div>
    <div class="lane-divider" style="left: 25%;"></div>
    <div class="lane-divider" style="left: 50%;"></div>
    <div class="lane-guide" style="left: 75%;"></div>
    <div id="hit-line"></div>
</div>

<script>
    // 곡 데이터 (note: 음정, time: 떨어지는 타이밍(초 단위))
    // 실제 악보의 리듬(박자)을 정확히 계산하여 넣었습니다.
    const library = [
        {
            title: "엘리제를 위하여",
            speed: 400, // 타일이 떨어지는 픽셀 속도
            notes: [
                { note: "E5", time: 0 }, { note: "D#5", time: 0.25 }, { note: "E5", time: 0.5 }, { note: "D#5", time: 0.75 },
                { note: "E5", time: 1.0 }, { note: "B4", time: 1.25 }, { note: "D5", time: 1.5 }, { note: "C5", time: 1.75 },
                { note: "A4", time: 2.0 }, { note: "C4", time: 2.5 }, { note: "E4", time: 2.75 }, { note: "A4", time: 3.0 },
                { note: "B4", time: 3.25 }, { note: "E4", time: 3.75 }, { note: "G#4", time: 4.0 }, { note: "B4", time: 4.25 },
                { note: "C5", time: 4.5 }
            ]
        },
        {
            title: "라흐마니노프 협주곡 2번",
            speed: 350,
            notes: [
                { note: "C4", time: 0 }, { note: "Eb4", time: 0.5 }, { note: "G4", time: 1.0 }, { note: "C5", time: 2.0 },
                { note: "B4", time: 2.5 }, { note: "G4", time: 3.0 }, { note: "Eb4", time: 4.0 }, { note: "C4", time: 4.5 },
                { note: "Bb3", time: 5.0 }, { note: "C4", time: 5.5 }, { note: "Eb4", time: 6.0 }, { note: "G4", time: 6.5 },
                { note: "Eb5", time: 7.5 }, { note: "D5", time: 8.0 }, { note: "C5", time: 8.5 }, { note: "B4", time: 9.0 }
            ]
        },
        {
            title: "Viva La Vida",
            speed: 450,
            notes: [
                { note: "E5", time: 0 }, { note: "D5", time: 0.5 }, { note: "C5", time: 1.0 }, { note: "B4", time: 1.5 },
                { note: "A4", time: 2.0 }, { note: "G4", time: 2.5 }, { note: "A4", time: 3.0 }, { note: "C5", time: 3.5 },
                { note: "D5", time: 4.0 }, { note: "E5", time: 4.5 }, { note: "D5", time: 5.0 }, { note: "C5", time: 5.5 },
                { note: "B4", time: 6.0 }, { note: "A4", time: 6.5 }, { note: "G4", time: 7.0 }
            ]
        }
    ];

    let selectedSong = 0;
    let piano;
    let isPlaying = false;
    let startTime = 0;
    let score = 0;
    let activeTiles = [];
    let animationId;
    let hitLineY = 0;

    function selectSong(index) {
        selectedSong = index;
        const btns = document.querySelectorAll('.song-btn');
        btns.forEach((btn, i) => {
            if(i === index) btn.classList.add('active');
            else btn.classList.remove('active');
        });
    }

    // 1. 실제 피아노 샘플 로딩 (Salamander Grand Piano)
    async function loadPiano() {
        document.getElementById('loading').style.display = 'block';
        document.getElementById('start-btn').style.display = 'none';
        
        await Tone.start();
        
        piano = new Tone.Sampler({
            urls: {
                "A0": "A0.mp3",
                "C1": "C1.mp3",
                "D#1": "Ds1.mp3",
                "F#1": "Fs1.mp3",
                "A1": "A1.mp3",
                "C2": "C2.mp3",
                "D#2": "Ds2.mp3",
                "F#2": "Fs2.mp3",
                "A2": "A2.mp3",
                "C3": "C3.mp3",
                "D#3": "Ds3.mp3",
                "F#3": "Fs3.mp3",
                "A3": "A3.mp3",
                "C4": "C4.mp3",
                "D#4": "Ds4.mp3",
                "F#4": "Fs4.mp3",
                "A4": "A4.mp3",
                "C5": "C5.mp3",
                "D#5": "Ds5.mp3",
                "F#5": "Fs5.mp3",
                "A5": "A5.mp3",
                "C6": "C6.mp3",
                "D#6": "Ds6.mp3",
                "F#6": "Fs6.mp3",
                "A6": "A6.mp3",
                "C7": "C7.mp3",
                "D#7": "Ds7.mp3",
                "F#7": "Fs7.mp3",
                "A7": "A7.mp3",
                "C8": "C8.mp3"
            },
            release: 1,
            baseUrl: "https://tonejs.github.io/audio/salamander/"
        }).toDestination();

        await Tone.loaded();
        startGame();
    }

    function initGame() {
        if (!piano) {
            loadPiano();
        } else {
            startGame();
        }
    }

    function startGame() {
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('game').style.display = 'block';
        
        // 판정선 Y좌표 계산
        const gameArea = document.getElementById('game');
        const hitLine = document.getElementById('hit-line');
        hitLineY = gameArea.clientHeight * 0.85; 

        score = 0;
        document.getElementById('score-display').innerText = score;
        activeTiles = [];
        
        const songData = library[selectedSong];
        
        // 악보 데이터에 따라 타일을 미리 DOM에 생성해둠
        songData.notes.forEach((noteData) => {
            const lane = Math.floor(Math.random() * 4);
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.style.left = (lane * 25) + '%';
            
            // 타일 객체 생성
            const tileObj = {
                element: tile,
                note: noteData.note,
                targetTime: noteData.time + 1.5, // 1.5초 뒤부터 첫 음 시작
                hit: false
            };

            const hitEvent = (e) => {
                e.preventDefault();
                if (tileObj.hit) return;
                
                // 타일을 쳤을 때 실제 피아노 소리 재생
                piano.triggerAttackRelease(tileObj.note, "4n");
                
                tileObj.hit = true;
                tile.classList.add('hit');
                score++;
                document.getElementById('score-display').innerText = score;
                
                if (score === songData.notes.length) {
                    setTimeout(() => {
                        alert("연주 완료!");
                        location.reload();
                    }, 1000);
                }
            };

            tile.addEventListener('pointerdown', hitEvent);
            gameArea.appendChild(tile);
            activeTiles.push(tileObj);
        });

        isPlaying = true;
        startTime = Tone.now();
        requestAnimationFrame(gameLoop);
    }

    function gameLoop() {
        if (!isPlaying) return;
        
        const currentTime = Tone.now() - startTime;
        const songData = library[selectedSong];

        // 수학적 리듬 계산: Y좌표 = 판정선 - (목표시간 - 현재시간) * 속도
        activeTiles.forEach(t => {
            if (!t.hit) {
                const timeDiff = t.targetTime - currentTime;
                const yPos = hitLineY - (timeDiff * songData.speed);
                t.element.style.top = yPos + 'px';

                // 판정선을 너무 지나치면 미스 처리 후 숨김
                if (timeDiff < -0.3) {
                    t.hit = true;
                    t.element.style.opacity = 0;
                }
            }
        });

        animationId = requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
