<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Piano Tiles - V43 Heart Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root { --pink: #ffb3e6; --purple: #e6ccff; --gold: #ffea00; --red: #ff3366; }
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background: linear-gradient(180deg, #ff99f1 0%, #e6b2ff 100%); height: 100dvh; overflow: hidden; touch-action: none; }
        .screen { position: absolute; top: 0; left: 50%; width: 100%; height: 100%; max-width: 500px; transform: translateX(-50%); display: none; flex-direction: column; background: rgba(255,255,255,0.15); backdrop-filter: blur(8px); border-left: 1px solid rgba(255,255,255,0.2); border-right: 1px solid rgba(255,255,255,0.2); }
        
        #lobby { display: flex; z-index: 100; padding: 25px; background: rgba(0,0,0,0.5); color: #fff; }
        h1 { text-align: center; font-size: 28px; font-weight: 900; text-shadow: 0 0 15px var(--pink); padding: 10px 0 10px 0; }
        
        /* 난이도 선택 UI */
        #difficulty-box { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .diff-btn { padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 30px; border: 2px solid #fff; background: rgba(0,0,0,0.3); color: #fff; cursor: pointer; transition: 0.2s; }
        .diff-btn.active { background: var(--pink); color: #fff; box-shadow: 0 0 10px var(--pink); border-color: var(--pink); }

        #song-list { flex: 1; overflow-y: auto; background: rgba(255,255,255,0.05); border-radius: 20px; padding: 10px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .song-item { padding: 18px; border-bottom: 1px solid rgba(255,255,255,0.1); border-radius: 12px; margin-bottom: 8px; background: rgba(0,0,0,0.3); color: #ddd; font-weight: bold; }
        .song-item.active { background: var(--pink); color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); border: 2px solid #fff; }
        
        #start-btn { width: 100%; padding: 20px; border-radius: 50px; border: none; font-size: 20px; font-weight: 900; background: #fff; color: #ff66cc; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        #game { z-index: 50; position: relative; overflow: hidden; background: transparent; }
        
        /* 하트(목숨) UI */
        #hearts-container { position: absolute; top: 15px; left: 15px; z-index: 70; font-size: 24px; letter-spacing: 2px; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        
        .lane-line { position: absolute; top: 0; width: 25%; height: 100%; border-right: 1px solid rgba(255,255,255,0.2); pointer-events: none; }
        #score { position: absolute; top: 50px; width: 100%; text-align: center; font-size: 80px; font-weight: 900; z-index: 60; color: #fff; pointer-events: none; text-shadow: 0 4px 10px rgba(255,0,150,0.6); }
        
        .row { position: absolute; width: 100%; height: 25%; pointer-events: none; }
        .tile { position: absolute; width: 25%; height: 100%; background: #111; border: 1px solid #222; pointer-events: auto; border-radius: 5px; box-shadow: inset 0 -5px 10px rgba(255,255,255,0.1); }
        .tile.long { background: linear-gradient(to bottom, #00d2ff, #3a7bd5); height: 180%; }
        .tile.pressed { background: rgba(255,255,255,0.8) !important; box-shadow: 0 0 30px #fff; }
        .tile.missed { background: var(--red) !important; box-shadow: 0 0 20px var(--red); opacity: 0.8; }
        
        .spark { position: absolute; width: 10px; height: 10px; background: #fff; border-radius: 50%; pointer-events: none; animation: explode 0.4s ease-out forwards; }
        @keyframes explode { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(4) translate(var(--tx), var(--ty)); opacity: 0; } }
        
        #result { justify-content: center; align-items: center; text-align: center; z-index: 200; background: rgba(255,153,241,0.95); color: #fff; }
    </style>
</head>
<body>

<div id="lobby" class="screen" style="display: flex;">
    <h1>HEART EDITION</h1>
    
    <div id="difficulty-box">
        <button class="diff-btn" data-diff="하">하 (❤️x6)</button>
        <button class="diff-btn active" data-diff="중">중 (❤️x6)</button>
        <button class="diff-btn" data-diff="상">상 (❤️x9)</button>
    </div>

    <div id="song-list"></div>
    <button id="start-btn">그랜드 피아노 조율 중...</button>
</div>

<div id="game" class="screen">
    <div id="hearts-container">❤️❤️❤️❤️❤️❤️</div>
    <div class="lane-line" style="left:0%"></div>
    <div class="lane-line" style="left:25%"></div>
    <div class="lane-line" style="left:50%"></div>
    <div class="lane-line" style="left:75%; border:none;"></div>
    <div id="score">0</div>
</div>

<div id="result" class="screen">
    <h2 id="res-title">CONCERT OVER</h2>
    <div id="rank" style="font-size:110px; font-weight:900; color:var(--gold); text-shadow: 0 0 20px rgba(255,234,0,0.5);">SSS</div>
    <div id="final-score">Score: 0</div>
    <button onclick="location.reload()" style="padding: 20px 60px; border-radius: 50px; background:#fff; font-size: 20px; font-weight: bold; color:#ff66cc;">다시 연주</button>
</div>

<script>
    // 🎹 반복 없이 아주 길게 확장된 풀 화음 멜로디 악보
    const songs = [
        { t: "La Campanella", a: "Liszt", p: "D#6|D#4,D#6|A#4,D#6|B4,D#6|D#5,D#6|D#4,D#6|A#4,C#6|F#4,B5|D#4,A#5|F4,G#5|D#4,F#5|B3,E5|G#3,D#5|D#3,C#5|E3,B4|G#3,A#4|F#3,G#4|E3,F#4|D#3,E4|C#3,D#4|B2,D#6|D#4,F#6|B4,D#6|A#4,C#6|F#4,B5|D#4" },
        { t: "Piano Concerto No.2", a: "Rachmaninoff", p: "F2|C3|F3|G#3|C4,F2|C3|F3|G#3|C4,G2|C3|G3|A#3|E4,G#2|C3|G#3|C4|F4,A#2|C3|A#3|C#4|G4,C3|G3|C4|E4|G#4,F2|C3|F3|G#3|C4,G2|C3|G3|A#3|E4,G#2|C3|G#3|C4|F4,C#3|G#3|C#4|F4|A#4,D#3|A#3|D#4|G4|C5" },
        { t: "River Flows in You", a: "Yiruma", p: "F#5|F#3,E5|A3,F#5|C#4,C#5|F#4,F#5|D3,E5|A3,F#5|D4,C#5|A4,F#5|F#3,E5|A3,F#5|C#4,C#5|F#4,D5|D3,E5|A3,F#5|D4,A5|A4,G#5|E4,F#5|C#4,E5|A3,D5|D3,C#5|A3" },
        { t: "Winter Wind", a: "Chopin", p: "A5|A3,G#5|C4,A5|E4,F5|A4,E5|C5,D#5|E5,E5|A5,C5|C6,B4|E6,A#4|A6,B4|C7,G4|E7,A5|A3,G#5|C4,A5|E4,F5|A4,E5|C5,D#5|E5,E5|A5,F5|D6,E5|C6,D5|B5,C5|A5" }
    ];

    let piano, sheet = [], activeRows = [];
    let isPlaying = false, score = 0, currentStep = 0, selected = 0, canClick = false;
    
    // 💖 하트 및 난이도 시스템 변수
    let difficulty = '중';
    let lives = 6;
    let speed = 0.65; 
    let speedInc = 0.00015;
    const gameArea = document.getElementById('game');
    const heartsContainer = document.getElementById('hearts-container');

    // 난이도 버튼 이벤트
    document.querySelectorAll('.diff-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            difficulty = e.target.getAttribute('data-diff');
        });
    });

    // 🎧 소리 기능은 V42 그대로 (쇳소리 없는 풀 화음)
    const hall = new Tone.Reverb({ decay: 2.5, wet: 0.25 }).toDestination();
    piano = new Tone.Sampler({
        urls: { A0:"A0.mp3", C1:"C1.mp3", C4:"C4.mp3", C8:"C8.mp3" },
        release: 1.5,
        baseUrl: "https://tonejs.github.io/audio/salamander/",
        onload: () => { document.getElementById('start-btn').innerText = "연주 시작하기"; }
    }).connect(hall);

    setTimeout(() => {
        if (document.getElementById('start-btn').innerText.includes("조율")) {
            document.getElementById('start-btn').innerText = "연주 시작하기";
        }
    }, 4000);

    function updateHeartsDisplay() {
        heartsContainer.innerText = '❤️'.repeat(Math.max(0, lives));
    }

    function loseLife(rowToMiss = null) {
        lives--;
        updateHeartsDisplay();
        
        if (rowToMiss) {
            rowToMiss.tileEl.classList.add('missed'); // 빨간색으로 깜빡임
            setTimeout(() => {
                if(rowToMiss.rowEl.parentNode) {
                    rowToMiss.rowEl.remove();
                    activeRows = activeRows.filter(r => r !== rowToMiss);
                    // 타일 하나 놓쳐도 진행되도록 새 타일 보충
                    const topRow = activeRows[activeRows.length - 1];
                    createRow((topRow ? parseFloat(topRow.rowEl.style.bottom) : 100) + 25);
                }
            }, 300);
        }

        if (lives <= 0) {
            end(false);
        }
    }

    function createSpark(x, y) {
        for(let i=0; i<8; i++) {
            const s = document.createElement('div');
            s.className = 'spark'; s.style.left = x + 'px'; s.style.top = y + 'px';
            s.style.setProperty('--tx', (Math.random()*120-60)+'px');
            s.style.setProperty('--ty', (Math.random()*120-60)+'px');
            gameArea.appendChild(s); setTimeout(() => s.remove(), 400);
        }
    }

    function renderSongs() {
        const listDiv = document.getElementById('song-list'); listDiv.innerHTML = "";
        songs.forEach((s, idx) => {
            const item = document.createElement('div');
            item.className = `song-item ${idx === selected ? 'active' : ''}`;
            item.innerHTML = `<strong>${s.t}</strong><br><small>${s.a}</small>`;
            item.onclick = (e) => { e.stopPropagation(); selected = idx; renderSongs(); };
            listDiv.appendChild(item);
        });
    }
    renderSongs();

    document.getElementById('start-btn').addEventListener('click', async (e) => {
        e.preventDefault(); e.stopPropagation();
        await Tone.start();
        
        // 난이도별 세팅 적용 (상: 하트 9개 + 빠름, 중/하: 하트 6개)
        if (difficulty === '하') { speed = 0.50; lives = 6; speedInc = 0.00010; }
        else if (difficulty === '중') { speed = 0.65; lives = 6; speedInc = 0.00015; }
        else if (difficulty === '상') { speed = 0.85; lives = 9; speedInc = 0.00020; }
        
        updateHeartsDisplay();

        document.getElementById('lobby').style.display = 'none';
        gameArea.style.display = 'block';

        const song = songs[selected];
        sheet = [];
        const notes = song.p.split(',');
        for(let i=0; i<800; i++) { // 무한 모드를 위해 아주 길게 세팅
            const chordArray = notes[i % notes.length].split('|');
            sheet.push({ lane: Math.floor(Math.random()*4), note: chordArray, isLong: Math.random() < 0.12 });
        }

        isPlaying = true; score = 0; currentStep = 0; activeRows = []; 
        document.getElementById('score').innerText = "0";
        for(let i=0; i<5; i++) createRow(115 + (i * 25));
        
        setTimeout(() => { canClick = true; }, 500);
        requestAnimationFrame(gameLoop);
    });

    function createRow(bottomVal) {
        if(currentStep >= sheet.length) return;
        const data = sheet[currentStep];
        const rowEl = document.createElement('div'); rowEl.className = 'row'; rowEl.style.bottom = bottomVal + '%';
        const tileEl = document.createElement('div');
        tileEl.className = `tile ${data.isLong ? 'long' : ''}`;
        tileEl.style.left = (data.lane * 25) + '%';
        rowEl.appendChild(tileEl); gameArea.appendChild(rowEl);
        activeRows.push({ rowEl, tileEl, lane: data.lane, note: data.note, locked: false, isLong: data.isLong });
        currentStep++;
    }

    function gameLoop() {
        if (!isPlaying) return;
        for (let i = activeRows.length - 1; i >= 0; i--) {
            const row = activeRows[i];
            const currentBottom = parseFloat(row.rowEl.style.bottom);
            const newBottom = currentBottom - speed;
            row.rowEl.style.bottom = newBottom + "%";
            
            // 💖 F 대신 하트 깎임: 바닥을 놓쳤을 때
            if (newBottom < -15 && !row.locked) {
                row.locked = true; // 중복 깎임 방지
                loseLife(row); 
            }
        }
        speed += speedInc; // 설정된 난이도에 따라 가속
        requestAnimationFrame(gameLoop);
    }

    gameArea.addEventListener("pointerdown", (e) => {
        if (!isPlaying || !canClick || activeRows.length === 0) return;
        e.preventDefault();
        
        let bottomRow = null; let lowestPos = Infinity;
        activeRows.forEach(r => { if (!r.locked) { const b = parseFloat(r.rowEl.style.bottom); if (b < lowestPos) { lowestPos = b; bottomRow = r; } } });

        if (!bottomRow || lowestPos > 45) return;

        const rect = gameArea.getBoundingClientRect();
        const tx = (e.clientX || e.touches[0].clientX) - rect.left;
        let lane = Math.floor(tx / (rect.width / 4));
        lane = Math.max(0, Math.min(3, lane));

        if (lane === bottomRow.lane) {
            bottomRow.locked = true;
            // 피아노 풀 화음 재생 (소리 기능 그대로 유지)
            piano.triggerAttackRelease(bottomRow.note, "2n", undefined, 0.8 + Math.random()*0.2);
            bottomRow.tileEl.classList.add('pressed');
            createSpark(tx, (e.clientY || e.touches[0].clientY) - rect.top);
            
            score += bottomRow.isLong ? 3 : 1;
            document.getElementById('score').innerText = score;
            
            setTimeout(() => {
                bottomRow.rowEl.remove();
                activeRows = activeRows.filter(r => r !== bottomRow);
            }, 60);
            
            const topRow = activeRows[activeRows.length - 1];
            createRow((topRow ? parseFloat(topRow.rowEl.style.bottom) : 100) + (bottomRow.isLong ? 35 : 25));
        } else {
            // 💖 엉뚱한 곳 눌렀을 때도 F 대신 하트 깎임
            loseLife();
            
            // 빨간 엑스 표시 시각 효과
            const errTile = document.createElement('div');
            errTile.className = 'tile missed';
            errTile.style.left = (lane * 25) + '%';
            errTile.style.height = '100%';
            bottomRow.rowEl.appendChild(errTile);
            setTimeout(() => errTile.remove(), 300);
        }
    });

    function end(win) {
        if (!isPlaying) return; isPlaying = false;
        setTimeout(() => {
            gameArea.style.display = 'none'; document.getElementById('result').style.display = 'flex';
            document.getElementById('res-title').innerText = score > 100 ? "CONCERT FINISHED" : "GAME OVER";
            document.getElementById('rank').innerText = score > 1000 ? "SSS" : (score > 300 ? "S" : (score > 100 ? "A" : "B"));
            document.getElementById('final-score').innerText = `Final Score: ${score}`;
        }, 300);
    }
</script>
</body>
</html>
