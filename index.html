<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Piano Tiles Pro - Polyphony Master</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root { --neon: #00f2ff; --pink: #ff00ea; --gold: #ffea00; --bg: #050508; }
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { color: #fff; height: 100dvh; overflow: hidden; background: var(--bg); touch-action: manipulation; }

        .screen { position: absolute; top: 0; left: 50%; width: 100%; height: 100%; max-width: 500px; transform: translateX(-50%); display: none; flex-direction: column; background: var(--bg); border-left: 1px solid #111; border-right: 1px solid #111; }
        
        #lobby { display: flex; z-index: 100; padding: 30px 20px; align-items: center; justify-content: center; }
        .lobby-box { text-align: center; width: 100%; }
        h1 { font-size: 32px; font-weight: 900; background: linear-gradient(90deg, var(--neon), var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
        .desc { color: #aaa; font-size: 14px; margin-bottom: 30px; line-height: 1.5; }

        .song-box { background: rgba(255,255,255,0.05); border: 2px solid var(--neon); border-radius: 15px; padding: 20px; margin-bottom: 30px; text-align: center; }
        .song-box h2 { font-size: 20px; color: #fff; margin-bottom: 5px; }
        .song-box p { font-size: 12px; color: var(--gold); }
        
        #start-btn { width: 100%; padding: 20px; border-radius: 50px; border: none; font-size: 20px; font-weight: bold; background: #222; color: #555; transition: 0.3s; }
        #start-btn.ready { background: linear-gradient(45deg, var(--neon), var(--pink)); color: #fff; pointer-events: auto; box-shadow: 0 5px 20px rgba(255, 0, 234, 0.4); cursor: pointer;}

        #game { overflow: hidden; z-index: 50; touch-action: none; }
        .lane-bg { position: absolute; top: 0; width: 25%; height: 100%; border-right: 1px dashed rgba(255,255,255,0.1); pointer-events: none; }
        #hit-line { position: absolute; bottom: 15%; width: 100%; height: 4px; background: rgba(255,255,255,0.8); z-index: 5; box-shadow: 0 0 15px #fff; pointer-events: none; }
        
        #score { position: absolute; top: 40px; width: 100%; text-align: center; font-size: 50px; font-weight: 900; z-index: 60; text-shadow: 0 0 15px var(--neon); pointer-events: none; }
        #hp-container { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 150px; height: 8px; background: #333; border-radius: 4px; z-index: 60; pointer-events: none; }
        #hp-bar { width: 100%; height: 100%; background: #00ff00; transition: width 0.2s; border-radius: 4px; }
        #judgment { position: absolute; top: 45%; width: 100%; text-align: center; font-size: 45px; font-weight: 900; z-index: 70; opacity: 0; pointer-events: none; transition: 0.1s; }

        .tile { position: absolute; width: 24%; margin-left: 0.5%; border-radius: 8px; background: linear-gradient(to bottom, #fff, var(--neon)); z-index: 10; cursor: pointer; box-shadow: inset 0 0 10px rgba(0,242,255,0.5);}
        .tile.long { background: linear-gradient(to bottom, #fff, var(--gold)); box-shadow: inset 0 0 10px rgba(255,234,0,0.5); }
        .tile.pressed { opacity: 0.2; transform: scale(1.05); transition: 0.1s; box-shadow: 0 0 40px #fff; }
        .tile.missed { background: #ff0055 !important; opacity: 0.4; }

        #result { justify-content: center; align-items: center; text-align: center; z-index: 200; background: rgba(0,0,0,0.95); }
    </style>
</head>
<body>

<div id="lobby" class="screen" style="display: flex;">
    <div class="lobby-box">
        <h1>TRUE CHORD PRO</h1>
        <p class="desc">단선율은 잊으세요.<br>왼손 베이스와 웅장한 화음이 함께 연주됩니다.</p>
        
        <div class="song-box">
            <h2>🎵 캐논 변주곡 (Canon in D)</h2>
            <p>다성부 화음 완벽 복원 버전</p>
        </div>

        <button id="start-btn">피아노 로딩 중...</button>
    </div>
</div>

<div id="game" class="screen">
    <div id="hp-container"><div id="hp-bar"></div></div>
    <div id="score">0</div>
    <div id="judgment"></div>
    <div id="hit-line"></div>
    <div class="lane-bg" style="left:0%"></div><div class="lane-bg" style="left:25%"></div><div class="lane-bg" style="left:50%"></div><div class="lane-bg" style="left:75%; border:none;"></div>
</div>

<div id="result" class="screen">
    <h2 id="res-title" style="font-size:32px;">연주 완료</h2>
    <div id="rank" style="font-size:90px; font-weight:900; color:var(--gold); margin: 20px 0;">S</div>
    <div id="final-score" style="font-size:22px; margin-bottom: 40px; color:#ccc;">Score: 0</div>
    <button onclick="location.reload()" style="padding: 18px 50px; border-radius: 40px; border: none; font-size: 20px; font-weight: bold; background:#fff; cursor: pointer; color: #000;">다시 하기</button>
</div>

<script>
    // 🎼 지피티 조언 100% 반영: 화음(+)과 베이스 라인이 섞인 진짜 악보 데이터!
    // 구조: 베이스음+화음1+화음2+멜로디_길이
    const canonChordData = "D3+D4+F#4+A4_0.5,A2+C#4+E4+A4_0.5,B2+D4+F#4+B4_0.5,F#2+C#4+F#4+A4_0.5,G2+D4+G4+B4_0.5,D3+A3+D4+F#4_0.5,G2+D4+G4+B4_0.5,A2+C#4+E4+A4_0.5,D3+D4+F#4+D5_0.25,A2+C#4+E4+C#5_0.25,B2+D4+F#4+B4_0.25,F#2+C#4+F#4+A4_0.25,G2+D4+G4+G4_0.25,D3+A3+D4+F#4_0.25,G2+D4+G4+E4_0.25,A2+C#4+E4+D4_0.25,D3+D4+F#4+A4_0.5,A2+C#4+E4+A4_0.5,B2+D4+F#4+B4_0.5,F#2+C#4+F#4+A4_0.5,G2+D4+G4+B4_0.5,D3+A3+D4+F#4_0.5,G2+D4+G4+B4_0.5,A2+C#4+E4+A4_0.5";

    let piano, sheet = [], tiles = [], isPlaying = false, score = 0, hp = 100, sheetIdx = 0;
    const LOOKAHEAD = 1.6; 
    let hitLineY, isLoaded = false;

    // 화음을 소화하려면 PolySynth를 배열 형식으로 받게 해야 함.
    // 여러 음이 동시에 울려도 찢어지지 않게 볼륨 밸런스(-12) 세팅 완료.
    piano = new Tone.PolySynth(Tone.Synth, {
        volume: -12,
        oscillator: { type: "triangle" },
        envelope: { attack: 0.02, decay: 0.1, sustain: 0.3, release: 1.2 } // 잔향(release)을 늘려 피아노처럼 울리게 함
    }).toDestination();

    function setReady() {
        if(isLoaded) return;
        isLoaded = true;
        const btn = document.getElementById('start-btn');
        btn.innerText = "콘서트 시작!"; 
        btn.classList.add('ready');
    }
    setReady();

    // 🌟 파싱 엔진 업그레이드: 화음(+) 기호를 배열로 쪼개서 저장
    function parseChordSheet(songStr) {
        const noteArray = [];
        let time = 1.0;
        let lane = 0;
        const items = songStr.split(',');
        
        // 캐논을 3번 변주하며 반복(약 1분 분량)
        for(let loop = 0; loop < 3; loop++) {
            for(let item of items) {
                if(!item) continue;
                const [noteStr, dur] = item.split('_');
                
                // "D3+D4+F#4+A4" -> ["D3", "D4", "F#4", "A4"] 배열로 변환
                const notes = noteStr.split('+'); 
                
                lane = (lane + 1) % 4;
                
                noteArray.push({ 
                    t: time, 
                    l: lane, 
                    n: notes, // 이제 단일 문자열이 아니라 '배열'이 들어감!
                    d: parseFloat(dur) 
                });
                time += parseFloat(dur);
            }
        }
        return noteArray;
    }

    const gameArea = document.getElementById('game');

    document.getElementById('start-btn').addEventListener('pointerdown', async () => {
        if(!isLoaded) return;
        await Tone.start();
        document.getElementById('lobby').style.display = 'none';
        gameArea.style.display = 'block';
        
        hitLineY = gameArea.offsetHeight * 0.85;

        // 화음 악보 파싱
        sheet = parseChordSheet(canonChordData);
        isPlaying = true; score = 0; hp = 100; sheetIdx = 0; tiles = [];
        document.getElementById('score').innerText = "0";
        updateHP();
        
        Tone.Transport.stop();
        Tone.Transport.seconds = 0;
        Tone.Transport.start();
        requestAnimationFrame(loop);
    });

    function showJudg(txt, col) {
        const j = document.getElementById('judgment');
        j.innerText = txt; j.style.color = col; j.style.opacity = 1;
        j.style.transform = "scale(1.1)";
        setTimeout(() => { j.style.opacity = 0; j.style.transform = "scale(1)"; }, 250);
    }

    function updateHP() {
        const hpBar = document.getElementById('hp-bar');
        hpBar.style.width = `${hp}%`;
        hpBar.style.background = hp > 60 ? "#00ff00" : (hp > 30 ? "#ffea00" : "#ff0055");
    }

    function loop() {
        if(!isPlaying) return;
        const now = Tone.Transport.seconds;
        const speed = hitLineY / LOOKAHEAD;

        while(sheetIdx < sheet.length && sheet[sheetIdx].t < now + LOOKAHEAD) {
            const data = sheet[sheetIdx++];
            const el = document.createElement('div');
            
            const h = Math.max(120, data.d * speed * 0.8);
            const isLong = data.d >= 0.5;
            
            el.className = `tile ${isLong ? 'long' : ''}`;
            el.style.left = (data.l * 25) + '%';
            el.style.height = h + 'px';
            el.style.top = "-500px";
            
            const obj = { el, data, h, hit: false, miss: false };
            
            el.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                if(obj.hit || obj.miss) return;

                const rect = el.getBoundingClientRect();
                const gameRect = gameArea.getBoundingClientRect();
                const tileTop = rect.top - gameRect.top;
                const tileBottom = rect.bottom - gameRect.top;
                
                // 터치 판정
                if (tileBottom > hitLineY - 150 && tileTop < hitLineY + 150) {
                    
                    // 🌟 마법의 코드: Tone.js는 배열(data.n)을 주면 화음을 동시에 울려줍니다!
                    piano.triggerAttackRelease(data.n, data.d);
                    
                    obj.hit = true; 
                    el.classList.add('pressed');
                    
                    const dist = Math.abs(tileBottom - hitLineY);
                    const isPerfect = dist < 70;
                    
                    score += (isLong ? 30 : (isPerfect ? 20 : 10)); 
                    hp = Math.min(100, hp + 3);
                    document.getElementById('score').innerText = score;
                    
                    showJudg(isPerfect ? "PERFECT" : "GOOD", isPerfect ? "var(--neon)" : "#fff");
                    updateHP();
                }
            });
            gameArea.appendChild(el);
            tiles.push(obj);
        }

        for(let i = tiles.length - 1; i >= 0; i--) {
            const o = tiles[i];
            const bottom = hitLineY - (o.data.t - now) * speed;
            o.el.style.top = (bottom - o.h) + "px";

            if(!o.hit && !o.miss && (o.data.t - now) < -0.2) {
                o.miss = true; o.el.classList.add('missed');
                hp -= 15; score = Math.max(0, score - 15);
                document.getElementById('score').innerText = score;
                showJudg("MISS", "#ff0055");
                updateHP();
                if(hp <= 0) end(false);
            }
            
            if(bottom - o.h > gameArea.offsetHeight + 100) { 
                o.el.remove(); 
                tiles.splice(i, 1); 
            }
        }

        if(sheetIdx >= sheet.length && tiles.length === 0) end(true);
        else requestAnimationFrame(loop);
    }

    function end(win) {
        isPlaying = false; Tone.Transport.stop();
        gameArea.style.display = 'none';
        document.getElementById('result').style.display = 'flex';
        document.getElementById('res-title').innerText = win ? "STAGE CLEAR!" : "GAME OVER";
        document.getElementById('rank').innerText = win ? (score > 1000 ? "SSS" : "S") : "F";
        document.getElementById('final-score').innerText = `Score: ${score}`;
    }
</script>
</body>
</html>
