<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Piano Tiles - V23 Masterpiece</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root { --neon: #00f2ff; --pink: #ff00ea; --gold: #ffea00; }
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { color: #000; height: 100dvh; overflow: hidden; background: #fff; touch-action: none; }
        .screen { position: absolute; top: 0; left: 50%; width: 100%; height: 100%; max-width: 500px; transform: translateX(-50%); display: none; flex-direction: column; background: #fff; border-left: 1px solid #ddd; border-right: 1px solid #ddd; }
        
        #lobby { display: flex; z-index: 100; padding: 25px; background: #050508; color: #fff; }
        h1 { text-align: center; font-size: 28px; font-weight: 900; background: linear-gradient(90deg, var(--neon), var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; padding: 15px 0; }
        #song-list { flex: 1; overflow-y: auto; background: rgba(255,255,255,0.03); border-radius: 20px; padding: 10px; margin-bottom: 20px; border: 1px solid #222; }
        .song-item { padding: 15px; border-bottom: 1px solid #222; border-radius: 12px; margin-bottom: 8px; cursor: pointer; background: rgba(255,255,255,0.02); }
        .song-item.active { background: rgba(0,242,255,0.15); border: 1px solid var(--neon); }
        #start-btn { width: 100%; padding: 20px; border-radius: 50px; border: none; font-size: 18px; font-weight: 900; background: linear-gradient(45deg, var(--neon), var(--pink)); color: #fff; cursor: pointer; }
        
        #game { overflow: hidden; z-index: 50; position: relative; background: #fff; }
        .lane-line { position: absolute; top: 0; width: 25%; height: 100%; border-right: 1px solid #ddd; pointer-events: none; }
        #score { position: absolute; top: 30px; width: 100%; text-align: center; font-size: 60px; font-weight: 900; z-index: 60; color: #ff0055; pointer-events: none; text-shadow: 2px 2px 0#fff, -2px -2px 0#fff; }
        
        /* 타일이 내려오는 애니메이션 */
        .row { position: absolute; width: 100%; height: 25%; transition: bottom 0.12s ease-out; }
        .tile { position: absolute; width: 25%; height: 100%; background: #111; border: 1px solid #000; box-shadow: inset 0 -5px 10px rgba(255,255,255,0.2); cursor: pointer; }
        .tile.pressed { background: #bbb !important; box-shadow: none; }
        .tile.missed { background: #ff0055 !important; animation: blink 0.2s infinite; }
        
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        #result { justify-content: center; align-items: center; text-align: center; z-index: 200; background: rgba(0,0,0,0.95); color: #fff; }
    </style>
</head>
<body>

<div id="lobby" class="screen" style="display: flex;">
    <h1>V23 MASTERPIECE</h1>
    <div id="song-list"></div>
    <button id="start-btn">그랜드 피아노 조율 중...</button>
</div>

<div id="game" class="screen">
    <div class="lane-line" style="left:0%"></div>
    <div class="lane-line" style="left:25%"></div>
    <div class="lane-line" style="left:50%"></div>
    <div class="lane-line" style="left:75%; border:none;"></div>
    <div id="score">0</div>
</div>

<div id="result" class="screen">
    <h2 id="res-title">PERFECT!</h2>
    <div id="rank" style="font-size:100px; font-weight:900; color:var(--gold);">S</div>
    <div id="final-score">Score: 0</div>
    <button onclick="location.reload()" style="padding: 15px 50px; border-radius: 50px; background:#fff; font-size: 18px; font-weight: bold; color: #000; cursor: pointer;">다시 도전</button>
</div>

<script>
    // 🎹 12곡 완벽 복원 (드레 박사 힙합부터 라흐마니노프까지)
    const songs = [
        { t: "Piano Concerto No.2", a: "Rachmaninoff", p: "C4,Eb4,G4,C5,G4,Eb4,C4,G3" },
        { t: "Swan Lake", a: "Tchaikovsky", p: "A4,E5,D5,C5,B4,A4,B4,C5" },
        { t: "Winter Wind", a: "Chopin", p: "E4,E4,F4,E4,A4,G#4,A4,C5,B4,C5,E5" },
        { t: "Purple Rain", a: "Prince", p: "Bb3,F4,G4,F4,Bb3,F4,G4,F4" },
        { t: "Still D.R.E.", a: "Dr. Dre", p: "E5,E5,E5,E5,E5,E5,E5,B4,B4,B4,B4" },
        { t: "No Scrubs", a: "TLC", p: "G#4,F#4,E4,F#4,G#4,G#4,G#4" },
        { t: "Honey", a: "L'Arc-en-Ciel", p: "E4,F#4,G#4,A4,B4,A4,G#4,F#4" },
        { t: "For Tomorrow", a: "Blur", p: "G4,A4,B4,D5,B4,A4,G4,E4" },
        { t: "Canon in D", a: "Pachelbel", p: "F#5,E5,D5,C#5,B4,A4,B4,C#5" },
        { t: "River Flows in You", a: "Yiruma", p: "F#4,E4,F#4,C#4,F#4,E4,F#4,C#4" },
        { t: "Nocturne Op.9 No.2", a: "Chopin", p: "G4,G5,F5,G5,Eb5,D5,C5,Bb4" },
        { t: "Take On Me", a: "a-ha", p: "F#5,F#5,D5,B4,B4,E5,E5,E5,G#5,G#5" }
    ];

    let piano, sheet = [], activeRows = [];
    let isPlaying = false, score = 0, currentStep = 0, selected = 0, canClick = false;
    const gameArea = document.getElementById('game');

    // 🎧 오디오 업그레이드: 콘서트홀 리버브 적용
    const reverb = new Tone.Reverb({ decay: 4, wet: 0.35 }).toDestination();
    
    piano = new Tone.Sampler({
        urls: {
            A0: "A0.mp3", C1: "C1.mp3", "D#1": "Ds1.mp3", "F#1": "Fs1.mp3",
            A1: "A1.mp3", C2: "C2.mp3", "D#2": "Ds2.mp3", "F#2": "Fs2.mp3",
            A2: "A2.mp3", C3: "C3.mp3", "D#3": "Ds3.mp3", "F#3": "Fs3.mp3",
            A3: "A3.mp3", C4: "C4.mp3", "D#4": "Ds4.mp3", "F#4": "Fs4.mp3",
            A4: "A4.mp3", C5: "C5.mp3", "D#5": "Ds5.mp3", "F#5": "Fs5.mp3",
            A5: "A5.mp3", C6: "C6.mp3", "D#6": "Ds6.mp3", "F#6": "Fs6.mp3",
            A6: "A6.mp3", C7: "C7.mp3", A7: "A7.mp3", C8: "C8.mp3"
        },
        release: 2,
        baseUrl: "https://tonejs.github.io/audio/salamander/",
        onload: () => { document.getElementById('start-btn').innerText = "게임 시작"; }
    }).connect(reverb);

    function renderSongs() {
        const listDiv = document.getElementById('song-list');
        listDiv.innerHTML = "";
        songs.forEach((s, idx) => {
            const item = document.createElement('div');
            item.className = `song-item ${idx === selected ? 'active' : ''}`;
            item.innerHTML = `<strong>${s.t}</strong><br><small style="color:#aaa">${s.a}</small>`;
            item.onclick = () => { selected = idx; renderSongs(); };
            listDiv.appendChild(item);
        });
    }
    renderSongs();

    // 🎼 왼손 자동 생성 시스템 (웅장함 추가)
    function playWithLeftHand(note) {
        const velocity = 0.8 + Math.random() * 0.2;
        piano.triggerAttackRelease(note, "8n", undefined, velocity);
        
        try {
            const leftNote = Tone.Frequency(note).transpose(-12).toNote();
            const fifth = Tone.Frequency(note).transpose(-7).toNote();
            piano.triggerAttackRelease([leftNote, fifth], "8n", "+0.02", velocity - 0.2);
        } catch(e) {
            // 주파수 변환 에러 대비 안전장치
        }
    }

    document.getElementById('start-btn').addEventListener('click', async (e) => {
        e.stopPropagation();
        if (isPlaying || document.getElementById('start-btn').innerText.includes("조율")) return;
        
        await Tone.start();
        document.getElementById('lobby').style.display = 'none';
        gameArea.style.display = 'block';

        const song = songs[selected];
        sheet = [];
        const notes = song.p.split(',');
        for(let i=0; i<80; i++) {
            sheet.push({ lane: Math.floor(Math.random()*4), note: notes[i % notes.length] });
        }

        isPlaying = true; score = 0; currentStep = 0; activeRows = []; canClick = false;
        document.getElementById('score').innerText = "0";
        
        for(let i=0; i<5; i++) createRow(i);
        setTimeout(() => { canClick = true; }, 100);
    });

    function createRow(offset) {
        const sheetIdx = currentStep + offset;
        if(sheetIdx >= sheet.length) return; 

        const data = sheet[sheetIdx];
        const rowEl = document.createElement('div');
        rowEl.className = 'row';
        rowEl.style.bottom = (offset * 25) + '%'; 

        const tileEl = document.createElement('div');
        tileEl.className = 'tile';
        tileEl.style.left = (data.lane * 25) + '%';
        
        const rowObj = { rowEl, tileEl, lane: data.lane, note: data.note, locked: false };
        activeRows.push(rowObj);

        // 🔥 핵심 변경점: 수학 계산 폐기! 검은 타일 자체에 터치 센서 부착
        tileEl.addEventListener("pointerdown", (e) => {
            e.preventDefault();
            e.stopPropagation(); // 배경(빈 공간) 클릭으로 넘어가지 않게 방지
            handleCorrectTap(rowObj);
        });
        
        rowEl.appendChild(tileEl);
        gameArea.appendChild(rowEl);
    }

    // 🔥 정답 타일을 눌렀을 때의 처리
    function handleCorrectTap(clickedRowObj) {
        if (!isPlaying || !canClick || clickedRowObj.locked) return;

        // 화면에서 가장 아래에 있는 타일인지 확인
        activeRows.sort((a, b) => parseFloat(a.rowEl.style.bottom) - parseFloat(b.rowEl.style.bottom));
        const bottomRow = activeRows[0];

        // 가장 아래 타일이 맞다면 통과!
        if (clickedRowObj === bottomRow) {
            bottomRow.locked = true;
            playWithLeftHand(bottomRow.note); // 풍부한 사운드 재생
            bottomRow.tileEl.classList.add('pressed');
            
            score++;
            document.getElementById('score').innerText = score;
            
            const removedRow = activeRows.shift();
            setTimeout(() => removedRow.rowEl.remove(), 80);
            
            // 나머지 타일들을 아래로 이동 (여기서 애니메이션 발생)
            activeRows.forEach((r, idx) => {
                r.rowEl.style.bottom = (idx * 25) + '%'; 
            });
            
            currentStep++;
            createRow(4);

            if(currentStep >= sheet.length && activeRows.length === 0) {
                setTimeout(() => end(true), 300);
            }
        } else {
            // 순서가 틀린 검은 타일을 눌렀을 때
            failGame(clickedRowObj.lane, bottomRow);
        }
    }

    // 🔥 빈 공간(흰색)을 눌렀을 때의 처리
    gameArea.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        if (!isPlaying || !canClick || activeRows.length === 0) return;
        
        // 타일이 아닌 빈 배경을 누르면 즉시 F
        const rect = gameArea.getBoundingClientRect();
        const touchX = e.clientX - rect.left;
        let clickedLane = Math.floor(touchX / (rect.width / 4));
        clickedLane = Math.max(0, Math.min(3, clickedLane));
        
        failGame(clickedLane, activeRows[0]);
    });

    function failGame(clickedLane, bottomRow) {
        if (!isPlaying) return;
        const errTile = document.createElement('div');
        errTile.className = 'tile missed';
        errTile.style.left = (clickedLane * 25) + '%';
        if(bottomRow && bottomRow.rowEl) {
            bottomRow.rowEl.appendChild(errTile);
        }
        end(false);
    }

    function end(win) {
        if (!isPlaying) return;
        isPlaying = false;
        setTimeout(() => {
            gameArea.style.display = 'none';
            document.getElementById('result').style.display = 'flex';
            document.getElementById('res-title').innerText = win ? "PERFECT!" : "GAME OVER";
            document.getElementById('rank').innerText = win ? "SSS" : (score > 60 ? "S" : (score > 30 ? "A" : "F"));
            document.getElementById('final-score').innerText = `Score: ${score}`;
        }, 400);
    }
</script>
</body>
</html>
