<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Piano Tiles - Pure MIDI Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root { --neon: #00f2ff; --pink: #ff00ea; --gold: #ffea00; --bg: #050508; }
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { color: #fff; height: 100dvh; overflow: hidden; background: var(--bg); }
        
        button { touch-action: manipulation; }

        .screen { position: absolute; top: 0; left: 50%; width: 100%; height: 100%; max-width: 500px; transform: translateX(-50%); display: none; flex-direction: column; background: var(--bg); border-left: 1px solid #111; border-right: 1px solid #111; }
        
        #lobby { display: flex; z-index: 100; padding: 20px; }
        h1 { text-align: center; font-size: 28px; font-weight: 900; background: linear-gradient(90deg, var(--neon), var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; padding: 5px 0; }
        .desc { text-align: center; color: #aaa; font-size: 13px; margin-bottom: 15px; }

        .diff-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .diff-btn { flex: 1; padding: 12px; background: #111; border: 1px solid #333; border-radius: 8px; color: #888; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .diff-btn.active { background: var(--pink); color: #fff; border-color: #fff; box-shadow: 0 0 10px var(--pink); }

        #song-list { flex: 1; overflow-y: auto; background: rgba(255,255,255,0.02); border-radius: 15px; padding: 10px; margin-bottom: 10px; }
        .song-item { padding: 14px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; border-radius: 10px; margin-bottom: 5px; cursor: pointer; }
        .song-item.active { background: rgba(0, 242, 255, 0.15); border: 1px solid var(--neon); }
        .song-title { font-size: 15px; font-weight: bold; }
        .song-artist { font-size: 11px; color: var(--gold); margin-top: 3px; }
        
        #start-btn { width: 100%; padding: 18px; border-radius: 50px; border: none; font-size: 18px; font-weight: bold; background: #222; color: #555; transition: 0.3s; }
        #start-btn.ready { background: linear-gradient(45deg, var(--neon), var(--pink)); color: #fff; pointer-events: auto; box-shadow: 0 5px 20px rgba(255, 0, 234, 0.4); cursor: pointer;}

        #game { overflow: hidden; z-index: 50; position: relative; touch-action: none; }
        
        .lane-bg { position: absolute; top: 0; width: 25%; height: 100%; border-right: 1px dashed rgba(255,255,255,0.1); pointer-events: none; }
        #hit-line { position: absolute; bottom: 15%; width: 100%; height: 4px; background: rgba(255,255,255,0.8); z-index: 5; box-shadow: 0 0 15px #fff; pointer-events: none; }
        
        #score { position: absolute; top: 40px; width: 100%; text-align: center; font-size: 50px; font-weight: 900; z-index: 60; text-shadow: 0 0 15px var(--neon); pointer-events: none; }
        #hp-container { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 150px; height: 6px; background: #333; border-radius: 3px; z-index: 60; pointer-events: none; }
        #hp-bar { width: 100%; height: 100%; background: #00ff00; transition: width 0.2s; }
        #judgment { position: absolute; top: 45%; width: 100%; text-align: center; font-size: 45px; font-weight: 900; z-index: 70; opacity: 0; pointer-events: none; transition: 0.1s; }

        .tile { position: absolute; width: 24%; margin-left: 0.5%; border-radius: 6px; background: linear-gradient(to bottom, #fff, var(--neon)); z-index: 10; pointer-events: none; }
        .tile.long { background: linear-gradient(to bottom, #fff, var(--gold)); box-shadow: 0 0 15px var(--gold); }
        .tile.pressed { opacity: 0.2; transform: scale(1.05); transition: 0.1s; box-shadow: 0 0 40px #fff; }
        .tile.missed { background: #ff0055 !important; opacity: 0.5; }

        #result { justify-content: center; align-items: center; text-align: center; z-index: 200; background: rgba(0,0,0,0.95); }
    </style>
</head>
<body>

<div id="lobby" class="screen" style="display: flex;">
    <h1>PURE MIDI TEST</h1>
    <p class="desc">이펙터 0% / 원초적인 디지털 톤 실험</p>
    
    <div class="diff-group">
        <button class="diff-btn" data-diff="easy">하 (Easy)</button>
        <button class="diff-btn active" data-diff="normal">중 (Normal)</button>
        <button class="diff-btn" data-diff="hard">상 (Hard)</button>
    </div>

    <div id="song-list"></div>
    <button id="start-btn" class="ready">게임 시작!</button>
</div>

<div id="game" class="screen">
    <div id="hp-container"><div id="hp-bar"></div></div>
    <div id="score">0</div>
    <div id="judgment"></div>
    <div id="hit-line"></div>
    <div class="lane-bg" style="left:0%"></div><div class="lane-bg" style="left:25%"></div><div class="lane-bg" style="left:50%"></div><div class="lane-bg" style="left:75%; border:none;"></div>
</div>

<div id="result" class="screen">
    <h2 id="res-title" style="font-size:28px;">STAGE CLEAR</h2>
    <div id="rank" style="font-size:90px; font-weight:900; color:var(--gold); margin: 20px 0;">S</div>
    <div id="final-score" style="font-size:20px; margin-bottom: 30px; color:#aaa;">Score: 0</div>
    <button onclick="location.reload()" style="padding: 15px 40px; border-radius: 30px; border: none; font-weight: bold; background:#fff; cursor: pointer; font-size: 18px;">로비로 돌아가기</button>
</div>

<script>
    const songs = [
        { t: "Canon in D", a: "Pachelbel", parts: { A: "F#5+D3_0.5,E5+A2_0.5,D5+B2_0.5,C#5+F#2_0.5,B4+G2_0.5,A4+D3_0.5,B4+G2_0.5,C#5+A2_0.5", B: "D5+D3_0.25,C#5_0.25,D5_0.25,D4_0.25,E4+A2_0.25,F#4_0.25,G4_0.25,A4_0.25,B4+B2_0.25,A4_0.25,G4_0.25,F#4_0.25,E4+F#2_0.25,D4_0.25,E4_0.25,F#4_0.25", C: "G4+G2_0.25,F#4_0.25,E4_0.25,D4_0.25,C#4+D3_0.25,B3_0.25,A3_0.25,G3_0.25,F#3+G2_0.25,E3_0.25,D3_0.25,E3_0.25,F#3+A2_0.25,G3_0.25,A3_0.25,B3_0.25", D: "D5+D3_0.5,F#5_0.5,A5+A2_0.5,G5_0.5,F#5+B2_0.5,D5_0.5,F#5+F#2_0.5,E5_0.5,D5+G2_0.5,B4_0.5,D5+D3_0.5,A4_0.5,G4+G2_0.5,B4_0.5,A4+A2_0.5,C#5_0.5" }, seq: "A,A,B,B,C,C,D,D,B,A" },
        { t: "Take On Me", a: "a-ha", parts: { A: "F#5+B3_0.2,F#5_0.2,D5_0.2,B4_0.2,B4+E3_0.4,E5_0.2,E5_0.2,E5_0.2,G#5+A3_0.2,G#5_0.2,A5_0.2,B5_0.2,A5+D3_0.2,A5_0.2,A5_0.2,E5_0.2,D5_0.2,F#5+B3_0.2,F#5_0.2,F#5_0.2,E5_0.2,E5_0.2,F#5_0.2,E5_0.2", B: "A4+D3_0.4,A4_0.4,E4_0.4,F#4_0.4,G#4+E3_0.8,A4+D3_0.4,A4_0.4,E4_0.4,F#4_0.4,G#4+E3_0.8", C: "B4+B2_0.3,B4_0.3,E5_0.4,C#5+A2_0.4,C#5_0.3,G#4+E2_0.8,G#4_0.3,C#5+D3_0.4,C#5_0.4,C#5_0.4,E5_0.4,E5_0.4,E5_0.4,B4+B2_1.2", D: "A4+D3_0.4,B4_0.4,C#5_0.4,D5_0.4,E5+A2_0.8,D5_0.4,C#5_0.4,B4+E3_1.6" }, seq: "A,A,B,B,C,C,D,A,A" },
        { t: "겨울바람", a: "쇼팽", parts: { A: "E4+A2_0.5,E4_0.5,F4_0.5,E4_0.5,A4+A2_1.0,G#4_0.5,A4_0.5,C5+A2_1.0,B4_0.5,C5_0.5,E5+A2_1.5", B: "A5+A2_0.15,G#5_0.15,A5_0.15,F5_0.15,E5+E2_0.15,D#5_0.15,E5_0.15,C5_0.15,B4+B2_0.15,A#4_0.15,B4_0.15,G4_0.15,F4+F2_0.15,E4_0.15,F4_0.15,D4_0.15", C: "C4+A2_0.15,B3_0.15,C4_0.15,A3_0.15,G#3+E2_0.15,G3_0.15,G#3_0.15,E3_0.15,A4+A2_0.15,B4_0.15,C5_0.15,D5_0.15,E5+E2_0.15,F5_0.15,G5_0.15,A5_0.15", D: "C6+A2_0.15,B5_0.15,C6_0.15,A5_0.15,G#5+E2_0.15,G5_0.15,G#5_0.15,E5_0.15,C5+A2_0.15,B4_0.15,C5_0.15,A4_0.15,E4+E2_0.15,D#4_0.15,E4_0.15,C4_0.15" }, seq: "A,B,C,B,D,C,B,D,A" }
    ];

    let piano, sheet = [], tiles = [], isPlaying = false, score = 0, hp = 100, sheetIdx = 0, selected = 0;
    let difficulty = "normal", speedMult = 1.0, hitLineY;
    const gameArea = document.getElementById('game');

    // 🔥 모든 이펙트(Reverb, Compressor, EQ) 제거! 순수 신디사이저의 민낯!
    // 지피티가 제안한 Square 파형 채택 (옛날 오락기, 피쳐폰 벨소리의 그 질감)
    piano = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "square" }, // 아주 거칠고 디지털적인 기본 파형
        envelope: { 
            attack: 0.001, // 누르는 즉시
            decay: 0.1, 
            sustain: 0.1, 
            release: 0.1   // 떼자마자 칼같이 끊김
        },
        volume: -8
    }).toDestination(); // 스피커로 바로 직결!

    function renderSongs() {
        const listDiv = document.getElementById('song-list');
        listDiv.innerHTML = ""; 
        songs.forEach((s, idx) => {
            const item = document.createElement('div');
            item.className = `song-item ${idx === selected ? 'active' : ''}`;
            item.innerHTML = `<div><div class="song-title">${s.t}</div><div class="song-artist">Pure Square MIDI Test</div></div>`;
            item.onclick = () => { selected = idx; renderSongs(); };
            listDiv.appendChild(item);
        });
    }
    renderSongs();

    document.querySelectorAll('.diff-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            difficulty = e.target.getAttribute('data-diff');
        });
    });

    // 화성 유지 파싱
    function parseSheet(songObj) {
        const noteArray = [];
        let time = 1.0;
        const sequence = songObj.seq.split(',');

        for (let partKey of sequence) {
            if (time > 90) break;
            const partStr = songObj.parts[partKey];
            if (!partStr) continue;

            const items = partStr.split(',');
            for (let item of items) {
                if (!item) continue;
                
                const [noteStr, durStr] = item.split('_');
                const dur = parseFloat(durStr);
                const notes = noteStr.split('+'); 

                notes.sort((a, b) => Tone.Frequency(b).toMidi() - Tone.Frequency(a).toMidi());
                const playNotes = notes.slice(0, 2); 

                const midi = Tone.Frequency(playNotes[0]).toMidi();
                let lane = isNaN(midi) ? Math.floor(Math.random() * 4) : midi % 4;
                
                noteArray.push({ t: time, l: lane, n: playNotes, d: dur });
                time += dur;
            }
        }
        return noteArray;
    }

    document.getElementById('start-btn').addEventListener('pointerdown', async () => {
        await Tone.start(); // 로딩 체크(isLoaded) 필요 없음. 즉시 실행!
        
        if (difficulty === "easy") speedMult = 0.7;
        else if (difficulty === "hard") speedMult = 1.5;
        else speedMult = 1.0;

        Tone.Transport.playbackRate = speedMult;

        document.getElementById('lobby').style.display = 'none';
        gameArea.style.display = 'block';
        hitLineY = gameArea.offsetHeight * 0.85;

        sheet = parseSheet(songs[selected]);
        isPlaying = true; score = 0; hp = 100; sheetIdx = 0; tiles = [];
        document.getElementById('score').innerText = "0";
        updateHP();
        
        Tone.Transport.cancel(0); 
        Tone.Transport.stop();
        Tone.Transport.seconds = 0;
        Tone.Transport.start();
        requestAnimationFrame(loop);
    });

    function showJudg(txt, col) {
        const j = document.getElementById('judgment');
        j.innerText = txt; j.style.color = col; j.style.opacity = 1;
        j.style.transform = "scale(1.1)";
        setTimeout(() => { j.style.opacity = 0; j.style.transform = "scale(1)"; }, 200);
    }

    function updateHP() {
        const hpBar = document.getElementById('hp-bar');
        hpBar.style.width = `${hp}%`;
        hpBar.style.background = hp > 60 ? "#00ff00" : (hp > 30 ? "#ffea00" : "#ff0055");
    }

    gameArea.addEventListener("pointerdown", (e) => {
        if (!isPlaying) return;

        const rect = gameArea.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const lane = Math.floor(x / (rect.width / 4));
        const now = Tone.Transport.seconds;

        let hitSomething = false;

        for (let i = 0; i < tiles.length; i++) {
            const o = tiles[i];
            if (o.hit || o.miss) continue;
            if (o.data.l !== lane) continue; 

            const diff = Math.abs(o.data.t - now);

            if (diff < 0.22) { 
                
                // 🔥 오리지널 실험: 악보 길이 무시하고 무조건 0.1초 동안만 재생!
                piano.triggerAttackRelease(o.data.n, 0.1, Tone.now(), 1);
                
                o.hit = true;
                o.el.classList.add("pressed");

                score += 20;
                hp = Math.min(100, hp + 3);
                document.getElementById('score').innerText = score;
                showJudg(diff < 0.08 ? "PERFECT" : "GOOD", "var(--neon)");
                updateHP();
                
                hitSomething = true;
                break; 
            }
        }

        if (!hitSomething) {
            hp -= 10;
            updateHP();
        }
    });

    function loop() {
        if(!isPlaying) return;
        const now = Tone.Transport.seconds; 
        const LOOKAHEAD = 1.2; 
        const speed = hitLineY / LOOKAHEAD;

        while(sheetIdx < sheet.length && sheet[sheetIdx].t < now + LOOKAHEAD) {
            const data = sheet[sheetIdx++];
            const el = document.createElement('div');
            
            const visualDur = data.d * 1.4; 
            const h = Math.max(100, visualDur * speed * 0.8);
            const isLong = data.d >= 0.6; 
            
            el.className = `tile ${isLong ? 'long' : ''}`;
            el.style.left = (data.l * 25) + '%';
            el.style.height = h + 'px';
            el.style.top = "-500px";
            
            const obj = { el, data, h, hit: false, miss: false };
            gameArea.appendChild(el);
            tiles.push(obj);
        }

        for(let i = tiles.length - 1; i >= 0; i--) {
            const o = tiles[i];
            const bottom = hitLineY - (o.data.t - now) * speed;
            o.el.style.top = (bottom - o.h) + "px";

            if(!o.hit && !o.miss && (o.data.t - now) < -0.2) {
                o.miss = true; 
                o.el.classList.add('missed');
                hp -= 15; score = Math.max(0, score - 15);
                document.getElementById('score').innerText = score;
                showJudg("MISS", "#ff0055");
                updateHP();
                if(hp <= 0) end(false);
            }
            
            if(bottom - o.h > gameArea.offsetHeight + 100) { 
                o.el.remove(); 
                tiles.splice(i, 1); 
            }
        }

        if(sheetIdx >= sheet.length && tiles.length === 0) end(true);
        else requestAnimationFrame(loop);
    }

    function end(win) {
        isPlaying = false; Tone.Transport.stop(); Tone.Transport.cancel(0);
        gameArea.style.display = 'none';
        document.getElementById('result').style.display = 'flex';
        document.getElementById('res-title').innerText = win ? "STAGE CLEAR!" : "GAME OVER";
        document.getElementById('rank').innerText = win ? (score > (sheet.length * 15) ? "SSS" : "S") : "F";
        document.getElementById('final-score').innerText = `Score: ${score}`;
    }
</script>
</body>
</html>
