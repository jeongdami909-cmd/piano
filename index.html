<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Piano Tiles - V14 Infinite Concert</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root { --neon: #00f2ff; --pink: #ff00ea; --gold: #ffea00; --bg: #000; }
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { color: #fff; height: 100dvh; overflow: hidden; background: #000; transition: background 0.1s; }
        
        .screen { position: absolute; top: 0; left: 50%; width: 100%; height: 100%; max-width: 500px; transform: translateX(-50%); display: none; flex-direction: column; background: #000; border-left: 1px solid #111; border-right: 1px solid #111; }
        #lobby { display: flex; z-index: 100; padding: 20px; }
        h1 { text-align: center; font-size: 28px; font-weight: 900; background: linear-gradient(90deg, var(--neon), var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; padding: 10px 0; }
        
        #song-list { flex: 1; overflow-y: auto; background: rgba(255,255,255,0.02); border-radius: 15px; padding: 10px; margin-bottom: 15px; border: 1px solid #111; }
        .song-item { padding: 16px; border-bottom: 1px solid #111; border-radius: 10px; margin-bottom: 8px; cursor: pointer; transition: 0.2s; }
        .song-item.active { background: rgba(0, 242, 255, 0.15); border: 1px solid var(--neon); box-shadow: inset 0 0 15px rgba(0, 242, 255, 0.2); }
        
        #start-btn { width: 100%; padding: 22px; border-radius: 50px; border: none; font-size: 20px; font-weight: bold; background: linear-gradient(45deg, var(--neon), var(--pink)); color: #fff; cursor: pointer; box-shadow: 0 5px 30px rgba(0, 242, 255, 0.4); }

        #game { overflow: hidden; z-index: 50; position: relative; touch-action: none; }
        #hp-container { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 220px; height: 10px; background: #222; border-radius: 5px; z-index: 60; border: 1px solid #333; }
        #hp-bar { width: 100%; height: 100%; background: #00ff00; border-radius: 5px; transition: 0.3s; box-shadow: 0 0 10px #00ff00; }

        .lane { position: absolute; top: 0; width: 25%; height: 100%; border-right: 1px solid rgba(255,255,255,0.05); pointer-events: none; }
        #hit-line { position: absolute; bottom: 15%; width: 100%; height: 3px; background: rgba(255,255,255,0.4); z-index: 5; pointer-events: none; }
        
        #score { position: absolute; top: 60px; width: 100%; text-align: center; font-size: 65px; font-weight: 900; z-index: 60; text-shadow: 0 0 20px var(--neon); pointer-events: none; }
        #combo { position: absolute; top: 130px; width: 100%; text-align: center; font-size: 24px; color: var(--gold); font-weight: bold; z-index: 60; opacity: 0; transition: 0.1s; pointer-events: none; }
        #combo.show { opacity: 1; transform: scale(1.1); }

        .tile { position: absolute; width: 25%; background: linear-gradient(to bottom, #111, #444); border: 1px solid #000; z-index: 10; pointer-events: none; border-radius: 2px; }
        .tile.pressed { background: linear-gradient(to bottom, var(--neon), #fff) !important; opacity: 0.4; transition: 0.1s; box-shadow: 0 0 30px var(--neon); }
        
        #result { justify-content: center; align-items: center; text-align: center; z-index: 200; background: rgba(0,0,0,0.98); }
    </style>
</head>
<body>

<div id="lobby" class="screen" style="display: flex;">
    <h1>CONCERT V14</h1>
    <p style="text-align:center; color:#888; font-size:13px; margin-bottom:15px;">영상을 압도하는 무한 연주 & 고품격 음색</p>
    <div id="song-list"></div>
    <button id="start-btn">그랜드 피아노 조율 중...</button>
</div>

<div id="game" class="screen">
    <div id="hp-container"><div id="hp-bar"></div></div>
    <div id="score">0</div>
    <div id="combo">0 COMBO</div>
    <div id="hit-line"></div>
    <div class="lane" style="left:0%"></div>
    <div class="lane" style="left:25%"></div>
    <div class="lane" style="left:50%"></div>
    <div class="lane" style="left:75%; border:none;"></div>
</div>

<div id="result" class="screen">
    <h2 id="res-title" style="font-size:32px;">PERFORMANCE END</h2>
    <div id="rank" style="font-size:120px; font-weight:900; color:var(--gold); margin: 20px 0;">S</div>
    <div id="final-score" style="font-size:22px; color:#888; margin-bottom:40px;">Score: 0</div>
    <button onclick="location.reload()" style="padding: 20px 60px; border-radius: 50px; border: none; font-weight: bold; background:#fff; font-size: 20px; cursor: pointer;">다시 공연하기</button>
</div>

<script>
    const songs = [
        { t: "Canon in D", a: "Pachelbel", parts: { A: "F#5+D3_0.5,E5+A2_0.5,D5+B2_0.5,C#5+F#2_0.5,B4+G2_0.5,A4+D3_0.5,B4+G2_0.5,C#5+A2_0.5", B: "D5+D3_0.25,C#5_0.25,D5_0.25,D4_0.25,E4+A2_0.25,F#4_0.25,G4_0.25,A4_0.25,B4+B2_0.25,A4_0.25,G4_0.25,F#4_0.25,E4+F#2_0.25,D4_0.25,E4_0.25,F#4_0.25", C: "G4+G2_0.25,F#4_0.25,E4_0.25,D4_0.25,C#4+D3_0.25,B3_0.25,A3_0.25,G3_0.25" } },
        { t: "겨울바람 (Winter Wind)", a: "Chopin", parts: { A: "E4+A2_0.5,E4_0.5,F4_0.5,E4_0.5,A4+A2_1.0,G#4_0.5,A4_0.5,C5+A2_1.0,B4_0.5,C5_0.5", B: "A5+A2_0.15,G#5_0.15,A5_0.15,F5_0.15,E5+E2_0.15,D#5_0.15,E5_0.15,C5_0.15,B4+B2_0.15,A#4_0.15,B4_0.15,G4_0.15" } },
        { t: "River Flows in You", a: "Yiruma", parts: { A: "F#4+F#2_0.5,E4_0.5,F#4_0.5,C#4+A2_1.0,F#4+F#2_0.5,E4_0.5,F#4_0.5,C#4+A2_1.0", B: "B3+D3_0.5,A3_0.5,B3_0.5,F#3+E3_1.5,F#4+F#2_0.5,E4_0.5,F#4_0.5,C#4+A2_1.0" } }
    ];

    let masterPiano, sheet = [], tiles = [], isPlaying = false, score = 0, combo = 0, hp = 100, sheetIdx = 0, selected = 0;
    let hitLineY, gameStartTime = 0;

    // 🔥 V14: 영상급 찰랑거리는 음색 믹싱 (FM 신스 + 강한 딜레이 + 리버브)
    const reverb = new Tone.Reverb({ decay: 5, wet: 0.4 }).toDestination();
    const delay = new Tone.FeedbackDelay({ delayTime: "8n", feedback: 0.3, wet: 0.2 }).connect(reverb);
    
    masterPiano = new Tone.PolySynth({
        maxPolyphony: 24,
        voice: Tone.FMSynth,
        options: {
            harmonicity: 3, modulationIndex: 8,
            oscillator: { type: "sine" },
            envelope: { attack: 0.005, decay: 0.2, sustain: 0.4, release: 3.0 },
            modulation: { type: "triangle" },
            modulationEnvelope: { attack: 0.1, decay: 0.2, sustain: 0.3, release: 2.5 }
        }
    }).connect(delay);

    function renderSongs() {
        const listDiv = document.getElementById('song-list');
        songs.forEach((s, idx) => {
            const item = document.createElement('div');
            item.className = `song-item ${idx === selected ? 'active' : ''}`;
            item.innerHTML = `<strong>${s.t}</strong><br><small style="color:var(--gold)">${s.a}</small>`;
            item.onclick = () => { selected = idx; renderSongs(); };
            listDiv.appendChild(item);
        });
        document.getElementById('start-btn').innerText = "공연 시작!";
    }
    renderSongs();

    // 🔥 V14: 곡 전개를 무한하게 길게 늘리는 랜덤 변주 파서
    function buildInfiniteSheet(songObj) {
        const noteArray = [];
        let time = 1.5;
        const partKeys = Object.keys(songObj.parts);
        
        // 20회 반복(약 3분 분량)하여 전개부를 대폭 확장
        for (let i = 0; i < 20; i++) {
            const partKey = partKeys[Math.floor(Math.random() * partKeys.length)];
            const items = songObj.parts[partKey].split(',');
            
            items.forEach(item => {
                const [noteStr, durStr] = item.split('_');
                const dur = parseFloat(durStr);
                const notes = noteStr.split('+');
                
                // 음역대 기반 레인 배치
                const m = Tone.Frequency(notes[0]).toMidi();
                let lane = Math.floor(((m - 40) / 40) * 4);
                lane = Math.min(3, Math.max(0, lane));
                
                noteArray.push({ t: time, l: lane, n: notes, d: dur });
                time += dur;
            });
        }
        return noteArray;
    }

    document.getElementById('start-btn').addEventListener('pointerdown', async (e) => {
        e.preventDefault();
        await Tone.start();
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('game').style.display = 'block';
        hitLineY = window.innerHeight * 0.85;

        tiles.forEach(t => t.el.remove());
        tiles = [];
        sheet = buildInfiniteSheet(songs[selected]);
        isPlaying = true; score = 0; combo = 0; hp = 100; sheetIdx = 0;
        updateHP();
        
        Tone.Transport.stop();
        Tone.Transport.position = 0;
        setTimeout(() => {
            gameStartTime = Tone.now();
            Tone.Transport.start();
            requestAnimationFrame(loop);
        }, 150);
    });

    function updateHP() {
        const bar = document.getElementById('hp-bar');
        bar.style.width = hp + "%";
        bar.style.background = hp < 30 ? "#ff0055" : "#00ff00";
    }

    // 🔥 V14: 건반 터치 시 즉각 연주 트리거
    document.getElementById('game').addEventListener("pointerdown", (e) => {
        if (!isPlaying) return;
        const now = Tone.now() - gameStartTime;
        const rect = e.currentTarget.getBoundingClientRect();
        const lane = Math.floor(((e.clientX || e.touches[0].clientX) - rect.left) / (rect.width / 4));

        let hit = false;
        for (let i = 0; i < tiles.length; i++) {
            const o = tiles[i];
            if (o.hit || o.miss || o.data.l !== lane) continue;

            const diff = Math.abs(o.data.t - now);
            if (diff < 0.35) {
                // 영상 속 그 소리! 풍성한 화음 재생
                const vel = 0.7 + Math.random() * 0.3;
                masterPiano.triggerAttackRelease(o.data.n, o.data.d * 1.5, Tone.now(), vel);
                
                o.hit = true; o.el.classList.add("pressed");
                combo++; score += (10 + Math.floor(combo/5));
                document.getElementById('score').innerText = score;
                document.getElementById('combo').innerText = `${combo} COMBO`;
                document.getElementById('combo').classList.add('show');
                hit = true; break;
            }
        }
        if (!hit) {
            hp -= 10; updateHP();
            if (hp <= 0) end(false);
        }
    });

    function loop() {
        if(!isPlaying) return;
        const now = Tone.now() - gameStartTime;
        const LOOKAHEAD = 1.4;
        const speed = hitLineY / LOOKAHEAD;

        while(sheetIdx < sheet.length && sheet[sheetIdx].t < now + LOOKAHEAD) {
            const data = sheet[sheetIdx++];
            const el = document.createElement('div');
            el.className = 'tile';
            el.style.left = (data.l * 25) + '%';
            el.style.height = Math.max(80, data.d * speed * 0.9) + 'px';
            el.style.top = "-500px";
            const obj = { el, data, h: parseFloat(el.style.height), hit: false, miss: false };
            document.getElementById('game').appendChild(el);
            tiles.push(obj);
        }

        for(let i = tiles.length - 1; i >= 0; i--) {
            const o = tiles[i];
            const bottom = hitLineY - (o.data.t - now) * speed;
            o.el.style.top = (bottom - o.h) + "px";

            if(!o.hit && !o.miss && (o.data.t - now) < -0.35) {
                o.miss = true; hp -= 20; updateHP();
                if (hp <= 0) { end(false); return; }
            }
            if(bottom - o.h > window.innerHeight + 100) { o.el.remove(); tiles.splice(i, 1); }
        }
        if(sheetIdx >= sheet.length && tiles.length === 0) end(true);
        else requestAnimationFrame(loop);
    }

    function end(win) {
        isPlaying = false; Tone.Transport.pause();
        setTimeout(() => masterPiano.releaseAll(), 500);
        document.getElementById('game').style.display = 'none';
        document.getElementById('result').style.display = 'flex';
        document.getElementById('res-title').innerText = win ? "PERFECT PERFORMANCE" : "HP EXHAUSTED";
        document.getElementById('rank').innerText = win ? "SSS" : "F";
        document.getElementById('final-score').innerText = `Score: ${score}`;
    }
</script>
</body>
</html>
